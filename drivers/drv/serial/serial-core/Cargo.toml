[package]
name = "serial-core"
description = "The serial family library: UART ports (PL011, NS16550 MMIO/IO-port), early-port handoff, emergency output — the hardware every serial driver and the console share"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
pl011 = ["dep:arm_pl011"]
ns16550-mmio = []
ns16550-ioport = ["dep:uart_16550"]
# Firmware-described early console ports (`earlycon`): the boot console crate
# is the only consumer, so model-only serial builds stay `of`-free.
earlycon = ["dep:of"]

[dependencies]
kerrno.workspace = true
khal = { workspace = true }
memaddr.workspace = true
kirq = { workspace = true }
kspin = { workspace = true }
lazyinit.workspace = true
ringbuf = { workspace = true }
of = { workspace = true, optional = true }
arm_pl011 = { version = "0.1.1", optional = true }
uart_16550 = { version = "0.4", optional = true }
unittest.workspace = true

[package.metadata.cargo-shear]
# khal is consumed only by cfg(unittest) tests under ut-tests (the atomic
# console-write regression, boundary-register E-03). Non-test sources take
# PhysAddr/VirtAddr from memaddr, so no host dependency reaches drivers.
ignored = ["khal"]

[lints]
workspace = true
