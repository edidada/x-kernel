[package]
name = "drv-net"
description = "driver-core network interface drivers: Realtek r8169 family (RTL8125)"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["driver", "net", "x-kernel"]
categories = ["os", "no-std"]

[features]
default = []
rk3588-rtl8125 = []

[dependencies]
driver_base = { workspace = true }
# `busy_wait` is the µs-scale poll the reset sequence needs in probe context
# (boundaries E-05: the same primitive drv/clk and drv/phy register).
khal = { workspace = true }
ktime_types.workspace = true
# The PCI bus type and its id-table row live with the bus, the same way
# `drv-virtio` binds PCI functions (Linux keeps `pci_bus_type` in drivers/pci).
pci = { workspace = true }
subsys_net = { workspace = true }
ksync.workspace = true
log.workspace = true
unittest.workspace = true

[lints]
workspace = true