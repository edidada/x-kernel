[package]
name = "virtio-devices"
edition.workspace = true
description = "The virtio family library: device wrappers over the `virtio-drivers` crate, carrying the family's own device-kind vocabulary"
documentation.workspace = true
keywords = ["x-kernel", "driver", "virtio"]
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[features]
alloc = ["virtio-drivers/alloc"]
block = ["dep:subsys_block", "alloc", "dep:linked_list_r4l"]
gpu = ["alloc", "dep:subsys_display"]
input = ["alloc", "dep:subsys_input"]
net = ["alloc", "dep:subsys_net"]
rng = ["alloc", "dep:subsys_hwrng"]
socket = ["alloc", "dep:subsys_vsock"]
virtio-9p = ["alloc"]

[dependencies]

lazyinit = { workspace = true }

kerrno.workspace = true
driver_base = { workspace = true }
bitflags = { workspace = true }
subsys_block = { workspace = true, optional = true }
subsys_hwrng = { workspace = true, optional = true }
subsys_display = { workspace = true, optional = true }
subsys_input = { workspace = true, optional = true }
subsys_net = { workspace = true, optional = true }
subsys_vsock = { workspace = true, optional = true }
log = { workspace = true }
kspin = { workspace = true }
linked_list_r4l = { workspace = true, optional = true }
virtio-drivers = { workspace = true }
unittest = { workspace = true }
pci = { workspace = true }
zerocopy = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
safe-mmio = { workspace = true }

[lints]
workspace = true
