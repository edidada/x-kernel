[package]
name = "virtio-devices"
edition.workspace = true
description = "The virtio family library: device wrappers over the `virtio-drivers` crate, carrying the family's own device-kind vocabulary"
documentation.workspace = true
keywords = ["x-kernel", "driver", "virtio"]
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[features]
alloc = ["virtio-drivers/alloc"]
block = ["dep:block", "alloc", "dep:linked_list_r4l"]
gpu = ["alloc", "display"]
input = ["alloc", "dep:input"]
net = ["alloc", "dep:net"]
rng = ["alloc", "dep:hwrng"]
socket = ["alloc", "dep:vsock"]
virtio-9p = ["alloc"]

[dependencies]
kerrno.workspace = true
driver-core = { workspace = true }
bitflags = { workspace = true }
block = { workspace = true, optional = true }
hwrng = { workspace = true, optional = true }
display = { workspace = true, optional = true }
input = { workspace = true, optional = true }
net = { workspace = true, optional = true }
vsock = { workspace = true, optional = true }
log = { workspace = true }
kspin = { workspace = true }
linked_list_r4l = { workspace = true, optional = true }
virtio-drivers = { workspace = true }
unittest = { workspace = true }
pci = { workspace = true }
zerocopy = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
safe-mmio = { workspace = true }

[lints]
workspace = true
