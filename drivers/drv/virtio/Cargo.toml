[package]
name = "drv-virtio"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "driver-core virtio drivers: blk/net/rng/gpu/input/vsock/9p devices and the mmio transport"
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["driver", "virtio", "x-kernel"]
categories = ["os", "no-std"]

[features]
default = []
blk = ["dep:subsys_block", "virtio_devices/block"]
net = ["virtio_devices/net"]
rng = ["dep:kpoll", "dep:ktask", "virtio_devices/rng"]
gpu = ["virtio_devices/gpu"]
input = ["virtio_devices/input"]
vsock = ["virtio_devices/socket"]
fs9p = ["virtio_devices/virtio-9p"]
mmio = []

[dependencies]
subsys_vsock = { workspace = true }
subsys_input = { workspace = true }
subsys_display = { workspace = true }
subsys_net = { workspace = true }
kerrno.workspace = true
subsys_block = { workspace = true, optional = true }
driver_base = { workspace = true }
driver_host = { workspace = true, features = ["virtio-hal"] }
subsys_hwrng = { workspace = true }
kpoll = { workspace = true, optional = true }
ktask = { workspace = true, optional = true }
log.workspace = true
pci = { workspace = true }
virtio_devices = { workspace = true, features = ["alloc"] }

[lints]
workspace = true
