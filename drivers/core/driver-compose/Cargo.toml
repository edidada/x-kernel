[package]
name = "driver-compose"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Composition root for the driver-core model: runtime install, DT enumeration, driver registration"
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["driver", "x-kernel"]
categories = ["os", "no-std"]

[features]
default = []
serial-pl011 = ["dep:serial-pl011"]
virtio-blk = ["dep:virtio-blk-core"]
virtio-net = ["dep:virtio-net-core"]
virtio-rng = ["dep:virtio-rng-core"]
ramdisk = ["dep:ramdisk-core"]
ramdisk-static = ["ramdisk", "ramdisk-core/ramdisk-static"]
fixed-clock = ["dep:fixed-clock"]

[dependencies]
console_driver.workspace = true
driver-core.workspace = true
driver-runtime.workspace = true
kclass = { workspace = true, features = ["char"] }
fixed-clock = { workspace = true, optional = true }
khal.workspace = true
pci.workspace = true
of.workspace = true
log.workspace = true
serial-pl011 = { workspace = true, optional = true }
virtio-blk-core = { workspace = true, optional = true }
virtio-net-core = { workspace = true, optional = true }
virtio-rng-core = { workspace = true, optional = true }
ramdisk-core = { workspace = true, optional = true }
block = { workspace = true }
