[package]
name = "kfeat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "XHyper build feature aggregation"

[features]
default = []

smp = [
    "ipi",
    "khal/smp",
    "kruntime/smp",
    "ktask/smp",
    "kspin/smp",
    "kplat-aarch64/smp",
]
ipi = ["dep:kipi", "khal/ipi", "kruntime/ipi"]
fp-simd = ["khal/fp-simd"]

sched_rr = ["ktask/sched_rr"]

alloc = ["dep:alloc-engine", "dep:kalloc"]
alloc_slab = ["alloc", "alloc-engine/slab", "kalloc/slab"]
alloc_tlsf = ["alloc", "alloc-engine/tlsf", "kalloc/tlsf"]
alloc_buddy = ["alloc", "alloc-engine/buddy", "kalloc/buddy"]

platform_kplat_aarch64 = ["dep:kplat-aarch64", "fp-simd", "smp"]
driver_console_pl011 = ["kdriver/console-pl011"]
driver_serial_pl011 = ["kdriver/serial-pl011"]
dwarf = ["backtrace/dwarf"]

[dependencies]
alloc-engine = { workspace = true, optional = true }
backtrace.workspace = true
kalloc = { workspace = true, optional = true }
kdriver.workspace = true
khal.workspace = true
kipi = { workspace = true, optional = true }
kplat-aarch64 = { workspace = true, optional = true, features = ["fp-simd"] }
kruntime.workspace = true
kspin.workspace = true
ktask.workspace = true
