[package]
name = "x-kernel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rs_fdtree = { path = "../drivers/rs-fdtree" }
kernel-elf-loader = { path = "../boot/kernel-elf-loader" }
kernel-elf-parser = { path = "../boot/kernel_elf_parser" }
kbpf = { path = "../core/kbpf" }
rsext4 = { path = "../fs/filesystems/rsext4", default-features = false }
firmware-handoff = { path = "../boot/firmware-handoff" }
fs9p = { path = "../fs/filesystems/fs9p", features = ["fuzz"] }
tee_crypto = { path = "../tee/tee_crypto" }

[[bin]]
name = "fdt_parse"
path = "fuzz_targets/fdt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fdt_typed_helpers"
path = "fuzz_targets/fdt_typed_helpers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kernel_elf_parse"
