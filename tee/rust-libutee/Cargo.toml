[package]
name = "rust-libutee"
version = "0.1.0"
edition = "2024"

[features]
strict_annotation_checks = []
trace-error = []
trace-flow = []
trace-info = []
trace-debug = []

[dependencies]
libc = "0.2"
rand = { version = "0.9.1" }
hex = { version = "0.4" }
mbedtls = { version = "0.13.5", package = "mbedtls-smx", default-features = false, features = [
    "std",
] }
mbedtls-sys-auto = { version = "2.28.14", package = "mbedtls-sys-auto-smx", default-features = false }

[lib]
crate-type = ["staticlib", "rlib"]
name = "rust_utee"
