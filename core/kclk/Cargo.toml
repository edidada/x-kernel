[package]
name = "kclk"
edition.workspace = true
description = "Common clock framework core for x-kernel"
documentation = "https://kylin-x-kernel.github.io/kclk"
keywords = ["clk", "clock", "x-kernel"]
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[features]
default = []

[dependencies]
log.workspace = true
kspin = { workspace = true }
ksync = { workspace = true }
bitflags = { workspace = true }
unittest = { workspace = true }
# Test-only: the concurrency stress test spawns contending kernel tasks.
# A normal dependency (not dev-dependency) because `--cfg unittest` builds do
# not separate dev deps in this workspace's Kconfig flow.
ktask = { workspace = true }

[lints]
workspace = true
