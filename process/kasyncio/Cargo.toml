[package]
name = "kasyncio"
description = "Asynchronous I/O submission/completion infrastructure for X-Kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true

[package.metadata.cargo-shear]
# ut-tests/ uses khal (monotonic time in wait_until) and kns (fork namespace
# flags); shear ignores ut-tests/, so declare them here instead of dropping
# dependencies the guest tests need.
ignored = ["khal", "kns"]

[dependencies]
kerrno.workspace = true
khal.workspace = true
klogger.workspace = true
kpoll.workspace = true
kprocess.workspace = true
ksignal.workspace = true
ksync.workspace = true
ktask.workspace = true
ktime_types.workspace = true
kns.workspace = true
posix-process.workspace = true
posix-types.workspace = true
unittest.workspace = true

[lints]
workspace = true
