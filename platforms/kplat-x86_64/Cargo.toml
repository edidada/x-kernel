[package]
name = "kplat-x86_64"
description = "Implementation of `kplat` hardware abstraction layer for x86 Standard PC machine."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.cargo-shear]
# kcpu is selected by platform features such as fp-simd and is not referenced
# directly in every platform configuration.
ignored = ["kcpu"]

[features]
fp-simd = ["kcpu/fp-simd", "kernel_boot/fp-simd"]
rtc = ["rtc_driver/cmos"]
smp = []
vmm = []
nmi = ["kplat/nmi", "irq_driver/nmi-native", "dep:kcpu_slot", "dep:kirq", "dep:kmutex", "dep:kipi", "dep:kiface-task-api"]
nmi-pmu = ["nmi", "kplat/pmu", "dep:x86-pmu"]
nmi-peer-timer = ["nmi", "dep:ktask"]
pmu = ["nmi-pmu"]

[dependencies]
ktask = { workspace = true, optional = true }
x86-pmu = { workspace = true, optional = true }
kcpu_slot = { workspace = true, optional = true }
kirq = { workspace = true, optional = true }
kmutex = { workspace = true, optional = true }
kipi = { workspace = true, optional = true }
kiface-task-api = { workspace = true, optional = true }
kernel_boot = { workspace = true }
kspin = { workspace = true }
log = "0.4"
kcpu = { workspace = true }
karch = { workspace = true }
kcpu_id_map = { workspace = true }
kerrno = { workspace = true }
kiface = { workspace = true }
kplat = { workspace = true }
console_driver = { workspace = true, features = ["ns16550-ioport"] }
kbuild_config = { workspace = true }
irq_driver = { workspace = true }
khal = { workspace = true }
ktime_types = { workspace = true }
ktime = { workspace = true }
x86_apic = { workspace = true }
rtc_driver = { workspace = true }
timer_driver = { workspace = true }
boot_info = { workspace = true }
acpi = { workspace = true }
klazy = { workspace = true }
multiboot2 = { version = "0.24.1", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { workspace = true }
unittest = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-none"]

[lints]
workspace = true
