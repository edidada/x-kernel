[package]
name = "apploader"
description = "QEMU acceptance TA for uploading dynamic TAs"
enabled = true
order = 50

[prepare]
env = [
  "RUSTFLAGS=",
  "CC=aarch64-linux-musl-gcc",
  "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc",
]
commands = [
  "sh build.sh",
]

[[install]]
src = "target/aarch64-unknown-linux-musl/release/081ba88f-f1ee-452e-b5e8-a7e9ef173a97.ta"
dest = "/tee/ta/081ba88f-f1ee-452e-b5e8-a7e9ef173a97.ta"
mode = "0755"

[[autostart]]
name = "apploader"
command = "/tee/ta/081ba88f-f1ee-452e-b5e8-a7e9ef173a97.ta"
background = true
check_alive = true
