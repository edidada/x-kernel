rule = "CG-047-kconfig-feature-ownership"
check = "capability-bypass"
subject = "kdma -> alloc-engine/tlsf"
reason = "CG-047-kconfig-feature-ownership: crate-local implementation feature: kdma's bounce pool always uses alloc-engine's TlsfByteAllocator, independent of the KFEAT_ALLOC_* byte-allocator choice, so every defconfig enables alloc-engine/tlsf without kfeat/alloc_tlsf."

