capability: work_delayed_kworkng
title: Owned delayed work with prepared timer (kworkng::DelayedWorkHandle)
family: task.work
summary: >-
  delayed_work equivalent: cloneable owner of one delayed callback whose timer is prepared once.
  queue / queue_default arm it after a TimeSpan (zero delay queues without waiting for a tick and
  never runs inline), modify / modify_default re-time it or queue it if idle, flush expedites the
  captured work, cancel_sync discards, shutdown closes and drains Work plus timer delivery.
  Callbacks run in normal worker tasks.
source: {kind: workspace, crate: kworkng, path: task/kworkng}
symbols:
  - {fqn: kworkng::DelayedWorkHandle, kind: struct, path: task/kworkng/src/delayed_work_handle.rs, role: primary}
  - {fqn: kworkng::DelayedWorkHandle::new, kind: fn, path: task/kworkng/src/delayed_work_handle.rs, role: constructor}
  - {fqn: kworkng::DelayedWorkHandle::queue, kind: fn, path: task/kworkng/src/delayed_work_handle.rs, role: operation}
  - {fqn: kworkng::DelayedWorkHandle::queue_default, kind: fn, path: task/kworkng/src/delayed_work_handle.rs, role: operation}
  - {fqn: kworkng::DelayedWorkHandle::modify, kind: fn, path: task/kworkng/src/delayed_work_handle.rs, role: operation}
  - {fqn: kworkng::DelayedWorkHandle::modify_default, kind: fn, path: task/kworkng/src/delayed_work_handle.rs, role: operation}
  - {fqn: kworkng::DelayedWorkHandle::cancel_pending, kind: fn, path: task/kworkng/src/delayed_work_handle.rs, role: operation}
  - {fqn: kworkng::DelayedWorkHandle::cancel_sync, kind: fn, path: task/kworkng/src/delayed_work_handle.rs, role: operation}
  - {fqn: kworkng::DelayedWorkHandle::flush, kind: fn, path: task/kworkng/src/delayed_work_handle.rs, role: operation}
  - {fqn: kworkng::DelayedWorkHandle::shutdown, kind: fn, path: task/kworkng/src/delayed_work_handle.rs, role: operation}
operations:
  - name: queue_modify
    symbols: [kworkng::DelayedWorkHandle::queue_default, kworkng::DelayedWorkHandle::modify_default]
    effect: queue_default does not replace pending work; modify_default replaces its delay or queues an occurrence when none is pending; a running callback is not interrupted
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "`queue_default` does not replace pending work; `modify_default` replaces its"}
  - name: flush
    symbols: [kworkng::DelayedWorkHandle::flush]
    effect: expedites the captured work and waits; not a wait for the original timer deadline and does not follow later retiming
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "Delayed flush expedites captured work; it is not a wait for the original timer"}
contract:
  no_std:
    value: "yes (#![no_std])"
    evidence: [{path: task/kworkng/src/lib.rs, quote: "#![no_std]"}]
  allocation:
    value: "preparation allocates (stable Work, timer and reclamation storage, sleepable context); queue / modify are IRQ-compatible and allocation-free"
    evidence:
      - {path: task/kworkng/src/delayed_work_handle.rs, item: kworkng::delayed_work_handle::DelayedWorkHandle::new, quote: "Prepares stable Work, timer and reclamation storage in sleepable context."}
      - {path: task/kworkng/src/delayed_work_handle.rs, item: kworkng::delayed_work_handle::DelayedWorkHandle::queue, quote: "IRQ-compatible and allocation-free."}
  blocking:
    value: "queue/modify/cancel_pending do not sleep; flush, cancel_sync and shutdown need sleepable task context; callbacks run in normal worker tasks"
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "flush/cancel_sync/shutdown/close_and_drain | Sleepable task; allow callback progress"}
      - {path: task/kworkng/src/delayed_work_handle.rs, item: kworkng::delayed_work_handle::DelayedWorkHandle, quote: "Callbacks execute in normal tasks."}
  irq_nmi:
    value: "prepared queue/modify valid in task, BH or hard IRQ; NMI unsupported"
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "Prepared queue/modify/cancel_pending | Task, BH or hard IRQ; no allocation or sleep"}
      - {path: task/kworkng/src/delayed_work_handle.rs, item: kworkng::delayed_work_handle::DelayedWorkHandle, quote: "dependency deadlocks remain caller errors. NMI is unsupported."}
  ownership_lifetime:
    value: "last handle Drop asynchronously cancels and drains Work and physical timer delivery before destroying captures; shut down each delayed handle before closing a private queue"
    evidence:
      - {path: task/kworkng/src/delayed_work_handle.rs, item: kworkng::delayed_work_handle::DelayedWorkHandle, quote: "Last handle Drop asynchronously cancels and"}
      - {path: task/kworkng/src/lib.rs, quote: "delayed.shutdown().unwrap(); // Drain each delayed handle BEFORE closing its queue."}
  errors_bounds:
    value: "queue/modify return Result<LogicalCpuId, ArmError> (Admission(Closed) after shutdown, or queue/timer validation errors); flush returns DelayedFlushError; positive delays use monotonic time"
    evidence:
      - {path: task/kworkng/src/delayed_work_handle.rs, item: kworkng::delayed_work_handle::DelayedWorkHandle::queue, quote: "Returns Admission(Closed) after shutdown, or queue/timer validation errors."}
      - {path: task/kworkng/src/lib.rs, quote: "The handle prepares its timer once. Positive delays use monotonic time; zero"}
  concurrency:
    value: "concurrent modification can retire the captured flush obligation without executing it; nonblocking cancellation alone does not prove physical timer delivery has ended"
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "deadline and does not follow later retiming. Concurrent modification can retire"}
