notes: "2026-11-01 rebase onto main 549d05ff0（!1128/!1210）：interruptible 现先 poll 内层 future，仅在 Pending 后才消费中断（进度优先于信号）；已改 interruptible 的 effect 并补引文；Interrupted::is_signal 已更名 is_task_interrupt（卡片未引用）；prepare/park 的可睡眠判定改由 ktask::is_sleepable_context 统一，另拒绝 RCU 读区间，已补入 irq_nmi/errors_bounds。"
