capability: task_block_on_ktask
title: Block the current task on a future, with prepared parking and signal interruption (ktask::future::block_on / PreparedTaskWait / interruptible)
family: task.poll
summary: >-
  The sync-over-async bridge of the kernel. block_on(fut) polls a future on the current task with a
  task-bound Waker and parks the task (park_task) between polls; interruptible(fut) wraps a future so
  a signal (interrupt_task) completes it with Err(Interrupted); PreparedTaskWait::prepare allocates
  one reusable Waker up front so a later park() neither allocates nor registers anything. Wakeups are
  hints: callers recheck their predicate.
source: {kind: workspace, crate: ktask, path: task/ktask}
symbols:
  - {fqn: ktask::future::block_on, kind: fn, path: task/ktask/src/future/mod.rs, role: primary}
  - {fqn: ktask::future::PreparedTaskWait, kind: struct, path: task/ktask/src/future/mod.rs, role: primary}
  - {fqn: ktask::future::PreparedTaskWait::prepare, kind: fn, path: task/ktask/src/future/mod.rs, role: constructor}
  - {fqn: ktask::future::PreparedTaskWait::waker, kind: fn, path: task/ktask/src/future/mod.rs, role: operation}
  - {fqn: ktask::future::PreparedTaskWait::park, kind: fn, path: task/ktask/src/future/mod.rs, role: operation}
  - {fqn: ktask::future::interruptible, kind: fn, path: task/ktask/src/future/mod.rs, role: operation}
  - {fqn: ktask::future::Interrupted, kind: struct, path: task/ktask/src/future/mod.rs, role: helper}
operations:
- name: block_on
  symbols:
  - ktask::future::block_on
  effect: poll the future with a task waker and park the current task while it is Pending until woken;
    does not handle interruption by itself
  evidence:
  - path: task/ktask/src/future/mod.rs
    item: ktask::future::block_on
    quote: Blocks the current task until the given future is resolved.
- name: prepared_wait
  symbols:
  - ktask::future::PreparedTaskWait::prepare
  - ktask::future::PreparedTaskWait::park
  - ktask::future::PreparedTaskWait::waker
  effect: prepare validates a sleepable context and allocates one reusable waker; waker() clones it without
    allocating; park() parks until a wake hint (may return spuriously)
  evidence:
  - path: task/ktask/src/future/mod.rs
    item: ktask::future::PreparedTaskWait::prepare
    quote: Call with IRQs enabled and without any lock that forbids sleeping.
  - path: task/ktask/src/future/mod.rs
    item: ktask::future::PreparedTaskWait::park
    quote: May return spuriously. No wait registration, waker allocation or signal
- name: interruptible
  symbols:
  - ktask::future::interruptible
  effect: polls the wrapped future first and returns its value whenever ready (operation progress beats
    signal delivery; a pending interrupt stays pending); only after the future reports Pending does a
    task interrupt (signal) complete the wait with Err(Interrupted), as does a poll registration failure
  evidence:
  - path: task/ktask/src/future/mod.rs
    item: ktask::future::interruptible
    quote: /// Makes a future interruptible.
  - path: task/ktask/src/future/mod.rs
    item: ktask::future::interruptible
    quote: Operation progress has priority over signal delivery. The wrapped future is
  - path: task/ktask/src/future/mod.rs
    item: ktask::future::interruptible
    quote: curr.poll_interrupt(&mut context)
