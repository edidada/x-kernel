    - path: task/ktask/src/lib.rs
      quote: '#![cfg_attr(not(test), no_std)]'
  allocation:
    value: PreparedTaskWait::prepare allocates one reusable waker following the kernel's infallible Arc
      OOM policy; park() performs no waker allocation; block_on allocation behaviour is not documented
    evidence:
    - path: task/ktask/src/future/mod.rs
      item: ktask::future::PreparedTaskWait::prepare
      quote: The allocation follows the kernel's infallible Arc OOM policy.
    - path: task/ktask/src/future/mod.rs
      item: ktask::future::PreparedTaskWait::park
      quote: No wait registration, waker allocation or signal
  blocking:
    value: parks (sleeps) the current task; park() asserts a sleepable context and that the preparing
      task is the caller
    evidence:
    - path: task/ktask/src/future/mod.rs
      item: ktask::future::PreparedTaskWait::park
      quote: Panics if called by another task or outside sleepable context. The
  irq_nmi:
