    - path: task/ktask/src/future/mod.rs
      item: ktask::future::PreparedTaskWait::waker
      quote: It holds only a weak task reference and may outlive this handle.
  errors_bounds:
    value: prepare returns KError::InvalidInput for no task, masked IRQs, interrupt-like context, disabled
