      / InvalidInput (poll registration failures)
    evidence:
    - path: task/ktask/src/future/mod.rs
      item: ktask::future::PreparedTaskWait::prepare
      quote: pub fn prepare() -> KResult<Self> {
    - path: task/ktask/src/future/mod.rs
      item: ktask::future::Interrupted
      quote: pub struct Interrupted(InterruptCause);
    - path: task/ktask/src/future/mod.rs
      item: ktask::future::KError::from
      quote: InterruptCause::Registration(PollRegisterError::InvalidState) => KError::InvalidInput,
  concurrency:
    value: 'wake hints, not completion results: spurious returns happen, callers must recheck their own
      predicate and keep their wake source registered while needed'
    evidence:
    - path: task/ktask/src/future/mod.rs
      item: ktask::future::PreparedTaskWait
      quote: 'are hints, not completion results: callers must recheck their predicate.'
