      (prepare rejects masked IRQs, interrupt-like context, disabled preemption and RCU read sections)
    evidence:
    - path: task/ktask/src/future/mod.rs
      item: ktask::future::PreparedTaskWait
      quote: the independently owned [`Waker`] may be notified from IRQ context. Wakeups
    - path: task/ktask/src/future/mod.rs
      item: ktask::future::PreparedTaskWait::prepare
      quote: Returns [`KError::InvalidInput`] before allocation if no non-idle task
  ownership_lifetime:
    value: PreparedTaskWait is neither Send nor Sync (task-bound); the waker holds only a weak task reference
      and may outlive the handle
    evidence:
    - path: task/ktask/src/future/mod.rs
