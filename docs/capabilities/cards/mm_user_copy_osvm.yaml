aliases:
  en: [copy_to_user, copy_from_user, put_user, get_user, user pointer read, user pointer write, read user memory, write user memory, uaccess, userspace buffer copy, UserPtr, UserBuf]
  zh: [拷贝到用户态, 从用户态拷贝, 用户内存读写, 用户指针访问, 用户缓冲区拷贝, 用户态地址读取]
identifiers: [copy_to_user, copy_from_user, put_user, get_user, user_ptr, uptr, "*mut T as user", EFAULT, BadAddress, "ptr::copy_nonoverlapping", "slice::from_raw_parts(user", UserPtr, write_vm, read_vm]
exclusions:
- needs a thread with a user address space; the kuaccess provider returns NoAccess when called from a
  kernel task without one
- not for copying between kernel buffers - use slice copy_from_slice / copy_within
- Copies may sleep on page faults; do not call under spinlocks or with IRQs disabled. kuaccess nofault
  atomics cover only aligned u32 words, not an arbitrary nofault byte-copy replacement.
- typed variants fail with InvalidAddr on a misaligned pointer; use read_vm_bytes / write_vm_bytes for
  unaligned data
counter_examples:
  - path: process/osvm/src/vm_io.rs
    item: osvm::vm_io::VmBytes
    why: VmBytes wraps the same copy primitive as a streaming Read, tracking a cursor; use it for send/recv style APIs, not for one-shot struct copies (see io_user_buffer_osvm)
    evidence: [{path: process/osvm/src/vm_io.rs, item: osvm::vm_io::VmBytes, quote: "Implements [`Read`] so it can be passed to socket/file send operations."}]
notes: >-
  The osvm crate only defines the contract; the architecture glue (range check, exception-table
  user_copy, page-fault retry) is core/kuaccess (impl VirtMemIo for Vm). A change that adds a second
  raw copy loop against user addresses duplicates this.
