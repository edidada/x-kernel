operations:
- name: notify
  symbols:
  - kipi::notify_reschedule
  - kipi::notify_bottom_half
  - kipi::notify_rcu
  effect: sets the reason bit in the destination CPU's pending word (one fetch_or) and, once notifications
    are enabled, sends the IPI (also to self); success means accepted, not executed
  evidence:
  - path: arch/kipi/src/notification.rs
    item: kipi::notification::PendingWord::request
    quote: NotificationFlags::from_bits_retain(self.0.fetch_or(reason.bits(), Ordering::AcqRel))
  - path: arch/kipi/src/notification.rs
    item: kipi::notification::notify_reschedule
    quote: Successful return means accepted, not executed.
contract:
  no_std:
    value: "yes (kipi is cfg_attr no_std unless test)"
    evidence: [{path: arch/kipi/src/lib.rs, quote: "#![cfg_attr(not(test), no_std)]"}]
  allocation:
    value: "allocation-free; no closure is queued"
    evidence:
      - {path: arch/kipi/src/notification.rs, quote: "Allocation-free CPU notifications and their one-way boot handshake."}
      - {path: arch/kipi/src/notification.rs, item: kipi::notification::notify_rcu, quote: "Does not allocate or sleep."}
  blocking:
    value: "never sleeps; may be called with IRQs disabled and scheduler locks held (notify_reschedule); callers must release timer locks before notify_timer_reprogram"
    evidence:
      - {path: arch/kipi/src/notification.rs, item: kipi::notification::notify_reschedule, quote: "May be called with IRQs disabled and scheduler locks held; does not sleep."}
  irq_nmi:
    value: "bottom-half kicks may run in task, softirq or hardirq context including with IRQs disabled; NMI and CPU hotplug unsupported"
    evidence:
      - {path: arch/kipi/src/notification.rs, item: kipi::notification::notify_bottom_half, quote: "May run in task, softirq or hardirq context, including with IRQs disabled."}
      - {path: arch/kipi/src/notification.rs, item: kipi::notification::notify_rcu, quote: "NMI and CPU hotplug are unsupported."}
  ownership_lifetime:
    value: "no ownership transfer: only a reason bit is set; the receiving side owns the demand state (source demand must be published before the kick)"
    evidence:
      - {path: arch/kipi/src/notification.rs, item: kipi::notification::notify_bottom_half, quote: "Publish source demand and release its locks before calling."}
  errors_bounds:
    value: "Result<(), KipiError>: InvalidCpuId for an out-of-range or absent CPU; fixed five reasons only"
    evidence:
      - {path: arch/kipi/src/notification.rs, item: kipi::notification::notify_bottom_half, quote: "pub fn notify_bottom_half(cpu_id: LogicalCpuId) -> Result<()> {"}
      - {path: arch/kipi/src/notification.rs, quote: "const BOTTOM_HALF = 1 << 3;"}
  concurrency:
    value: "requests coalesce in a per-CPU AtomicUsize pending word; enable and take use the same word so that either the boot drain sees a request or the sender issues an IPI"
    evidence:
      - {path: arch/kipi/src/notification.rs, item: kipi::notification::PendingWord::request, quote: "// Publication and observing readiness must share one RMW: either"}
      - {path: arch/kipi/src/notification.rs, item: kipi::notification::PENDING, quote: "static PENDING: [PendingWord; kbuild_config::NR_CPUS] ="}
