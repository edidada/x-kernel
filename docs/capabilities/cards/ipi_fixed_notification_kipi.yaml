capability: ipi_fixed_notification_kipi
title: Allocation-free fixed-reason CPU kicks over IPI (kipi::notify_reschedule / notify_bottom_half / notify_rcu)
family: cpu.ipi
summary: >-
  Fixed set of cross-CPU requests carried as bits in a per-CPU atomic pending word (RESCHEDULE,
  TIMER_REPROGRAM, BOTTOM_HALF, HIGHPRI_BOTTOM_HALF, RCU) plus one shared IPI. A sender sets the bit
  with one fetch_or and sends the IPI; the receiver's handler takes the bits and calls the scheduler,
  timer, or raises the matching softirq. Requests coalesce, nothing is allocated or queued, it may
  be used with IRQs disabled and scheduler locks held, and requests made before
  enable_fixed_notifications are retained for a boot drain. It carries no closure.
