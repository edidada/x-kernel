identifiers: [IPI_RESCHEDULE, smp_send_reschedule, resched_curr, kick_cpu, reschedule, notify_cpu, pending_bits, AtomicUsize, fetch_or, IPI_IRQ]
exclusions:
- only the five fixed reasons; arbitrary work needs ipi_call_function_kipi (closure queue)
- success means accepted, not executed; repeated requests coalesce, so it is not an event counter
- the destination must have its service/softirq action installed before demand is published
- no NMI and no CPU hotplug
- NMI/IRQ masking and CPU hotplug semantics belong to each request API. The request bits are notifications,
  not a replacement for a suspend/resume tick-broadcast timer service.
counter_examples: []
notes: "notify_reschedule and notify_timer_reprogram exist only with the reschedule / timer-reprogram cargo features."
