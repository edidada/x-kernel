aliases:
  en: [UserPtr, user pointer, copy_from_user wrapper, syscall argument pointer, __user pointer, const user pointer, get_user, put_user, copy_to_user, getname, user struct read, user struct write]
  zh: [用户指针, 系统调用用户指针, 用户态结构体读取, 用户态结构体写入, 用户字符串读取, 用户态拷贝封装]
identifiers: [UserPtr, UserConstPtr, "*const T as user", "*mut T as user", copy_from_user, copy_to_user, __user, get_user, put_user, read_vm, write_vm, load_string, UserRead, UserWrite, "#[derive(UserRead"]
exclusions:
  - UserRead / UserWrite are unsafe markers - only ABI types without invalid bit patterns (read) or implicit padding (write) qualify; types with padding or enums need explicit field modelling
  - the helpers read the current thread's address space and may block; they are not a replacement for the nofault atomics in mm_user_atomic_word_kuaccess
  - unbounded load_string / load_vm_vec must not be given an unchecked user length
counter_examples:
  - path: process/osvm/src/ptrs.rs
    item: osvm::ptrs::VirtPtr
    why: osvm::VirtPtr / VirtMutPtr are the lower-level pointer traits on raw pointers (AnyBitPattern based, no syscall ABI markers); UserPtr is the syscall-layer wrapper and implements VirtPtr
    evidence: [{path: posix/types/src/ptr.rs, quote: "impl<T> VirtPtr for UserPtr<T> {"}]
