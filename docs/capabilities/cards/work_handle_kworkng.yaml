exclusions:
- 'a pending occurrence rejects another submission: not an event counter; producers needing counted events
  must keep their own counter and drain it in the callback'
- owned-handle callbacks run in sleepable worker tasks, never inline and never in BH; for non-sleeping
  BH callbacks use the borrowed-work path (work_prepared_kworkqueue_ng)
- prepare in sleepable task context only; not usable before kworkng runtime services (kworkng::runtime::init)
  are up
- 'last handle Drop is not a completion barrier: use flush/shutdown before freeing anything the callback
  touches'
- time-delayed work is a separate handle (work_delayed_kworkng); for raw timers see timer_core_ktimer_core
- Normal worker callbacks and BH/softirq callbacks have different sleep/IRQ contracts. Do not recommend
  an owned normal WorkHandle as a timing/context-equivalent replacement for a tasklet.
counter_examples: []
notes: >-
  The kworkng facade replaces the legacy workqueue (crate docs say it does not replace legacy
  workqueues by itself). Worker-pool internals are in kworkerpool_ng (worker_pool_kworkerpool_ng).
