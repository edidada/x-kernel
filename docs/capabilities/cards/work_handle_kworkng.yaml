capability: work_handle_kworkng
title: Owned deferred work on per-CPU worker tasks (kworkng::WorkHandle / NormalQueue / queue_static_work)
family: task.work
summary: >-
  Linux workqueue-style deferred execution. WorkHandle is a cloneable, safe owner of one prepared
  callback that runs in a normal (sleepable) worker task; prepare it once in task context, then
  queue / queue_default it from task, BH or hard IRQ context without allocating or sleeping.
  flush waits, cancel_pending revokes without waiting, cancel_sync drains, shutdown closes admission
  permanently. NormalQueue is a private queue (per-CPU allowance, routing policy) with flush and
  close_and_drain; queue_static_work submits kernel-lifetime Work. A pending occurrence rejects
  another submission (AlreadyQueued): submission is not an event counter.
