operations:
  - name: queue
    symbols: [kworkng::WorkHandle::queue, kworkng::WorkHandle::queue_default, kworkng::queue_static_work]
    effect: submit the prepared Work to a normal queue (default per-CPU queue or a NormalQueue) without allocation or sleeping; Err(AlreadyQueued) if an occurrence is pending
    evidence:
      - {path: task/kworkng/src/work_handle.rs, item: kworkng::work_handle::WorkHandle::queue, quote: "Submits to a normal queue without allocation or sleeping, including in IRQ."}
      - {path: task/kworkng/src/lib.rs, quote: "queues use current-CPU policy. A pending occurrence rejects another ordinary"}
  - name: flush_cancel_shutdown
    symbols: [kworkng::WorkHandle::flush, kworkng::WorkHandle::cancel_pending, kworkng::WorkHandle::cancel_sync, kworkng::WorkHandle::shutdown]
    effect: flush waits without canceling or closing; cancel_pending revokes pending work without waiting; cancel_sync cancels and drains but allows later submissions; shutdown permanently closes all clones and drains
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "[`WorkHandle::cancel_pending`] does not wait."}
      - {path: task/kworkng/src/work_handle.rs, item: kworkng::work_handle::WorkHandle::shutdown, quote: "Permanently closes every clone, then synchronously drains in task context."}
usage_protocol:
  - step: "prepare WorkHandle::new in sleepable task context, share clones with producers (IRQ handlers included), flush when the callback must finish, shutdown before dropping the last handle if completion matters"
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "Prepare once in task context, then reuse the handle from producers, including"}
      - {path: task/kworkng/src/lib.rs, quote: "drains. Last handle Drop is asynchronous reclamation, not a completion barrier,"}
contract:
  no_std:
    value: "yes (#![no_std], nightly allocator_api)"
    evidence: [{path: task/kworkng/src/lib.rs, quote: "#![no_std]"}]
  allocation:
    value: "preparation (WorkHandle::new, NormalQueue::new) is sleepable task context and may allocate; prepared queue/cancel_pending/modify calls neither allocate nor sleep"
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "Owned handle/queue preparation | Sleepable task; may allocate"}
      - {path: task/kworkng/src/lib.rs, quote: "Prepared queue/modify/cancel_pending | Task, BH or hard IRQ; no allocation or sleep"}
  blocking:
    value: "queue / cancel_pending do not sleep; flush, cancel_sync, shutdown and close_and_drain need sleepable task context and callback progress; callbacks of owned/static normal work run in worker tasks and may sleep, but must not wait for their own Work"
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "flush/cancel_sync/shutdown/close_and_drain | Sleepable task; allow callback progress"}
      - {path: task/kworkng/src/lib.rs, quote: "Do not synchronously wait on this Work from its callback or hold resources it"}
  irq_nmi:
    value: "submission valid in task, BH and hard IRQ context; NMI submission unsupported"
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "NMI submission is unsupported. Owned/static normal callbacks run in worker"}
      - {path: task/kworkng/src/normal_queue.rs, item: kworkng::normal_queue::NormalQueue::queue_static_work, quote: "Valid in task/BH/hard IRQ context, not NMI. Does not allocate or sleep."}
  ownership_lifetime:
    value: "WorkHandle clones share one Work identity and shutdown gate; callbacks own their captures (static / Arc, no borrowed stack captures); last handle Drop asynchronously reclaims and may cancel pending work; NormalQueue Drop does not drain"
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "IRQ handlers. Clones share one Work identity and shutdown gate, not independent"}
      - {path: task/kworkng/src/normal_queue.rs, item: kworkng::normal_queue::NormalQueue, quote: "queue or access to its underlying handle is provided. Drop does not drain."}
  errors_bounds:
    value: "queue returns Result<LogicalCpuId, SubmitError> (Closed after shutdown, AlreadyQueued, admission/ownership rejection); waits return WaitError; creation returns HandleCreateError for invalid context or unavailable services; per-CPU active allowance is configured by QueueConfig, not a worker count"
    evidence:
      - {path: task/kworkng/src/work_handle.rs, item: kworkng::work_handle::WorkHandle::queue, quote: "Returns Closed after handle shutdown or ordinary queue admission rejection."}
      - {path: task/kworkng/src/lib.rs, quote: "[`QueueConfig`] fixes allowed CPUs, routing and **per-CPU** active allowance,"}
  concurrency:
    value: "multi-producer safe submission; a running callback is not interrupted; callback dependency deadlocks remain caller errors; Last handle Drop is not a barrier"
    evidence:
      - {path: task/kworkng/src/work_handle.rs, item: kworkng::work_handle::WorkHandle, quote: "cannot invalidate storage; callback dependency deadlocks remain caller errors."}
