capability: percpu_static_kcpu_slot
title: Static per-CPU variables via linker templates (kcpu_slot cpu_slot! / CpuSlot / CpuSlotCell)
family: cpu.percpu
summary: >-
  Typed per-CPU storage. cpu_slot! / cpu_slot_cell! declare a bitwise-copyable template in the
  `.cpu_slot.template` section; boot code (begin_cpu_init) copies one area per CPU and installs the
  architecture per-CPU base register, so hot-path access is base + offset with no lock. Access is
  gated by capability guards: CpuLocalGuard (no migration and no local IRQ reentry) for any value,
  or T: Sync for shared atomics; remote CPUs are read only through a published CpuArea.
