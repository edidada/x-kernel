exclusions:
- static templates must be bitwise copyable (StaticSlotValue); Vec, Box, Arc and other owning types need
  DynamicCpuSlot (percpu_dynamic_kcpu_slot) or a per-CPU array indexed by CPU id behind a lock
- 'the guard (CpuLocalGuard, today only kspin::NoPreemptIrqSave) provides exclusion, not the slot: a plain
  NoPreempt does not stop local IRQ reentry'
- needs boot-time per-CPU area initialization (begin_cpu_init) and the base register; unusable before
  then and on unsupported architectures
- 'remote CPU access is shared-read only for T: Sync; there is no remote write API'
- not a replacement for a plain [AtomicX; NR_CPUS] array when the data must be read cheaply by all CPUs
  with no area publication or base register (e.g. per-CPU stats scanned remotely)
- 'Remote access returns a shared &T for T: Sync; interior-mutability operations such as atomic stores
  remain possible. It supplies neither exclusive remote mutation nor a snapshot of all CPUs.'
counter_examples: []
notes: >-
  khal::percpu only re-exports kplat::cpu init/id helpers (no storage). The pre-kcpu_slot `percpu`
  crate was removed (design.md).
