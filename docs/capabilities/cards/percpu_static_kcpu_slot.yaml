operations:
  - name: local_access
    symbols: [kcpu_slot::CpuSlot::get, kcpu_slot::CpuSlot::with_current_irq_disabled, kcpu_slot::CpuSlot::current_shared]
    effect: "access the current CPU's value under a CpuLocalGuard (any StaticSlotValue), in a short IRQ-masked closure (T: Sync), or without a guard for T: Sync (atomics)"
    evidence:
      - {path: arch/kcpu_slot/src/static_slot.rs, item: kcpu_slot::static_slot::CpuSlot::get, quote: "The guard's guarantee makes any [`StaticSlotValue`] — `Sync` or not —"}
      - {path: arch/kcpu_slot/src/static_slot.rs, item: kcpu_slot::static_slot::CpuSlot::with_current_irq_disabled, quote: "The slot area must already be initialized. The callback must not block,"}
  - name: remote_read
    symbols: [kcpu_slot::CpuSlot::at]
    effect: "shared read of another CPU's value through a checked, published CpuArea (T: Sync); no unconditional remote write API"
    evidence:
      - {path: arch/kcpu_slot/src/static_slot.rs, item: kcpu_slot::static_slot::CpuSlot::at, quote: "/// Shares a value in a checked, published CPU area."}
  - name: boot
    symbols: [kcpu_slot::begin_cpu_init]
    effect: copies the template into a CPU's area and installs the base register; BootCpuToken::publish makes the area visible to remote readers
    evidence:
      - {path: arch/kcpu_slot/src/guard.rs, item: kcpu_slot::guard::BootCpuToken, quote: "The token exists after the template has been copied and selected in the"}
usage_protocol:
  - step: "declare `cpu_slot_cell! { static NAME: T = init; }` (T: StaticSlotValue), take a kspin::NoPreemptIrqSave (a CpuLocalGuard) and read / write through it; use atomics with current_shared for IRQ-safe counters"
    evidence:
      - {path: arch/kcpu_slot/docs/design.md, quote: "`CpuLocalGuard` capability trait"}
contract:
  no_std:
    value: yes (#![no_std], uses alloc)
    evidence:
    - path: arch/kcpu_slot/src/lib.rs
      quote: '#![no_std]'
  allocation:
    value: static slots live in the linker-reserved per-CPU areas and need no allocation at access time;
      the templates themselves are static
    evidence:
    - path: arch/kcpu_slot/src/lib.rs
      quote: Static templates live in `.cpu_slot.template`; boot code initializes one
  blocking:
    value: direct slot lookup is address computation; with_current_irq_disabled requires a callback that
      does not block, schedule, change the CPU base or enable IRQs. It does not establish that arbitrary
      payload operations never block.
    evidence:
    - path: arch/kcpu_slot/src/static_slot.rs
      item: kcpu_slot::static_slot::CpuSlot::with_current_irq_disabled
      quote: The callback must not block,
  irq_nmi:
    value: 'CpuLocalGuard excludes local IRQ reentry; with_current_irq_disabled does not exclude NMI (T:
      Sync required); T: Sync values may be shared with IRQ/NMI contexts'
    evidence:
    - path: arch/kcpu_slot/src/static_slot.rs
      item: kcpu_slot::static_slot::CpuSlot::with_current_irq_disabled
      quote: 'NMI is not excluded; `T: Sync` remains required.'
    - path: arch/kcpu_slot/src/static_slot.rs
      item: kcpu_slot::static_slot::CpuSlot::current
      quote: Sync` permits concurrent shared access from IRQ/NMI contexts.
  ownership_lifetime:
    value: values are bitwise copies of the template, never dropped; types with ownership, drop or self-reference
      must use DynamicCpuSlot; slots live as long as the kernel
    evidence:
    - path: arch/kcpu_slot/src/static_slot.rs
      item: kcpu_slot::static_slot::StaticSlotValue
      quote: ownership, drop, reference, or self-reference semantics must use
  errors_bounds:
    value: begin_cpu_init returns Result<BootCpuToken, CpuInitError>; unsupported architectures fail to
      compile; CPU count and area size come from the linker layout
    evidence:
    - path: arch/kcpu_slot/src/layout.rs
      item: kcpu_slot::layout::begin_cpu_init
      quote: 'pub unsafe fn begin_cpu_init(cpu: CpuId) -> Result<BootCpuToken, CpuInitError> {'
    - path: arch/kcpu_slot/docs/design.md
      quote: '`compile_error!` 拒绝'
  concurrency:
    value: 'per-CPU exclusion is established by the caller''s guard, not by the slot; CpuSlotCell is Sync
      only because every accessor is unsafe or requires T: Sync; adjacent CPU areas never share a cache
      line'
    evidence:
    - path: arch/kcpu_slot/src/static_slot.rs
      quote: '// SAFETY: Sharing `&CpuSlotCell<T>` does not expose a value directly: the'
    - path: arch/kcpu_slot/docs/design.md
      quote: '**相邻 CPU area 永不共享一条 cache line**'
