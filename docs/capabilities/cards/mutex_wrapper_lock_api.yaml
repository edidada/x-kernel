capability: mutex_wrapper_lock_api
title: Generic Mutex / RwLock / guard types over a user-supplied raw lock (lock_api)
family: sync.mutex
summary: >-
  lock_api supplies the data-owning Mutex<R, T>, RwLock<R, T> and RAII guards; the caller implements
  only the raw protocol (RawMutex::lock / try_lock / unlock, RawRwLock) and a GuardMarker (GuardSend or
  GuardNoSend). The kernel's blocking Mutex and RwLock are lock_api wrappers over an in-tree raw
  lock, and ktracing builds its tracing lock the same way. Use it when a new lock flavour needs the
  standard guard API without re-writing guards and data cells.
source: {kind: dependency, crate: lock_api, version: 0.4.14}
symbols:
  - {fqn: lock_api::RawMutex, kind: trait, path: src/mutex.rs, role: primary}
  - {fqn: lock_api::Mutex, kind: struct, path: src/mutex.rs, role: primary}
  - {fqn: lock_api::Mutex::const_new, kind: fn, path: src/mutex.rs, role: constructor}
  - {fqn: lock_api::Mutex::lock, kind: fn, path: src/mutex.rs, role: operation}
  - {fqn: lock_api::Mutex::try_lock, kind: fn, path: src/mutex.rs, role: operation}
  - {fqn: lock_api::MutexGuard, kind: struct, path: src/mutex.rs, role: helper}
  - {fqn: lock_api::RawRwLock, kind: trait, path: src/rwlock.rs, role: primary}
  - {fqn: lock_api::RwLock, kind: struct, path: src/rwlock.rs, role: primary}
  - {fqn: lock_api::RwLock::const_new, kind: fn, path: src/rwlock.rs, role: constructor}
  - {fqn: lock_api::GuardSend, kind: struct, path: src/lib.rs, role: helper}
  - {fqn: lock_api::GuardNoSend, kind: struct, path: src/lib.rs, role: helper}
