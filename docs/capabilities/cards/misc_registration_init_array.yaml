aliases:
  en: [initcall, module_init, __initcall, constructor, ctor, init array, early init registration, subsystem init hook, register filesystem at boot]
  zh: [初始化函数注册, 构造函数, 初始化数组, 子系统初始化钩子, 启动时注册]
identifiers: [initcall, module_init, "__attribute__((constructor))", ctor, ".init_array", link_section, init_fn, INIT_FNS, register_fs, "static INIT"]
exclusions:
  - the macro does not specify an order between entries; code with initialization dependencies needs explicit calls in kruntime
  - functions run once in the early init stage; they cannot return errors
counter_examples: []
notes: >-
  kruntime::init_setup::init_cb is listed as a helper symbol and lives in the kruntime crate, hence the
  checker's first-segment warning.
