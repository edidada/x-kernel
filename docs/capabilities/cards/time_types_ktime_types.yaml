exclusions:
  - TimeSpan is non-negative; signed differences need SystemTime::duration_since (Result) or explicit handling, not a TimeSpan
  - types from different clock domains do not mix (MonotonicInstant vs BoottimeInstant); convert through ktime::*_deadline_to_monotonic
  - not a clock - these are values only; reading the current time is time_clock_khal / time_realtime_ktime
counter_examples:
  - path: util/ktime_types/src/clock_id.rs
    item: ktime_types::clock_id::ClockId
    why: ClockId is a semantic identity independent of ABI numbers; raw CLOCK_* parsing belongs to syscall adapters, so it does not replace the Linux clockid_t integer constants at the syscall boundary
    evidence: [{path: util/ktime_types/src/clock_id.rs, item: ktime_types::clock_id::ClockId, quote: "a clock source nor implies that every variant has a distinct implementation."}]
