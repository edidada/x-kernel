capability: time_types_ktime_types
title: Semantic time value types (ktime_types::TimeSpan / Instant<C> / SystemTime / Frequency / ClockId)
family: time.types
summary: >-
  Distinct no_std types for durations (TimeSpan, non-negative), points in a clock domain
  (Instant<Monotonic | Boottime | ProcessCpu | ThreadCpu> with MonotonicInstant etc. aliases), signed Unix
  wall-clock timestamps (SystemTime), rates (Frequency), clock identities (ClockId), and unit constants
  (NANOS_PER_SEC ...). Conversions to raw integers and core::time::Duration are explicit, with checked /
  saturating arithmetic.
source: {kind: workspace, crate: ktime_types, path: util/ktime_types}
symbols:
  - {fqn: ktime_types::TimeSpan, kind: struct, path: util/ktime_types/src/span.rs, role: primary}
  - {fqn: ktime_types::Instant, kind: struct, path: util/ktime_types/src/instant.rs, role: primary}
  - {fqn: ktime_types::MonotonicInstant, kind: type, path: util/ktime_types/src/instant.rs, role: primary}
  - {fqn: ktime_types::SystemTime, kind: struct, path: util/ktime_types/src/system_time.rs, role: primary}
  - {fqn: ktime_types::Frequency, kind: struct, path: util/ktime_types/src/frequency.rs, role: primary}
  - {fqn: ktime_types::ClockId, kind: enum, path: util/ktime_types/src/clock_id.rs, role: helper}
  - {fqn: ktime_types::TimestampLimits, kind: struct, path: util/ktime_types/src/timestamp.rs, role: helper}
  - {fqn: ktime_types::NANOS_PER_SEC, kind: const, path: util/ktime_types/src/units.rs, role: helper}
operations:
  - name: span_conversions
    symbols: [ktime_types::TimeSpan]
    effect: from_secs / from_millis / from_micros / from_nanos, as_nanos_u64_saturating for hardware and ABI boundaries, explicit from_core / into_core for core::time::Duration
    evidence:
      - {path: util/ktime_types/src/span.rs, item: ktime_types::span::TimeSpan, quote: "`TimeSpan` intentionally requires explicit conversion to and from"}
      - {path: util/ktime_types/src/span.rs, item: ktime_types::span::TimeSpan::as_nanos_u64_saturating, quote: "Returns total nanoseconds, saturating at `u64::MAX`."}
  - name: instant_arithmetic
    symbols: [ktime_types::Instant]
    effect: checked_add / checked_sub with a TimeSpan, checked_duration_since / saturating_duration_since between instants of the same clock domain
    evidence:
      - {path: util/ktime_types/src/instant.rs, item: ktime_types::instant::Instant::checked_add, quote: "Advances this instant, returning `None` on overflow."}
      - {path: util/ktime_types/src/instant.rs, item: ktime_types::instant::Instant::checked_duration_since, quote: "pub const fn checked_duration_since(self, earlier: Self) -> Option<TimeSpan> {"}
  - name: wall_clock
    symbols: [ktime_types::SystemTime]
    effect: signed Unix timestamp with from_unix_parts / unix_seconds / subsec_nanos / duration_since
    evidence:
      - {path: util/ktime_types/src/system_time.rs, item: ktime_types::system_time::SystemTime, quote: "A signed wall-clock timestamp relative to the Unix epoch."}
  - name: frequency
    symbols: [ktime_types::Frequency]
    effect: canonical hertz; checked_from_khz / checked_from_mhz, as_khz_floor / as_mhz_floor round down
    evidence:
      - {path: util/ktime_types/src/frequency.rs, item: ktime_types::frequency::Frequency, quote: "A frequency stored canonically as cycles per second (hertz)."}
usage_protocol:
  - step: obtain instants from a clock (khal::time::monotonic_time, ktime::realtime) rather than constructing them; convert to raw integers only at hardware / ABI boundaries
    evidence:
      - {path: util/ktime_types/src/instant.rs, item: ktime_types::instant::Instant::from_span_since_origin, quote: "boundaries. Ordinary subsystem code should obtain instants from its clock."}
