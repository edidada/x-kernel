capability: worker_pool_kworkerpool_ng
title: Per-CPU bounded worker-task pool and bottom-half executors for pluggable work sources (kworkerpool_ng)
family: task.work
summary: >-
  Execution layer under kworkng. NormalServices::start creates, on every boot CPU, a pool of worker
  tasks (bounded by `limit`, growth by a manager task, idle retirement keeping one baseline worker)
  that pull claims from a PartitionWorkSource and run AcquiredExecution; BottomHalfServices run
  bounded passes from kirq's Tasklet / High softirq vectors with a source-inspection budget. These are
  integration contracts, not business workqueue APIs: use kworkng handles for submitting work.
source: {kind: workspace, crate: kworkerpool_ng, path: task/kworkng/crates/kworkerpool_ng}
symbols:
  - {fqn: kworkerpool_ng::NormalServices, kind: struct, path: task/kworkng/crates/kworkerpool_ng/src/normal/services.rs, role: primary}
  - {fqn: kworkerpool_ng::NormalServices::start, kind: fn, path: task/kworkng/crates/kworkerpool_ng/src/normal/services.rs, role: constructor}
  - {fqn: kworkerpool_ng::NormalServices::stop, kind: fn, path: task/kworkng/crates/kworkerpool_ng/src/normal/services.rs, role: operation}
  - {fqn: kworkerpool_ng::BottomHalfServices, kind: struct, path: task/kworkng/crates/kworkerpool_ng/src/bottom_half/services.rs, role: primary}
  - {fqn: kworkerpool_ng::BottomHalfService, kind: struct, path: task/kworkng/crates/kworkerpool_ng/src/bottom_half.rs, role: primary}
  - {fqn: kworkerpool_ng::PartitionWorkSource, kind: trait, path: task/kworkng/crates/kworkerpool_ng/src/execution.rs, role: helper}
  - {fqn: kworkerpool_ng::AcquiredExecution, kind: trait, path: task/kworkng/crates/kworkerpool_ng/src/execution.rs, role: helper}
operations:
  - name: start_normal
    symbols: [kworkerpool_ng::NormalServices::start]
    effect: prepares normal execution on every present boot CPU without publishing it; limit bounds workers per CPU, idle_for is the idle-retirement interval (one baseline worker retained)
    evidence:
      - {path: task/kworkng/crates/kworkerpool_ng/src/normal/services.rs, item: kworkerpool_ng::normal::services::NormalServices::start, quote: "`limit` bounds workers per CPU; `idle_for` is the positive idle-retirement"}
  - name: stop
    symbols: [kworkerpool_ng::NormalServices::stop]
    effect: joins all services in reverse construction order after sources are drained and detached
    evidence:
      - {path: task/kworkng/crates/kworkerpool_ng/src/normal/services.rs, item: kworkerpool_ng::normal::services::NormalServices::stop, quote: "Joins all services in reverse construction order after source teardown."}
contract:
  no_std:
    value: "yes (#![no_std])"
    evidence: [{path: task/kworkng/crates/kworkerpool_ng/src/lib.rs, quote: "#![no_std]"}]
  allocation:
    value: "source preparation and service start allocate; notification and inspection reuse that storage; worker growth runs in manager task context"
    evidence:
      - {path: task/kworkng/crates/kworkerpool_ng/src/lib.rs, quote: "matching prepared notification. Source preparation allocates; notification and"}
  blocking:
    value: "start/stop need sleepable task context; BH passes are non-sleeping softirq execution with a turn budget; normal workers are tasks"
    evidence:
      - {path: task/kworkng/crates/kworkerpool_ng/src/normal/services.rs, item: kworkerpool_ng::normal::services::NormalServices::start, quote: "Requires sleepable task context without locks needed by reclaim, I/O or"}
      - {path: task/kworkng/crates/kworkerpool_ng/src/bottom_half.rs, quote: "CPU-bound bounded BH execution and retained continuation requests."}
  irq_nmi:
    value: "BH passes run in softirq and reject task, BH-disabled task and hardirq context (BottomHalfRunError::InvalidContext); producers publish demand first then call the prepared notification"
    evidence:
      - {path: task/kworkng/crates/kworkerpool_ng/src/bottom_half.rs, item: kworkerpool_ng::bottom_half::BottomHalfRunError, quote: "/// Task, BH-disabled task or hardirq context cannot execute BH callbacks."}
  ownership_lifetime:
    value: "NormalServices owns each CPU's runtime; integration retains it until producers stop, sources drain/detach and stop completes; Drop does not block or stop runtimes"
    evidence:
      - {path: task/kworkng/crates/kworkerpool_ng/src/normal/services.rs, item: kworkerpool_ng::normal::services::NormalServices, quote: "stop, sources drain/detach, and stop completes. Drop does not block or stop"}
  errors_bounds:
    value: "start fails on invalid context, bad idle interval, empty boot coverage (after joined rollback) or NoMemory for manager entries; worker count per CPU bounded by limit; no CPU hotplug support"
    evidence:
      - {path: task/kworkng/crates/kworkerpool_ng/src/normal/services.rs, item: kworkerpool_ng::normal::services::NormalServices::start, quote: "Invalid context or idle interval rejects before service allocation. Empty"}
      - {path: task/kworkng/crates/kworkerpool_ng/src/bottom_half.rs, item: kworkerpool_ng::bottom_half::BottomHalfService::new, quote: "single-CPU runtime uses only the local softirq path. No hotplug is supported."}
  concurrency:
    value: "per-CPU services; lock order dispatch -> workers; the provider must serialize BH passes on the selected CPU and never call run_pass inline from its Waker"
    evidence:
      - {path: task/kworkng/crates/kworkerpool_ng/src/normal.rs, item: kworkerpool_ng::normal::NormalService, quote: "Source demand and worker parking use dispatch -> workers lock order."}
      - {path: task/kworkng/crates/kworkerpool_ng/src/bottom_half.rs, quote: "requests made during a pass, serialize all passes on the selected CPU and"}
