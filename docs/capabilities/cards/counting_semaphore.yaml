capability: counting_semaphore
title: Blocking counting semaphore (ksync::Semaphore)
family: sync.semaphore
summary: >-
  Atomic permit counter plus an event-listener. acquire() CAS-decrements the count, or registers a
  listener, rechecks the count, and blocks with ktask::future::block_on. release() increments and
  wakes one additional waiter. SemaphoreGuard releases on drop.
source: {kind: workspace, crate: ksync, path: task/ksync}
symbols:
  - {fqn: ksync::Semaphore, kind: struct, path: task/ksync/src/semaphore.rs, role: primary}
  - {fqn: ksync::Semaphore::new, kind: fn, path: task/ksync/src/semaphore.rs, role: constructor}
  - {fqn: ksync::Semaphore::acquire, kind: fn, path: task/ksync/src/semaphore.rs, role: operation}
  - {fqn: ksync::Semaphore::try_acquire, kind: fn, path: task/ksync/src/semaphore.rs, role: operation}
  - {fqn: ksync::Semaphore::release, kind: fn, path: task/ksync/src/semaphore.rs, role: operation}
  - {fqn: ksync::Semaphore::acquire_guard, kind: fn, path: task/ksync/src/semaphore.rs, role: operation}
  - {fqn: ksync::SemaphoreGuard, kind: struct, path: task/ksync/src/semaphore.rs, role: helper}
operations:
  - name: acquire
    symbols: [ksync::Semaphore::acquire]
    effect: blocks until a permit is available; listener registered before the final count recheck
    evidence: [{path: task/ksync/src/semaphore.rs, item: ksync::semaphore::Semaphore::acquire, quote: "listener!(self.event => listener);"}]
  - name: release
    symbols: [ksync::Semaphore::release]
    effect: adds a permit and wakes one previously unnotified waiter
    evidence: [{path: task/ksync/src/semaphore.rs, item: ksync::semaphore::Semaphore::release, quote: "self.event.notify_additional(1);"}]
usage_protocol:
  - step: "static SEM: Semaphore = Semaphore::new(n); let _guard = SEM.acquire_guard();"
    evidence: [{path: task/ksync/src/lib.rs, quote: "static SEM: Semaphore = Semaphore::new(3);"}]
contract:
  no_std:
    value: 'yes (cfg_attr: no_std unless test)'
    evidence:
    - path: task/ksync/src/lib.rs
      quote: '#![cfg_attr(not(test), no_std)]'
  allocation:
    value: unknown
    evidence: []
  blocking:
    value: acquire blocks the calling task (event-listener + ktask::future::block_on)
    evidence:
    - path: task/ksync/src/semaphore.rs
      item: ksync::semaphore::Semaphore::acquire
      quote: Acquires a permit, blocking until one is available.
  irq_nmi:
    value: unknown
    evidence: []
  ownership_lifetime:
    value: SemaphoreGuard releases its permit on drop; release() does not cap the count at the initial
      permits
    evidence:
    - path: task/ksync/src/semaphore.rs
      item: ksync::semaphore::Semaphore::release
      quote: allows releasing more permits than the semaphore was
    - path: task/ksync/src/semaphore.rs
      item: ksync::semaphore::SemaphoreGuard::drop
      quote: self.sem.release();
  errors_bounds:
    value: try_acquire returns bool after a bounded retry loop (10 CAS attempts); no error type
    evidence:
    - path: task/ksync/src/semaphore.rs
      item: ksync::semaphore::Semaphore::try_acquire
      quote: 'const MAX_RETRIES: usize = 10;'
    - path: task/ksync/src/semaphore.rs
      item: ksync::semaphore::Semaphore::try_acquire
      quote: pub fn try_acquire(&self) -> bool {
  concurrency:
    value: permit acquisition uses an atomic CAS loop; release increments the count with Release ordering
      and notifies one additional listener; no FIFO permit reservation guarantee is established
    evidence:
    - path: task/ksync/src/semaphore.rs
      item: ksync::semaphore::Semaphore::acquire
      quote: compare_exchange_weak(
    - path: task/ksync/src/semaphore.rs
      item: ksync::semaphore::Semaphore::release
      quote: self.count.fetch_add(1, Ordering::Release);
