aliases:
  en: [irq_work, irq_work_queue, defer from NMI, NMI to IRQ handoff, deferred work from NMI, self-IPI work]
  zh: [irq_work, NMI 延迟处理, NMI 到中断上下文转交, 中断内延迟回调]
identifiers: [irq_work, irq_work_queue, irq_work_run, NMI, pseudo-NMI, self_ipi, defer]
exclusions:
- local CPU only; no cross-CPU submission (use kipi call-function or fixed notifications)
- 'one-shot node: cannot be resubmitted after it ran; no cancel or flush'
- 'callback runs in hardirq context with IRQs off and must not sleep: use it only to hand off to a normal
  worker (kworkng) for sleepable work'
- AlreadyQueued does not return ownership of an existing submission or extend its lifetime; every duplicate
  submitter needs independent external lifetime protection.
counter_examples: []
notes: "User of this API at the pin: task/kworkng/src/finalize.rs (irq_work::queue calls in release_identity and in Carrier::submit)."
