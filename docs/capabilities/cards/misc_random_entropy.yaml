exclusions:
  - not a deterministic or seedable PRNG; use a local rand_chacha / simple PRNG when reproducible sequences are required (tests, hash seeds)
  - fill_random takes a ksync::Mutex around the pool (see contract.blocking); the documentation does not state it is usable from IRQ/NMI context, so do not assume it
  - before is_ready() the output is not backed by quality entropy; security-sensitive callers must check readiness
counter_examples:
  - path: util/entropy/src/lib.rs
    item: entropy::bootstrap_seed
    why: bootstrap_seed derives a seed from tick counts with a multiply/xor mix; it is private bootstrap logic for the pool, not an interchangeable random source
    evidence: [{path: util/entropy/src/lib.rs, item: entropy::bootstrap_seed, quote: "let mut state = now_ticks().as_raw() ^ 0x9e37_79b9_7f4a_7c15;"}]
notes: >-
  The drivers/contracts hwrng trait is the hardware-source contract feeding this pool, not a general
  random API. Callers outside util/entropy at the pin include getrandom, /dev/random, UDP port
  selection and exec (AT_RANDOM).
