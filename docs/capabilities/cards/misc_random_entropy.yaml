capability: misc_random_entropy
title: Kernel random bytes / CRNG (entropy::fill_random, add_entropy, is_ready)
family: misc.random
summary: >-
  Global ChaCha20-based entropy pool seeded from architecture CPU RNG, SMCCC TRNG, VirtIO RNG and
  software jitter. fill_random fills a byte slice with random bytes; add_entropy mixes extra input
  (does not mark the pool ready); is_ready / wait_until_ready / ready_poll_set expose the getrandom
  readiness semantics. Used by getrandom(2), /dev/random and in-kernel consumers needing randomness
  (ASLR-style offsets, port selection, AT_RANDOM bytes).
source: {kind: workspace, crate: entropy, path: util/entropy}
symbols:
  - {fqn: entropy::fill_random, kind: fn, path: util/entropy/src/lib.rs, role: primary}
  - {fqn: entropy::add_entropy, kind: fn, path: util/entropy/src/lib.rs, role: operation}
  - {fqn: entropy::init, kind: fn, path: util/entropy/src/lib.rs, role: constructor}
  - {fqn: entropy::is_ready, kind: fn, path: util/entropy/src/lib.rs, role: operation}
  - {fqn: entropy::wait_until_ready, kind: fn, path: util/entropy/src/lib.rs, role: operation}
  - {fqn: entropy::try_seed_from_hardware, kind: fn, path: util/entropy/src/lib.rs, role: operation}
  - {fqn: entropy::ready_poll_set, kind: fn, path: util/entropy/src/lib.rs, role: operation}
operations:
  - name: fill
    symbols: [entropy::fill_random]
    effect: fill buf with random bytes from the pool (no-op for an empty buffer); infallible
    evidence:
      - {path: util/entropy/src/lib.rs, item: entropy::fill_random, quote: "Fill `buf` with random bytes from the kernel entropy pool."}
  - name: mix
    symbols: [entropy::add_entropy]
    effect: mix caller-supplied bytes into the pool for diversity without crediting readiness
    evidence:
      - {path: util/entropy/src/lib.rs, item: entropy::add_entropy, quote: "mark the CRNG as initialized"}
  - name: readiness
    symbols: [entropy::is_ready, entropy::wait_until_ready, entropy::try_seed_from_hardware, entropy::ready_poll_set]
    effect: query / block on / poll the false-to-true transition of CRNG readiness (getrandom GRND_NONBLOCK semantics)
    evidence:
      - {path: util/entropy/src/lib.rs, item: entropy::wait_until_ready, quote: "Block until the ChaCha20 pool has been seeded with quality entropy."}
usage_protocol:
  - step: entropy::init() once after driver probe (kruntime does this); then call fill_random(&mut buf) from any context that may take the pool lock
    evidence:
      - {path: util/entropy/src/lib.rs, item: entropy::init, quote: "Initialize the entropy pool and probe optional hardware sources."}
      - {path: core/kruntime/src/lib.rs, item: kruntime::late_init_main, quote: "entropy::init();"}
  - step: for blocking getrandom semantics check is_ready(), call try_seed_from_hardware(), then wait_until_ready()
    evidence: [{path: core/ksyscall/src/sys.rs, item: ksyscall::sys::sys_getrandom, quote: "if !insecure && !entropy::is_ready() {"}]
contract:
  no_std:
    value: "yes (#![no_std] with extern crate alloc)"
    evidence:
      - {path: util/entropy/src/lib.rs, quote: "#![no_std]"}
      - {path: util/entropy/src/lib.rs, quote: "extern crate alloc;"}
  allocation: {value: unknown, evidence: []}
  blocking:
    value: fill_random takes the global pool Mutex; wait_until_ready blocks the task on a wait queue until the pool is seeded; init with VirtIO RNG requires sleepable task context
    evidence:
      - {path: util/entropy/src/lib.rs, item: entropy::fill_random, quote: "POOL.lock().output_bytes(buf);"}
      - {path: util/entropy/src/lib.rs, item: entropy::wait_until_ready, quote: "READY_WQ.wait_until(is_ready);"}
      - {path: util/entropy/src/lib.rs, item: entropy::init, quote: "With VirtIO RNG enabled, requires sleepable task context with IRQs and"}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: pool is a process-global static behind a lazily initialised Mutex; callers only borrow their output slice
    evidence: [{path: util/entropy/src/lib.rs, item: entropy::POOL, quote: "static POOL: Lazy<Mutex<EntropyPool>> = Lazy::new(|| Mutex::new(EntropyPool::bootstrap()));"}]
  errors_bounds:
    value: fill_random and add_entropy return () and cannot fail; empty input is ignored; before the pool is quality-seeded output derives from a tick-based bootstrap seed (is_ready() false)
    evidence:
      - {path: util/entropy/src/lib.rs, item: entropy::fill_random, quote: "pub fn fill_random(buf: &mut [u8]) {"}
      - {path: util/entropy/src/lib.rs, item: entropy::is_ready, quote: "Pure tick bootstrap and userspace [`add_entropy`]"}
  concurrency:
    value: serialised by one global Mutex around the ChaCha20 state; hardware reseed is claimed under the lock to avoid duplicate reseeds
    evidence:
      - {path: util/entropy/src/lib.rs, item: entropy::maybe_reseed_from_hardware, quote: "// Claim the reseed under the pool lock so concurrent callers do not each"}
