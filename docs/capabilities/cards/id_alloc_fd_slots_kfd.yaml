    symbols: [kfd::fd_slots::FileSlots::add, kfd::fd_slots::FileSlots::alloc]
    effect: assigns the value the lowest free id in [minimum, end) and returns it; returns the value back in Err when no id is free
    evidence:
      - {path: process/kfd/src/fd_slots.rs, item: kfd::fd_slots::FileSlots::add, quote: "/// Assigns `value` the lowest free id."}
      - {path: process/kfd/src/fd_slots.rs, item: kfd::fd_slots::FileSlots::alloc, quote: "/// Assigns `value` the lowest free id in `[minimum, end)`."}
  - name: remove
    symbols: [kfd::fd_slots::FileSlots::remove]
    effect: frees the id, lowers the free bound, returns the stored value
    evidence:
      - {path: process/kfd/src/fd_slots.rs, item: kfd::fd_slots::FileSlots::remove, quote: "/// Removes and returns the value in `id` if it is assigned."}
contract:
  no_std:
    value: 'yes (kfd is #![no_std])'
    evidence:
    - path: process/kfd/src/lib.rs
      quote: '#![no_std]'
  allocation:
    value: the table stores its fixed-capacity slots and occupancy bitmap inline; this does not constrain
      allocation by T or its destructor. It is not a public standalone pool.
    evidence:
    - path: process/kfd/src/fd_slots.rs
      item: kfd::fd_slots::FileSlots
      quote: 'slots: [MaybeUninit<T>; CAPACITY],'
  blocking:
    value: unknown
    evidence: []
  irq_nmi:
    value: unknown
    evidence: []
  ownership_lifetime:
    value: the table owns stored values; a set bit means the slot holds an initialized value; Drop drops
      the live values; remove moves the value out
    evidence:
    - path: process/kfd/src/fd_slots.rs
      quote: A set bit means the slot already holds an initialized value.
    - path: process/kfd/src/fd_slots.rs
      quote: impl<T> Drop for FileSlots<T> {
  errors_bounds:
    value: fixed capacity krlimit::FILE_LIMIT; add / alloc / add_at return Err(value) when full, out of
      range or the id is taken; the exclusive end is clipped to CAPACITY
    evidence:
    - path: process/kfd/src/fd_slots.rs
      item: kfd::fd_slots::CAPACITY
      quote: 'const CAPACITY: usize = krlimit::FILE_LIMIT;'
    - path: process/kfd/src/fd_slots.rs
      item: kfd::fd_slots::FileSlots::add_at
      quote: Returns the unassigned value when `id` is out of range or already taken.
  concurrency:
    value: no internal synchronization (&mut self for mutation); the caller serializes access (the fd
      table wraps it)
    evidence:
    - path: process/kfd/src/fd_slots.rs
      item: kfd::fd_slots::FileSlots::alloc
      quote: 'pub(crate) fn alloc(&mut self, minimum: usize, end: usize, value: T) -> Result<usize, T>
        {'
