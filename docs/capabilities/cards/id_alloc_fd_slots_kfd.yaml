exclusions:
- 'pub(crate) inside kfd and sized by krlimit::FILE_LIMIT (1024): not a general ID allocator; other crates
  cannot depend on it without extracting it'
- it stores values and always returns the LOWEST free id (POSIX fd semantics); for monotonically increasing
  never-reused ids use counters (pid, timer ids)
- no internal locking; no blocking when full
- 'Visibility is pub(crate) and the fd_slots module is private. Treat as an internal pattern only: suppress
  replacement suggestions outside kfd until the owner approves extraction or a public API.'
counter_examples:
  - path: io/ktty/src/tty/pty_pair.rs
    why: "PtyNumber::reserve is a one-word (u32) bitmap trailing_ones lowest-free pool with PTY_CAPACITY; same idea but tiny, ad hoc and with an RAII number guard; not interchangeable with FileSlots (no value storage)"
    evidence: [{path: io/ktty/src/tty/pty_pair.rs, item: ktty::tty::pty_pair::PtyNumber::reserve, quote: "let number = registry.allocated.trailing_ones();"}]
  - path: process/kidentity/src/lib.rs
    item: kidentity::PidNamespace::allocate_nr
    why: "PID numbers come from a monotonically increasing atomic counter that never reuses numbers while a handle is alive; it is not a find-free-index pool"
    evidence: [{path: process/kidentity/src/lib.rs, item: kidentity::PidNamespace::allocate_nr, quote: ".fetch_update(Ordering::AcqRel, Ordering::Acquire, |next| {"}]
notes: >-
  Related ad-hoc allocators in the workspace (not carded): kdevice DeviceNodeRegistry::allocate_index
  (linear find over a BTreeSet), ktimer allocate_posix_timer_id (wrapping counter + map probe),
  memspace aarch64_asid find_free_asid, 9p alloc_fid. The mm/alloc-engine IdAllocator trait has no
  implementor at the pin.
