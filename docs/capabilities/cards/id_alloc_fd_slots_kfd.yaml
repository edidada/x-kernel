capability: id_alloc_fd_slots_kfd
title: Lowest-free-id slot table with occupancy bitmap (kfd FileSlots, crate-private)
family: id.allocator
summary: An internal find-lowest-free-index table. FileSlots<T> stores up to FILE_LIMIT values in numbered
  slots with a u64-word occupancy bitmap and a free-slot lower bound; add / alloc(minimum, end) assign
  the lowest free id (O(words), skipping full words), add_at claims a fixed id, remove frees it. It is
  pub(crate) inside kfd and sized by krlimit::FILE_LIMIT, so it is a pattern to reuse or extract, not
  a dependency other crates can take today.
source: {kind: workspace, crate: kfd, path: process/kfd}
