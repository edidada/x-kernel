aliases:
  en: [spinlock, preempt-disabled lock, preempt_disable lock, no-preempt spin lock, task-context spinlock]
  zh: [自旋锁, 关抢占自旋锁, 关抢占锁]
identifiers: [preempt_disable, preempt_enable, disable_preempt, enable_preempt, AtomicBool, compare_exchange]
exclusions:
  - "not for data shared with IRQ handlers; use spin_lock_noirq (kspin::SpinNoIrq) instead"
  - "not a sleeping lock; use ksync::Mutex for critical sections that block"
counter_examples: []
notes: >-
  Without the `preempt` feature the NoPreempt guard does nothing (see guard/types.rs), so the lock is then only a
  spin flag (and nothing at all without `smp`).
