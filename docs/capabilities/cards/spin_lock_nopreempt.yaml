capability: spin_lock_nopreempt
title: Preemption-disabling spin lock that leaves IRQs enabled (kspin::SpinNoPreempt)
family: sync.spinlock
summary: >-
  Spin lock whose guard disables kernel preemption (via TaskPreemptionIf, only with the `preempt`
  feature) but does not touch IRQ state. Suitable when no IRQ handler accesses the same data or the
  caller already runs with IRQs disabled.
source: {kind: workspace, crate: kspin, path: task/kspin}
symbols:
  - {fqn: kspin::SpinNoPreempt, kind: type, path: task/kspin/src/lib.rs, role: primary}
  - {fqn: kspin::SpinNoPreemptGuard, kind: type, path: task/kspin/src/lib.rs, role: helper}
  - {fqn: kspin::SpinLock, kind: struct, path: task/kspin/src/lock.rs, role: helper}
  - {fqn: kspin::SpinLock::lock, kind: fn, path: task/kspin/src/lock.rs, role: operation}
  - {fqn: kspin::NoPreempt, kind: struct, path: task/kspin/src/guard/types.rs, role: helper}
operations:
  - name: lock
    symbols: [kspin::SpinLock::lock]
    effect: disables preemption, then spins on the atomic flag when smp is enabled
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::lock, quote: "let guard_state = G::acquire();"}]
usage_protocol:
  - step: "use only for data that no IRQ handler touches (or when IRQs are already disabled)"
    evidence: [{path: task/kspin/src/lib.rs, item: kspin::SpinNoPreempt, quote: "Suitable for use in IRQ-disabled contexts or when IRQ handlers"}]
contract:
  no_std:
    value: "yes (cfg_attr: no_std unless test)"
    evidence: [{path: task/kspin/src/lib.rs, quote: "#![cfg_attr(not(test), no_std)]"}]
  allocation:
    value: unknown
    evidence: []
  blocking:
    value: spins; lock() may panic or deadlock if already held by the caller
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::lock, quote: "May panic or deadlock if called while already holding the lock."}]
  irq_nmi:
    value: does not disable IRQs, so unsafe for data also used by IRQ handlers on the same CPU; NMI not stated
    evidence:
      - {path: task/kspin/src/guard/percpu.rs, quote: "`NoPreempt` leaves local IRQs enabled"}
      - {path: task/kspin/src/lib.rs, item: kspin::SpinNoPreempt, quote: "Suitable for use in IRQ-disabled contexts or when IRQ handlers"}
  ownership_lifetime:
    value: lock owns the value; RAII guard releases on drop and re-enables preemption
    evidence: [{path: task/kspin/src/guard/types.rs, item: kspin::guard::types::kernel::NoPreempt::release, quote: "kiface_task_api::TaskPreemptionIf::enable_preempt();"}]
  errors_bounds:
    value: try_lock returns Option; no error type
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::try_lock, quote: "pub fn try_lock(&self) -> Option<SpinLockGuard<'_, G, T>>"}]
  concurrency:
    value: atomic flag only with the smp feature; preemption control only with the preempt feature
    evidence:
      - {path: task/kspin/src/guard/types.rs, item: kspin::guard::types::kernel::NoPreempt::acquire, quote: "#[cfg(feature = \"preempt\")]"}
      - {path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock, quote: "Without the `smp` feature, the lock state is optimized away"}
