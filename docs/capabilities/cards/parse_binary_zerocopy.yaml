capability: parse_binary_zerocopy
title: Zero-copy byte-slice to struct views and struct-to-bytes (zerocopy FromBytes / IntoBytes)
family: parse.binary
summary: >-
  zerocopy's derive-checked marker traits (FromBytes, IntoBytes, Immutable, KnownLayout, Unaligned) let
  a #[repr(C)] struct be viewed from a byte slice (ref_from_bytes, read_from_bytes, *_from_prefix) or
  exposed as bytes (as_bytes), with size and alignment checked and no hand-written unsafe cast.
  zerocopy::byteorder provides endian-typed integers such as network_endian::U16. Used for wire
  headers, event records, ELF auxv entries and virtio structures.
source: {kind: dependency, crate: zerocopy, version: 0.8.63}
symbols:
  - {fqn: zerocopy::transmute, kind: macro, path: src/macros.rs, role: primary}
  - {fqn: zerocopy::transmute_ref, kind: macro, path: src/macros.rs, role: operation}
  - {fqn: zerocopy::error::SizeError, kind: struct, path: src/error.rs, role: helper}
  - {fqn: zerocopy::error::AlignmentError, kind: struct, path: src/error.rs, role: helper}
  - {fqn: zerocopy::error::ConvertError, kind: enum, path: src/error.rs, role: helper}
operations:
  - name: view_as_ref
    symbols: []
    effect: borrow a byte slice as &Self; Err if the length is not a valid size or the slice is misaligned (infallible alignment for Unaligned types)
    evidence:
      - {path: zerocopy-0.8.63/src/lib.rs, item: zerocopy::FromBytes::ref_from_bytes, quote: "returns `Err`. If [`Self: Unaligned`][self-unaligned], you can"}
  - name: read_copy
    symbols: []
    effect: copy a Self out of a byte slice of exactly size_of::<Self>() bytes
    evidence:
      - {path: zerocopy-0.8.63/src/lib.rs, item: zerocopy::FromBytes::read_from_bytes, quote: "If `source.len() != size_of::<Self>()`, `read_from_bytes` returns `Err`."}
  - name: as_bytes
    symbols: []
    effect: view a value as its bytes
    evidence:
      - {path: zerocopy-0.8.63/src/lib.rs, item: zerocopy::IntoBytes::as_bytes, quote: "fn as_bytes(&self) -> &[u8]"}
usage_protocol:
  - step: "derive the marker traits (#[derive(FromBytes, IntoBytes, Immutable, KnownLayout)]) on a #[repr(C)] struct and use the *_from_bytes / as_bytes methods; the derive rejects layouts that are unsound (padding, invalid bit patterns). Use zerocopy::byteorder types for non-native-endian fields"
    evidence:
      - {path: zerocopy-0.8.63/src/lib.rs, item: zerocopy::IntoBytes, quote: "If `T: IntoBytes`, then unsafe code may assume that it is sound to treat any"}
contract:
  no_std:
    value: yes by default; std is a cargo feature. The workspace dependencies do not enable std (derive;
      devfs and kernel_elf_parser use derive only, kvirtiodrivers also alloc)
    evidence:
    - path: zerocopy-0.8.63/src/lib.rs
      quote: '#![cfg_attr(not(any(test, kani, feature = "std")), no_std)]'
    - path: Cargo.toml
      quote: zerocopy = { version = "0.8", features = ["derive"] }
  allocation:
    value: unknown
    evidence: []
  blocking:
    value: unknown
    evidence: []
  irq_nmi:
    value: unknown
    evidence: []
  ownership_lifetime:
    value: ref_from_bytes borrows from the source slice; read_from_bytes copies
    evidence:
    - path: zerocopy-0.8.63/src/lib.rs
      item: zerocopy::FromBytes::ref_from_bytes
      quote: 'fn ref_from_bytes(source: &[u8]) -> Result<&Self, CastError<&[u8], Self>>'
    - path: zerocopy-0.8.63/src/lib.rs
      item: zerocopy::FromBytes::read_from_bytes
      quote: 'fn read_from_bytes(source: &[u8]) -> Result<Self, SizeError<&[u8], Self>>'
  errors_bounds:
    value: ref_from_bytes returns size/alignment errors for supported layouts; it also has a compile-time
      rejection for unsupported zero-sized DST tails. Do not promise an unconditional no-panic/no-restriction
      API for all FromBytes layouts.
    evidence:
    - path: zerocopy-0.8.63/src/lib.rs
      item: zerocopy::FromBytes::ref_from_bytes
      quote: static_assert_dst_is_not_zst!(Self);
  concurrency:
    value: unknown
    evidence: []
