exclusions:
  - "not a stream parser: it views a buffer that already holds a whole structure; for variable-length or delimiter-based text formats see the text parsers"
  - "bytemuck is the other Pod-style crate in the workspace (parse_binary_bytemuck); the two are not interchangeable at API boundaries because their marker traits differ"
  - "not for copying user memory: use the uaccess helpers (mm_user_copy_osvm) to bring user data into the kernel first, then parse"
counter_examples: []
notes: The traits themselves (FromBytes, IntoBytes, Immutable, KnownLayout, Unaligned in src/lib.rs, about
  300 KB) are not listed as symbols because the dependency indexer skips files over 256 KiB; the operations
  below cite their lib.rs lines directly. Several workspace crates declare zerocopy with their own version
  requirement instead of the workspace entry; Cargo.lock at the pin has a single zerocopy entry, 0.8.63.
  The listed transmute macros do not identify the advertised FromBytes/IntoBytes entry points. Catalogue/index
  owner must resolve macro/large-file indexing before this card can drive symbol-level replacement suggestions;
  evidence-only operations are not resolved symbols.
status: needs-owner
