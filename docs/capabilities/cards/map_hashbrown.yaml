    item: hashbrown::map::HashMap::get
    quote: 'pub fn get<Q>(&self, k: &Q) -> Option<&V>'
  - path: hashbrown-0.16.1/src/map.rs
    item: hashbrown::map::HashMap::get
    quote: 'Q: Hash + Equivalent<K> + ?Sized,'
- name: remove
  symbols:
  - hashbrown::HashMap::remove
  effect: remove by key and return the value
  evidence:
  - path: hashbrown-0.16.1/src/map.rs
    item: hashbrown::map::HashMap::remove
    quote: 'pub fn remove<Q>(&mut self, k: &Q) -> Option<V>'
- name: entry
  symbols:
  - hashbrown::HashMap::entry
  effect: single-lookup get-or-insert API
  evidence:
  - path: hashbrown-0.16.1/src/map.rs
    item: hashbrown::map::HashMap::entry
    quote: 'pub fn entry(&mut self, key: K) -> Entry<''_, K, V, S, A> {'
- name: try_reserve
  symbols:
  - hashbrown::HashMap::try_reserve
  effect: reserve space and report allocation failure as TryReserveError instead of aborting
  evidence:
  - path: hashbrown-0.16.1/src/map.rs
    item: hashbrown::map::HashMap::try_reserve
    quote: 'pub fn try_reserve(&mut self, additional: usize) -> Result<(), TryReserveError> {'
usage_protocol:
  - step: "keys must not be attacker-chosen when the default hasher is used; pass a keyed hasher through with_hasher if untrusted input decides the keys"
    evidence:
      - {path: hashbrown-0.16.1/src/map.rs, item: hashbrown::map::HashMap, quote: "against attacks such as HashDoS."}
contract:
  no_std:
    value: "yes: #![no_std]; the kernel's workspace dependency leaves default features on (default-hasher = foldhash, allocator-api2, ...), none of which is std"
    evidence:
      - {path: hashbrown-0.16.1/src/lib.rs, quote: "#![no_std]"}
      - {path: Cargo.toml, quote: 'hashbrown = "0.16"'}
  allocation:
    value: heap allocated through an Allocator parameter that defaults to Global; try_reserve exposes allocation failure
    evidence:
      - {path: hashbrown-0.16.1/src/map.rs, item: hashbrown::map::HashMap, quote: "pub struct HashMap<K, V, S = DefaultHashBuilder, A: Allocator = Global> {"}
      - {path: hashbrown-0.16.1/src/map.rs, item: hashbrown::map::HashMap::try_reserve, quote: "pub fn try_reserve(&mut self, additional: usize) -> Result<(), TryReserveError> {"}
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: the map owns keys and values; unordered
    evidence:
      - {path: hashbrown-0.16.1/src/map.rs, item: hashbrown::map::HashMap, quote: "pub struct HashMap<K, V, S = DefaultHashBuilder, A: Allocator = Global> {"}
  errors_bounds:
    value: lookups return Option; try_reserve returns TryReserveError; growth through insert uses the allocator's failure path
    evidence:
      - {path: hashbrown-0.16.1/src/map.rs, item: hashbrown::map::HashMap::try_reserve, quote: "Result<(), TryReserveError>"}
  concurrency:
    value: mutating operations take &mut self
    evidence:
      - {path: hashbrown-0.16.1/src/map.rs, item: hashbrown::map::HashMap::insert, quote: "pub fn insert(&mut self, k: K, v: V) -> Option<V> {"}
