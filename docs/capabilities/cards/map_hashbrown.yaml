aliases:
  en: [hash map, hashmap, hash table, dictionary, associative array, unordered map, hash set, HashSet, swiss table, key value lookup]
  zh: [哈希表, 哈希映射, 散列表, 字典, 无序映射, 哈希集合, 键值查找]
identifiers: [HashMap, HashSet, entry, or_insert, or_insert_with, contains_key, try_reserve, with_hasher, BuildHasher]
exclusions:
  - "iteration order is unspecified; for ordered keys use an ordered map from alloc (BTreeMap)"
  - "the default hasher does not defend against HashDoS; do not key it on unauthenticated input without a keyed hasher"
  - "kvfs pins hashbrown 0.15 (a second lock entry); this card is the 0.16 line used by the other crates"
  - "for a table keyed by small integer ids prefer slot_pool_slab or sparse_index_xarray"
counter_examples:
- path: util/kxarray/src/lib.rs
  item: kxarray::XArray
  why: XArray supports RCU readers concurrent with internally serialized writers for caller-chosen usize
    keys. HashMap supports immutable shared reads when its type bounds permit, but ordinary mutation requires
    exclusive access; it has no equivalent RCU publication/reclamation protocol.
  evidence:
  - path: util/kxarray/src/lib.rs
    item: kxarray::XArray::new
    quote: Creates an empty index without allocation or RCU service readiness.
  - path: util/kxarray/src/lib.rs
    quote: owns each inserted object
  - path: util/kxarray/src/lib.rs
    item: kxarray::XArray::read
    quote: pub fn read<
notes: >-
  Cargo.lock at the pin holds hashbrown 0.15.5 (kvfs), 0.16.1 (the rest) and 0.17.1 (indexmap, host tool).
