capability: map_hashbrown
title: no_std hash map and set (hashbrown::HashMap / HashSet)
family: container.map
summary: >-
  hashbrown is the SwissTable port that backs std's HashMap. HashMap<K, V> and HashSet<T> work without
  std, hash with foldhash by default, and offer entry(), try_reserve (fallible growth) and an
  allocator type parameter. It is the kernel's general unordered key-to-value map.
source: {kind: dependency, crate: hashbrown, version: 0.16.1}
symbols:
  - {fqn: hashbrown::HashMap, kind: struct, path: src/map.rs, role: primary}
  - {fqn: hashbrown::HashSet, kind: struct, path: src/set.rs, role: primary}
  - {fqn: hashbrown::HashMap::with_capacity, kind: fn, path: src/map.rs, role: constructor}
  - {fqn: hashbrown::HashMap::with_hasher, kind: fn, path: src/map.rs, role: constructor}
  - {fqn: hashbrown::HashMap::insert, kind: fn, path: src/map.rs, role: operation}
  - {fqn: hashbrown::HashMap::get, kind: fn, path: src/map.rs, role: operation}
  - {fqn: hashbrown::HashMap::remove, kind: fn, path: src/map.rs, role: operation}
  - {fqn: hashbrown::HashMap::entry, kind: fn, path: src/map.rs, role: operation}
  - {fqn: hashbrown::HashMap::try_reserve, kind: fn, path: src/map.rs, role: operation}
operations:
