aliases:
  en: [poll wait queue, poll_wait, wait queue head for poll, epoll wakeup source, select/poll notification, readiness notification, waker list, waker registry, broadcast waker set, wake all wakers, poll_table]
  zh: [轮询等待队列, poll 唤醒源, 就绪通知, 唤醒器列表, 广播唤醒, epoll 唤醒, select 等待]
identifiers: [Waker, wakers, waker_list, wake_all, poll_wait, PollEvents, POLLIN, EPOLLIN, register_waker, notify, readiness, Vec<Waker>]
exclusions:
  - "notification only: no predicate and no blocking wait; the caller recheck loop is mandatory (late wakes, check/register race)"
  - "wake is broadcast and one-shot: registrations are consumed; a woken waiter must re-register on the next round"
  - "for sleeping with a condition on ktask use ktask::WaitQueue (task_wait_queue); for one-shot done/wait tokens use kcompletion (completion_tokens); for generation-counted broadcast of state changes use PollEvent (poll_event_kpoll)"
  - "register can fail with NoMemory/IdExhausted; do not unwrap in IRQ paths"
counter_examples: []
notes: >-
  PollSet's waiter table is an internal slot free list with generation-style ids; it is not exposed
  and must not be mistaken for a reusable slot pool.
