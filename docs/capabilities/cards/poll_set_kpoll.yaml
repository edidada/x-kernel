capability: poll_set_kpoll
title: IRQ-safe poll wake source with owned one-shot waiter registrations (kpoll::PollSet)
family: task.poll
summary: >-
  Readiness notification for poll/epoll/select-style waits. A PollSet is a broadcast source of
  one-shot waker registrations; each logical wait owns a PollRegistrations and uses a PollContext to
  register with one or more sources (RAII: timeout, interruption or drop unregisters). wake() detaches
  all waiters under a SpinNoIrq lock and invokes wakers after releasing it, so it is callable from IRQ
  context. The Pollable trait is the poll()+register() contract; the caller supplies the readiness
  predicate and must recheck it after registering.
