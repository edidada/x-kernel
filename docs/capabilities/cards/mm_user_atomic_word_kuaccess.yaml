capability: mm_user_atomic_word_kuaccess
title: Atomic load / compare-exchange on a 32-bit user word with fault-resolving and nofault forms (kuaccess::atomic_*_u32)
family: mm.user_access
summary: >-
  Exception-table-protected atomic operations on a u32 in user memory for futex and robust-list paths:
  atomic_load_u32, atomic_u32_eq, atomic_cmpxchg_u32, each with a *_nofault variant that never resolves
  page faults (safe under a non-sleepable lock), plus fault_in_user_writeable for the slow path.
source: {kind: workspace, crate: kuaccess, path: core/kuaccess}
symbols:
  - {fqn: kuaccess::atomic_load_u32, kind: fn, path: core/kuaccess/src/lib.rs, role: primary}
  - {fqn: kuaccess::atomic_load_u32_nofault, kind: fn, path: core/kuaccess/src/lib.rs, role: operation}
  - {fqn: kuaccess::atomic_u32_eq, kind: fn, path: core/kuaccess/src/lib.rs, role: operation}
  - {fqn: kuaccess::atomic_u32_eq_nofault, kind: fn, path: core/kuaccess/src/lib.rs, role: operation}
  - {fqn: kuaccess::atomic_cmpxchg_u32, kind: fn, path: core/kuaccess/src/lib.rs, role: primary}
  - {fqn: kuaccess::atomic_cmpxchg_u32_nofault, kind: fn, path: core/kuaccess/src/lib.rs, role: operation}
  - {fqn: kuaccess::fault_in_user_writeable, kind: fn, path: core/kuaccess/src/lib.rs, role: operation}
operations:
  - name: cmpxchg
    symbols: [kuaccess::atomic_cmpxchg_u32]
    effect: "Ok((true, old)) when the word equalled old and new was stored; Ok((false, observed)) otherwise"
    evidence:
      - {path: core/kuaccess/src/lib.rs, item: kuaccess::atomic_cmpxchg_u32, quote: "Returns `Ok((true, old))` when `*addr == old` and the store of `new`"}
  - name: nofault_variants
    symbols: [kuaccess::atomic_load_u32_nofault, kuaccess::atomic_cmpxchg_u32_nofault]
    effect: report a missing mapping as NoAccess immediately so the caller can drop its lock, fault the page in, and retry
    evidence:
      - {path: core/kuaccess/src/lib.rs, item: kuaccess::atomic_load_u32_nofault, quote: "This is intended for callers that hold a non-sleepable lock. A fault is"}
      - {path: core/kuaccess/src/lib.rs, item: kuaccess::atomic_cmpxchg_u32_nofault, quote: "This operation is safe under a non-sleepable lock because a missing or"}
  - name: fault_in
    symbols: [kuaccess::fault_in_user_writeable]
    effect: one write-fault attempt for a user word without storing; the caller must not hold a non-sleepable lock
    evidence:
      - {path: core/kuaccess/src/lib.rs, item: kuaccess::fault_in_user_writeable, quote: "The caller must not hold a non-sleepable lock."}
usage_protocol:
  - step: "under a spin lock use the *_nofault form; on NoAccess drop the lock, call fault_in_user_writeable (or the fault-resolving form) and retry the whole operation"
    evidence: [{path: core/kuaccess/src/lib.rs, item: kuaccess::atomic_load_u32_nofault, quote: "reported as [`MemError::NoAccess`]; the caller must drop its lock, fault the"}]
