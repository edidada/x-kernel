capability: intrusive_rbtree_intrusive_collections
title: Intrusive red-black tree ordered by key (intrusive_collections::RBTree)
family: container.tree
summary: >-
  RBTree<A> keeps objects ordered by a key through an embedded RBTreeLink / RBTreeAtomicLink; a KeyAdapter
  provides the key. Supports find, lower_bound / upper_bound, range, ordered cursors and O(log n) insert and
  remove without allocating tree nodes. Used for timer deadlines, scheduler run queues and a pty-pair index.
source: {kind: dependency, crate: intrusive-collections, version: 0.10.2}
