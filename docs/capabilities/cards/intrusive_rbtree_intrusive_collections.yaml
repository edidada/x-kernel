operations:
  - name: insert
    symbols: [intrusive_collections::RBTree::insert]
    effect: insert an owned pointer in key order
    evidence: [{path: intrusive-collections-0.10.2/src/rbtree.rs, item: intrusive_collections::rbtree::RBTree::insert, quote: "pub fn insert<'a>(&'a mut self, val: <A::PointerOps as PointerOps>::Pointer) -> CursorMut<'a, A>"}]
  - name: find
    symbols: [intrusive_collections::RBTree::find]
    effect: cursor at the element with the given key
    evidence: [{path: intrusive-collections-0.10.2/src/rbtree.rs, item: intrusive_collections::rbtree::RBTree::find, quote: "pub fn find<'a, 'b, Q: ?Sized + Ord>(&'a self, key: &Q) -> Cursor<'a, A>"}]
  - name: lower_bound
    symbols: [intrusive_collections::RBTree::lower_bound]
    effect: first element at or after a bound (ordered successor query)
    evidence: [{path: intrusive-collections-0.10.2/src/rbtree.rs, item: intrusive_collections::rbtree::RBTree::lower_bound, quote: "pub fn lower_bound<'a, 'b, Q: ?Sized + Ord>(&'a self, bound: Bound<&Q>) -> Cursor<'a, A>"}]
usage_protocol:
  - step: embed an RBTreeLink (or RBTreeAtomicLink), declare the adapter, and implement KeyAdapter for the key; keep keys unchanged while linked
    evidence: [{path: intrusive-collections-0.10.2/src/rbtree.rs, item: intrusive_collections::rbtree::RBTree, quote: "remain in ascending key order."}]
contract:
  no_std:
    value: "yes (#![no_std])"
    evidence: [{path: intrusive-collections-0.10.2/src/lib.rs, quote: "#![no_std]"}]
  allocation:
    value: the tree itself never allocates for nodes (links live in the elements)
    evidence: [{path: intrusive-collections-0.10.2/src/lib.rs, quote: "intrusive collections never allocate memory themselves"}]
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: dropping the tree converts linked elements back to owned pointers and drops them; the ordering invariant is the caller's responsibility (memory-safe if violated, results may be wrong)
    evidence:
      - {path: intrusive-collections-0.10.2/src/rbtree.rs, item: intrusive_collections::rbtree::RBTree, quote: "memory safety will not be violated but the `find`,"}
  errors_bounds:
    value: unknown
    evidence: []
  concurrency:
    value: no internal locking; AtomicLink only makes the link type shareable between threads
    evidence:
      - {path: intrusive-collections-0.10.2/src/rbtree.rs, item: intrusive_collections::rbtree::AtomicLink, quote: "Intrusive link that allows an object to be inserted into a"}
