operations:
  - name: id_conversion
    symbols: [kcpu_id_map::raw_cpu_id, kcpu_id_map::logical_cpu_id]
    effect: map a logical CPU id to the hardware id and back via the boot table; None for absent CPUs
    evidence:
      - {path: arch/kcpu_id_map/src/lib.rs, item: kcpu_id_map::raw_cpu_id, quote: "pub fn raw_cpu_id(logical_cpu_id: LogicalCpuId) -> Option<RawCpuId> {"}
  - name: nr_cpus
    symbols: [kcpu_id_map::nr_cpus, kcpu_id_map::for_each_present_logical_cpu]
    effect: runtime present CPU count (clamped to NR_CPUS, 1 before initialization) and iteration over present CPUs
    evidence:
      - {path: arch/kcpu_id_map/src/lib.rs, item: kcpu_id_map::nr_cpus, quote: "static array bound. Before the CPU id map is initialized it returns 1, since"}
  - name: mask_helpers
    symbols: [kcpu_id_map::KCpuMaskExt]
    effect: set_logical, get_logical, one_shot_logical and iter_logical on KCpuMask using LogicalCpuId
    evidence:
      - {path: arch/kcpu_id_map/src/cpu_id.rs, item: kcpu_id_map::cpu_id::KCpuMaskExt::set_logical, quote: "fn set_logical(&mut self, cpu_id: LogicalCpuId, value: bool) -> bool;"}
contract:
  no_std:
    value: 'yes (cfg_attr: no_std unless test)'
    evidence:
    - path: arch/kcpu_id_map/src/lib.rs
      quote: '#![cfg_attr(not(test), no_std)]'
  allocation:
    value: the CPU id table stores a fixed [usize; NR_CPUS] array in a static Once; allocation behavior
      of firmware enumeration is not established
    evidence:
    - path: arch/kcpu_id_map/src/cpu_id.rs
      item: kcpu_id_map::cpu_id::CPU_ID_MAP
      quote: 'static CPU_ID_MAP: Once<CpuIdMap> = Once::new();'
    - path: arch/kcpu_id_map/src/cpu_id.rs
      item: kcpu_id_map::cpu_id::CpuIdMap
      quote: 'raw_cpu_ids_by_logical: [usize; NR_CPUS],'
  blocking:
    value: unknown
    evidence: []
  irq_nmi:
    value: unknown
    evidence: []
  ownership_lifetime:
    value: global read-mostly table published once through klazy::Once; LogicalCpuId and RawCpuId are
      Copy newtypes
    evidence:
    - path: arch/kcpu_id_map/src/cpu_id.rs
      item: kcpu_id_map::cpu_id::CPU_ID_MAP
      quote: 'static CPU_ID_MAP: Once<CpuIdMap> = Once::new();'
    - path: arch/kcpu_id_map/src/cpu_id.rs
      item: kcpu_id_map::cpu_id::LogicalCpuId
      quote: '#[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash)]'
  errors_bounds:
    value: conversions return Option (None for absent ids); more CPUs than NR_CPUS in the firmware description
      are truncated with a warning, not a panic; loading twice panics; AArch64 enumeration requires a
      device tree
    evidence:
    - path: arch/kcpu_id_map/src/cpu_id.rs
      item: kcpu_id_map::cpu_id::load_cpu_id_map
      quote: CPU id map is already initialized
    - path: arch/kcpu_id_map/src/arch/aarch64.rs
      item: kcpu_id_map::arch::aarch64::load_raw_cpu_ids_from_fdt
      quote: // support (NR_CPUS). Cap to NR_CPUS rather than panicking, so the same
    - path: arch/kcpu_id_map/src/lib.rs
      item: kcpu_id_map::logical_cpu_id
      quote: 'pub fn logical_cpu_id(raw_cpu_id: RawCpuId) -> Option<LogicalCpuId> {'
  concurrency:
    value: unknown
    evidence: []
