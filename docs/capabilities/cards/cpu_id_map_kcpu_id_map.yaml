capability: cpu_id_map_kcpu_id_map
title: Logical/raw CPU id mapping and NR_CPUS-sized CPU mask (kcpu_id_map)
family: cpu.mask
summary: >-
  Type-safe CPU numbering. LogicalCpuId (dense zero-based index used for arrays, per-CPU slots and
  masks) and RawCpuId (hardware id: MPIDR affinity, APIC id, hart id) are distinct newtypes;
  raw_cpu_id / logical_cpu_id convert through a boot-time table built from the device tree or ACPI
  MADT (init_boot_cpu_id_map), capped at NR_CPUS. nr_cpus returns the present CPU count (1 before
  initialization); for_each_present_logical_cpu iterates them. KCpuMask = cpumask::CpuMask<NR_CPUS>
  with KCpuMaskExt helpers taking and returning LogicalCpuId.
