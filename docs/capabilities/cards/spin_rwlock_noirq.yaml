capability: spin_rwlock_noirq
title: IRQ-disabling reader-writer spin lock (kspin::SpinRwNoIrq)
family: sync.rwlock
summary: >-
  Reader-writer spin lock whose read and write guards both disable preemption and IRQs. Allows
  concurrent readers or one writer in short, non-sleeping critical sections.
source: {kind: workspace, crate: kspin, path: task/kspin}
symbols:
  - {fqn: kspin::SpinRwNoIrq, kind: type, path: task/kspin/src/lib.rs, role: primary}
  - {fqn: kspin::SpinRwNoIrqReadGuard, kind: type, path: task/kspin/src/lib.rs, role: helper}
  - {fqn: kspin::SpinRwNoIrqWriteGuard, kind: type, path: task/kspin/src/lib.rs, role: helper}
  - {fqn: kspin::SpinRwLock, kind: struct, path: task/kspin/src/rwlock.rs, role: helper}
  - {fqn: kspin::SpinRwLock::read, kind: fn, path: task/kspin/src/rwlock.rs, role: operation}
  - {fqn: kspin::SpinRwLock::write, kind: fn, path: task/kspin/src/rwlock.rs, role: operation}
  - {fqn: kspin::SpinRwLock::try_read, kind: fn, path: task/kspin/src/rwlock.rs, role: operation}
  - {fqn: kspin::SpinRwLock::try_write, kind: fn, path: task/kspin/src/rwlock.rs, role: operation}
operations:
  - name: read
    symbols: [kspin::SpinRwLock::read]
    effect: acquire guard state, then spin while a writer holds the lock, then increment the reader count
    evidence: [{path: task/kspin/src/rwlock.rs, item: kspin::rwlock::SpinRwLock::read, quote: "Acquires a shared read lock."}]
  - name: write
    symbols: [kspin::SpinRwLock::write]
    effect: exclusive spinning acquisition
    evidence: [{path: task/kspin/src/rwlock.rs, item: kspin::rwlock::SpinRwLock::write, quote: "pub fn write(&self) -> SpinRwLockWriteGuard<'_, G, T>"}]
usage_protocol:
  - step: "use for short, non-sleeping shared/exclusive sections that IRQ handlers may also enter"
    evidence: [{path: task/kspin/src/lib.rs, item: kspin::SpinRwNoIrq, quote: "Suitable for short process-tree or IRQ-visible critical sections that allow"}]
contract:
  no_std:
    value: "yes (cfg_attr: no_std unless test)"
    evidence: [{path: task/kspin/src/lib.rs, quote: "#![cfg_attr(not(test), no_std)]"}]
  allocation:
    value: unknown
    evidence: []
  blocking:
    value: spins; cannot sleep
    evidence: [{path: task/kspin/src/lib.rs, item: kspin::SpinRwNoIrq, quote: "concurrent readers but cannot sleep"}]
  irq_nmi:
    value: both reader and writer disable preemption and IRQs; IRQ-visible sections are the stated use; NMI not stated
    evidence: [{path: task/kspin/src/rwlock.rs, item: kspin::rwlock::SpinRwLock, quote: "disables preemption and IRQs for both"}]
  ownership_lifetime:
    value: lock owns the value; RAII read/write guards release on drop
    evidence: [{path: task/kspin/src/rwlock.rs, item: kspin::rwlock::SpinRwLockWriteGuard, quote: "RAII write guard for [`SpinRwLock`]."}]
  errors_bounds:
    value: try_read / try_write return Option; read panics on reader-count overflow (2^63 - 1 readers)
    evidence:
      - {path: task/kspin/src/rwlock.rs, item: kspin::rwlock::SpinRwLock::try_read, quote: "pub fn try_read(&self) -> Option<SpinRwLockReadGuard<'_, G, T>>"}
      - {path: task/kspin/src/rwlock.rs, item: kspin::rwlock::SpinRwLock::read, quote: "too many spin rwlock readers"}
  concurrency:
    value: many readers or one writer; readers spin while a writer holds the lock; no fairness statement
    evidence: [{path: task/kspin/src/rwlock.rs, item: kspin::rwlock::SpinRwLock, quote: "A spinning reader-writer lock with configurable guard behavior."}]
