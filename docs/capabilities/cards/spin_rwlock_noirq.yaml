aliases:
  en: [rwlock, read_lock_irqsave, write_lock_irqsave, rw spinlock, reader writer spinlock, irq-safe rwlock]
  zh: [读写自旋锁, 读写锁, 关中断读写锁]
identifiers: [reader_count, readers, WRITE_LOCKED, READER_MASK, AtomicUsize, rwlock]
exclusions:
- no sleeping; for blocking readers/writers use ksync::RwLock (blocking_rwlock)
- only the NoPreemptIrqSave instantiation has an alias; other guard types are possible through SpinRwLock<G,
  T> but are not documented
- NoPreempt guard behavior depends on the preempt feature and host/kernel cfg. IRQ masking does not exclude
  NMI; do not use as a blanket NMI-safe lock or replace a lock-free NMI protocol.
