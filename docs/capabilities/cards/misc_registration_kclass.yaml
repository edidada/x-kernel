exclusions:
  - registries are per device class and typed (one feature per class); not a generic key/value registry or an init-order list
  - consumers get only currently active devices; inactive or removed ones are filtered out
counter_examples: []
notes: generic is private and ClassRegistry is internal. Import kclass::ClassDevice / ClassAvailabilityCallback;
  e.g. net feature exposes kclass::publish_net, net_devices, find_net_device and subscribe_net_available.
  These are generated by class_registries!/class_registry!; no direct ClassRegistry use is public. Cargo
  edges below do not establish that every listed crate uses this particular class.
