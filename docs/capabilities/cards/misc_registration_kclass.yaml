aliases:
  en: [device registry, register_netdev, register_blkdev, device class, class registry, subscribe device available, hotplug notification, driver registration, global device list, probe order independent, publish device]
  zh: [设备注册表, 设备类, 设备发布与订阅, 驱动注册, 全局设备列表, 设备可用通知, 与探测顺序无关]
