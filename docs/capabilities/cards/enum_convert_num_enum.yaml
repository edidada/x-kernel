      - {path: core/ksyscall/Cargo.toml, quote: 'num_enum = { version = "0.7", default-features = false }'}
  allocation: {value: unknown, evidence: []}
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: unknown
    evidence: []
  errors_bounds:
    value: TryFromPrimitive returns TryFromPrimitiveError holding the rejected number; UnsafeFromPrimitive requires a valid discriminant
    evidence:
      - {path: num_enum-0.7.6/src/lib.rs, item: num_enum::TryFromPrimitive::try_from_primitive, quote: "fn try_from_primitive(number: Self::Primitive) -> Result<Self, Self::Error>;"}
      - {path: num_enum-0.7.6/src/lib.rs, item: num_enum::TryFromPrimitiveError, quote: "pub number: Enum::Primitive,"}
  concurrency: {value: unknown, evidence: []}
