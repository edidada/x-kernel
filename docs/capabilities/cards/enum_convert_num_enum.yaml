aliases:
  en: [num_enum, try_from int, int to enum, enum from integer, enum conversion, from_primitive, repr enum parse, command code enum, discriminant lookup]
  zh: [整数转枚举, 枚举转换, 命令码枚举, 判别值查找, 从原始值转换]
identifiers: [TryFromPrimitive, FromPrimitive, IntoPrimitive, UnsafeFromPrimitive, try_from_primitive, repr, discriminant, TryFromPrimitiveError]
exclusions:
- TryFromPrimitive/IntoPrimitive use integer-repr enum discriminants; FromPrimitive additionally supports
  a catch_all variant carrying the primitive value. For independent bit sets use flags_bitflags.
- 'the derive is a proc macro: the generated code and the TryFromPrimitiveError text live in num_enum_derive,
  which this card does not index'
- vendor/kvirtiodrivers uses the separate enumn crate (enumn::N) for the same job inside the virtio driver;
  do not add num_enum there
counter_examples: []
notes: >-
  Only one derive use at the pin: the x86_64 ArchPrctlCode in ksyscall. Most syscall and ioctl code tables are generated from C headers (see the comment on ArchPrctlCode) rather than derived.
