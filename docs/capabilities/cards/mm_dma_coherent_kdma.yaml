  zh: [DMA 一致性内存分配, DMA 缓冲区分配, 描述符环内存, 总线地址转换, 物理地址转总线地址]
identifiers: [dma_alloc_coherent, dma_free_coherent, DmaInfo, bus_addr, cpu_addr, PHYS_BUS_OFFSET, virt_to_bus, phys_to_bus, alloc_pages, Layout, "alloc_zeroed", dma_addr]
exclusions:
- for temporary mapping of an existing buffer (streaming DMA) use map_dma_buffer / unmap_dma_buffer (mm_dma_streaming_kdma),
  not a coherent allocation
- p2b / b2p assume a single linear offset (PHYS_BUS_OFFSET); a device whose bus addresses are not that
  linear mapping needs its own translation
- A SpinNoIrq around allocator state does not prove end-to-end IRQ/NMI safety of allocation, mapping updates
  or platform hooks; context is unknown.
