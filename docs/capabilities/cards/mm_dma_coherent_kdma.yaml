    value: unknown
    evidence: []
  ownership_lifetime:
    value: unsafe API; the caller owns the DmaInfo and must free exactly once with the same layout, and
      only expose the bus address to devices allowed to DMA that buffer
    evidence:
    - path: io/kdma/src/lib.rs
      item: kdma::allocate_dma_memory
      quote: '[`deallocate_dma_memory`] using the same `layout`, and must only expose the'
  errors_bounds:
    value: AllocResult<DmaInfo>; NoMemory when pages cannot be allocated, mapping-attribute update fails,
      or the platform prepare hook fails
    evidence:
    - path: io/kdma/src/lib.rs
      item: kdma::allocate_dma_memory
      quote: Returns `AllocError::NoMemory` when pages cannot be allocated, the
  concurrency:
    value: serialised by a global SpinNoIrq lock
    evidence:
    - path: io/kdma/src/lib.rs
      item: kdma::allocate_dma_memory
      quote: unsafe { ALLOCATOR.lock().allocate_dma_memory(layout) }
