capability: mm_dma_coherent_kdma
title: DMA-coherent memory allocation and bus-address conversion (kdma::allocate_dma_memory / p2b)
family: mm.dma
summary: >-
  Allocates physically contiguous, coherent, device-reachable memory (descriptor rings, shared queues)
  with the CPU virtual address and the bus address together (DmaInfo), frees it with the same layout,
  and converts physical addresses to bus addresses (p2b / b2p, linear offset).
source: {kind: workspace, crate: kdma, path: io/kdma}
symbols:
  - {fqn: kdma::allocate_dma_memory, kind: fn, path: io/kdma/src/lib.rs, role: primary}
  - {fqn: kdma::deallocate_dma_memory, kind: fn, path: io/kdma/src/lib.rs, role: primary}
  - {fqn: kdma::DmaInfo, kind: struct, path: io/kdma/src/lib.rs, role: primary}
  - {fqn: kdma::DmaBusAddress, kind: struct, path: io/kdma/src/lib.rs, role: helper}
  - {fqn: kdma::p2b, kind: fn, path: io/kdma/src/lib.rs, role: operation}
  - {fqn: kdma::b2p, kind: fn, path: io/kdma/src/lib.rs, role: operation}
operations:
  - name: allocate
    symbols: [kdma::allocate_dma_memory, kdma::DmaInfo]
    effect: allocate contiguous coherent pages for a Layout; returns cpu_addr + bus_addr or AllocError::NoMemory
    evidence:
      - {path: io/kdma/src/lib.rs, item: kdma::allocate_dma_memory, quote: "Allocates **coherent** memory that meets Direct Memory Access (DMA)"}
      - {path: io/kdma/src/lib.rs, item: kdma::allocate_dma_memory, quote: "Returns `AllocError::NoMemory` when pages cannot be allocated, the"}
  - name: free
    symbols: [kdma::deallocate_dma_memory]
    effect: release exactly once with the same layout
    evidence:
      - {path: io/kdma/src/lib.rs, item: kdma::deallocate_dma_memory, quote: "`dma` must come from a prior successful [`allocate_dma_memory`] call, and"}
  - name: phys_to_bus
    symbols: [kdma::p2b, kdma::b2p]
    effect: "baddr = paddr + PHYS_BUS_OFFSET and the inverse"
    evidence:
      - {path: io/kdma/src/lib.rs, item: kdma::p2b, quote: "`baddr = paddr + PHYS_BUS_OFFSET`."}
usage_protocol:
  - step: "allocate once per ring/queue, program the device with dma.bus_addr, free with deallocate_dma_memory(dma, layout) using the identical Layout"
    evidence: [{path: io/kdma/src/lib.rs, item: kdma::allocate_dma_memory, quote: "The caller must free the returned allocation exactly once with"}]
