aliases:
  en: [elf parser, parse elf, program headers, load segments, PT_LOAD, section headers, elf header, executable loader, elf image, dynamic linker interp]
  zh: [ELF 解析, 程序头, 加载段, 节头, ELF 头, 可执行文件加载, 解释器]
identifiers: [ElfFile, program_iter, section_iter, ProgramHeader, PT_LOAD, PT_INTERP, e_phoff, e_entry, parse_header, xmas_elf]
exclusions:
- parsing only; mapping segments, building the user stack and auxv are done by kernel_elf_parser and kexec
  on top of it, not by this crate
- does not relocate or resolve dynamic symbols
- host-side tools (goblin in xkmake / tasign) are a separate ELF parser used by build tools, not by kernel
  code
- Do not substitute this raw parser for a validating loader on untrusted bytes. ElfFile::new validates
  the initial header only; later accessors can panic on offsets outside the image or unsuitable alignment.
counter_examples:
  - path: boot/kernel_elf_parser/src/info.rs
    item: kernel_elf_parser::info::ElfHeadersBuilder
    why: "ElfHeadersBuilder is the kernel-side wrapper that adds checked program-header range computation on top of xmas_elf::header::parse_header; extend that wrapper instead of re-parsing headers elsewhere"
    evidence: [{path: boot/kernel_elf_parser/src/info.rs, item: kernel_elf_parser::info::ElfHeadersBuilder::new, quote: "header: xmas_elf::header::parse_header(input)?,"}]
notes: ""
