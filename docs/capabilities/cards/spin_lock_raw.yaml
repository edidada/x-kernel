capability: spin_lock_raw
title: Guard-less spin lock for contexts that already disabled IRQs and preemption (kspin::SpinRaw)
family: sync.spinlock
summary: >-
  SpinLock with the NoOp guard: lock() only spins on the flag and does not disable preemption or IRQs.
  Documented as a lock that must only be used where preemption and IRQs are already disabled.
source: {kind: workspace, crate: kspin, path: task/kspin}
symbols:
  - {fqn: kspin::SpinRaw, kind: type, path: task/kspin/src/lib.rs, role: primary}
  - {fqn: kspin::SpinRawGuard, kind: type, path: task/kspin/src/lib.rs, role: helper}
  - {fqn: kspin::SpinLock, kind: struct, path: task/kspin/src/lock.rs, role: helper}
  - {fqn: kspin::SpinLock::lock, kind: fn, path: task/kspin/src/lock.rs, role: operation}
  - {fqn: kspin::NoOp, kind: struct, path: task/kspin/src/guard/types.rs, role: helper}
operations:
  - name: lock
    symbols: [kspin::SpinLock::lock]
    effect: spins on the atomic flag with no context protection
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock, quote: "No special behavior (fastest, least safe)"}]
usage_protocol:
  - step: "enter only from code that already holds IRQs and preemption off (for example inside another SpinNoIrq section)"
    evidence: [{path: task/kspin/src/lib.rs, item: kspin::SpinRaw, quote: "Must only be used in contexts where preemption and IRQs"}]
contract:
  no_std:
    value: "yes (cfg_attr: no_std unless test)"
    evidence: [{path: task/kspin/src/lib.rs, quote: "#![cfg_attr(not(test), no_std)]"}]
  allocation:
    value: unknown
    evidence: []
  blocking:
    value: spins; may panic or deadlock if already held by the caller
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::lock, quote: "May panic or deadlock if called while already holding the lock."}]
  irq_nmi:
    value: provides no IRQ protection; documented warning that IRQs and preemption must already be disabled
    evidence: [{path: task/kspin/src/lib.rs, item: kspin::SpinRaw, quote: "Must only be used in contexts where preemption and IRQs"}]
  ownership_lifetime:
    value: lock owns the value; RAII guard releases the flag on drop
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLockGuard, quote: "RAII guard for spinlock."}]
  errors_bounds:
    value: try_lock returns Option; no error type
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::try_lock, quote: "pub fn try_lock(&self) -> Option<SpinLockGuard<'_, G, T>>"}]
  concurrency:
    value: atomic flag only with the smp feature
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock, quote: "Without the `smp` feature, the lock state is optimized away"}]
