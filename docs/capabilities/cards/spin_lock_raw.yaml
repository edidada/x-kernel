aliases:
  en: [raw spinlock, raw_spin_lock, bare spinlock, nested spinlock, lock without irq save]
  zh: [裸自旋锁, 无保护自旋锁, 嵌套自旋锁]
identifiers: [AtomicBool, compare_exchange, spin_loop, locked]
exclusions:
- 'Use only when the documented IRQ/preemption exclusion already holds. A NoOp guard alone provides no
  NMI safety: an NMI can still deadlock if it interrupts a holder of the same lock.'
counter_examples: []
notes: >-
  This card documents the lowest-protection variant on purpose so a PR that hand-rolls an AtomicBool
  lock is pointed at the same flag logic; the guard choice is what differs between the spin_lock_* cards.
