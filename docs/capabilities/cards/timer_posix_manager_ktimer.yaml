capability: timer_posix_manager_ktimer
title: Process-owned setitimer and POSIX timer state with alarm task (ktimer::ProcessTimerManager)
family: task.timer
summary: >-
  Process-side timer semantics: three setitimer interval timers (ITIMER_REAL / VIRTUAL / PROF) and
  POSIX timer_create timers with overrun bookkeeping, per-process in ProcessTimerManager. Wall-clock
  deadlines across clock domains are queued in one global alarm queue served by an async alarm task
  (spawn_alarm_task) which calls a registered handler with the owner PID; expirations are returned
  as TimerDelivery values that kprocess turns into signals. Not a generic kernel timer.
