operations:
  - name: set_itimer
    symbols: [ktimer::ProcessTimerManager::set_itimer]
    effect: sets an interval timer for a type and returns the previous (interval, remaining); ITIMER_REAL is armed in the global alarm queue
    evidence:
      - {path: process/ktimer/src/manager.rs, item: ktimer::manager::ProcessTimerManager::set_itimer, quote: "/// Sets an interval timer and returns the previous state."}
  - name: posix_timers
    symbols: [ktimer::ProcessTimerManager::create_posix_timer, ktimer::ProcessTimerManager::delete_posix_timer]
    effect: creates a POSIX timer with an allocated id (wrapping counter probing a BTreeMap, InvalidInput when exhausted) and a clock/notification policy
    evidence:
      - {path: process/ktimer/src/manager.rs, item: ktimer::manager::ProcessTimerManager::create_posix_timer, quote: "The kernel timer ID allocated for the new timer."}
  - name: alarm_task
    symbols: [ktimer::spawn_alarm_task, ktimer::register_expired_task_handler]
    effect: one global task waits for the earliest queued deadline across wall-clock domains and calls the registered owner handler with the PID
    evidence:
      - {path: process/ktimer/src/runtime.rs, item: ktimer::runtime::spawn_alarm_task, quote: "/// Spawns the global alarm task that waits on the earliest queued"}
