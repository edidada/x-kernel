exclusions:
  - a crate-local error enum that is only ever converted to errno is fine, but new enums that duplicate Linux errno values should reuse KErrorKind / LinuxError
  - KError::code() is the internal tagged representation, not a syscall return value (use into_syscall_return)
  - pure no-log error construction should use KError::from(KErrorKind) rather than k_err! when a warn log is unwanted
counter_examples:
  - path: process/osvm/src/lib.rs
    item: osvm::MemError
    why: osvm::MemError is a domain error for user-memory access that converts into KError; it keeps a smaller domain-specific set (InvalidAddr / NoAccess / OutOfMemory) and is not replaced by KError directly
    evidence: [{path: process/osvm/src/lib.rs, quote: "impl From<MemError> for KError {"}]
  - path: mm/page_table/src/defs.rs
    item: page_table::defs::PtError
    why: page_table::PtError is a crate error with an optional kerrno conversion; the conversion is lossy (all but NoMemory become InvalidInput)
    evidence: [{path: mm/page_table/src/defs.rs, quote: "impl From<PtError> for kerrno::KError {"}]
