capability: error_errno_kerror
title: Kernel error type with Linux errno conversion (kerrno::KError / KResult / LinuxError)
family: error.errno
summary: KError is the common kernel error value (kernel error kinds plus Linux errno), KResult<T> the
  result alias, LinuxError the re-exported errno enum. Conversions go both ways; KError::into_syscall_return
  encodes the negated Linux errno for the syscall ABI; k_err! / k_bail! construct warning-logged errors;
  ensure! returns the supplied expression when its condition fails and only logs if that expression does.
