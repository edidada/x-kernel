operations:
- name: map_linear
  symbols:
  - memspace::MmSpace::map_linear
  effect: add a linear vaddr-to-paddr mapping (paddr 4K aligned) backed by a linear runtime
  evidence:
  - path: mm/memspace/src/aspace.rs
    item: memspace::aspace::MmSpace::map_linear
    quote: Add a new linear mapping.
- name: unmap
  symbols:
  - memspace::MmSpace::unmap
  effect: remove mappings in a range; error if out of the space or unaligned
  evidence:
  - path: mm/memspace/src/aspace.rs
    item: memspace::aspace::MmSpace::unmap
    quote: Removes mappings within the specified virtual address range.
- name: protect
  symbols:
  - memspace::MmSpace::protect
  effect: change permissions of a range
  evidence:
  - path: mm/memspace/src/aspace.rs
    item: memspace::aspace::MmSpace::protect
    quote: Updates mapping within the specified virtual address range.
- name: read_write
  symbols:
  - memspace::MmSpace::read
  - memspace::MmSpace::write
  effect: copy bytes from/to an address in this space (via the physical pages) into a kernel buffer
  evidence:
  - path: mm/memspace/src/aspace.rs
    item: memspace::aspace::MmSpace::read
    quote: To read data from the address space.
  - path: mm/memspace/src/aspace.rs
    item: memspace::aspace::MmSpace::write
    quote: To write data to the address space.
- name: find_free_area
  symbols:
  - memspace::MmSpace::find_free_area
  effect: search from a hint for a free range of a size and alignment within a limit
  evidence:
  - path: mm/memspace/src/aspace.rs
    item: memspace::aspace::MmSpace::find_free_area
    quote: Finds a free area that can accommodate the given size.
usage_protocol:
- step: Create MmSpace::new_empty_user(base, size) or new_empty_kernel(base, size), then map/unmap/protect.
    The kernel instance is held in a global SpinNoIrq<MmSpace>; user-space owners provide their own synchronization.
  evidence:
  - path: mm/memspace/src/aspace.rs
    item: memspace::aspace::MmSpace::new_empty_user
    quote: 'pub fn new_empty_user(base: VirtAddr, size: usize) -> KResult<Self> {'
  - path: mm/memspace/src/lib.rs
    item: memspace::KERNEL_ASPACE
    quote: 'static KERNEL_ASPACE: LazyInit<SpinNoIrq<MmSpace>> = LazyInit::new();'
contract:
  no_std:
    value: "yes (#![no_std])"
    evidence: [{path: mm/memspace/src/lib.rs, quote: "#![no_std]"}]
  allocation: {value: unknown, evidence: []}
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: MmSpace owns its VMA set and page table; user spaces are shared as Arc<Mutex<MmSpace>>
    evidence:
      - {path: mm/memspace/src/aspace.rs, item: memspace::aspace::MmSpace, quote: "pub struct MmSpace {"}
      - {path: mm/memspace/src/aspace.rs, item: memspace::aspace::MmSpace::try_clone, quote: "pub fn try_clone(&mut self) -> KResult<Arc<Mutex<Self>>> {"}
  errors_bounds:
    value: KResult errors for out-of-range or unaligned regions
    evidence: [{path: mm/memspace/src/aspace.rs, item: memspace::aspace::MmSpace::unmap, quote: "Returns an error if the address range is out of the address space or not"}]
  concurrency:
    value: methods take &mut self / &self; callers serialise through the Mutex around the shared space
    evidence: [{path: mm/memspace/src/aspace.rs, item: memspace::aspace::MmSpace::acquire_user, quote: "pub fn acquire_user(address_space: Arc<Mutex<Self>>) -> Option<MmUserHandle> {"}]
