capability: mm_address_space_memspace
title: Process / kernel virtual address space with VMAs (memspace::MmSpace map / unmap / protect / read / write / find_free_area)
family: mm.page_table
summary: >-
  MmSpace (alias AddrSpace) is a virtual address space: a page table plus a VMA set. It maps linear
  or runtime-backed regions, unmaps, mprotects, finds free areas, reads/writes bytes through the
  space, handles page faults, clones for fork, and exposes futex backing resolution.
source: {kind: workspace, crate: memspace, path: mm/memspace}
symbols:
- fqn: memspace::MmSpace
  kind: struct
  path: mm/memspace/src/aspace.rs
  role: primary
- fqn: memspace::AddrSpace
  kind: type
  path: mm/memspace/src/aspace.rs
  role: reexport
- fqn: memspace::MmSpace::map_linear
  kind: fn
  path: mm/memspace/src/aspace.rs
  role: operation
- fqn: memspace::MmSpace::map
  kind: fn
  path: mm/memspace/src/aspace.rs
  role: operation
- fqn: memspace::MmSpace::unmap
  kind: fn
  path: mm/memspace/src/aspace.rs
  role: operation
- fqn: memspace::MmSpace::protect
  kind: fn
  path: mm/memspace/src/aspace.rs
  role: operation
- fqn: memspace::MmSpace::read
  kind: fn
  path: mm/memspace/src/aspace.rs
  role: operation
- fqn: memspace::MmSpace::write
  kind: fn
  path: mm/memspace/src/aspace.rs
  role: operation
- fqn: memspace::MmSpace::find_free_area
