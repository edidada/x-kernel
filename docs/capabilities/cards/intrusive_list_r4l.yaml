capability: intrusive_list_r4l
title: Intrusive list with O(1) arbitrary removal over Box/Arc elements (linked_list_r4l::List)
family: container.list
summary: >-
  linked_list_r4l::List<G> is an intrusive doubly-linked list ported from Rust-for-Linux. Elements
  embed a Links<T> field, expose it through the GetLinks trait, and are wrapped in Box or Arc; the list
  takes ownership while linked. Offers push_back / push_front / pop_front, unsafe remove of a given
  entry and cursors. Links tracks membership with an atomic flag so double insertion is rejected.
