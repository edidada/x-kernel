aliases:
  en: [wait queue, waitqueue, wait_event, wake_up_all, condition wait, predicate wait, broadcast wait, no-alloc wait queue]
  zh: [等待队列, 条件等待, 广播唤醒, 无分配等待队列]
identifiers: [ready, predicate, notify_all, register, enrol, park, waiters]
exclusions:
  - "broadcast only (no wake-one); use ktask::WaitQueue when you need notify_one or timeouts"
  - "no timeout or signal handling"
counter_examples:
  - path: task/ktask/src/wait_queue.rs
    item: ktask::wait_queue::WaitQueue
    why: ktask::WaitQueue has the same name but allocates through event_listener, supports notify_one, and has timeout waits; the two are not interchangeable
    evidence: [{path: task/ktask/src/wait_queue.rs, quote: "Blocking wait queue built on event listeners and timers."}]
notes: ""
