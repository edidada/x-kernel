capability: flags_bitflags
title: Typed C-style flag sets (bitflags::bitflags! macro and Flags trait)
family: misc.bits
summary: >-
  The bitflags! macro generates a newtype over an integer with named flag constants, set operators
  (| & - ^ !), contains / intersects / insert / remove / toggle, and checked or truncating conversion
  from raw bits. It is the workspace-wide way to declare syscall flag words, VM/page permission flags,
  poll event masks and similar bit sets.
source: {kind: dependency, crate: bitflags, version: 2.13.2}
symbols:
  - {fqn: bitflags::bitflags, kind: macro, path: src/lib.rs, role: primary}
  - {fqn: bitflags::Flags, kind: trait, path: src/traits.rs, role: operation}
  - {fqn: bitflags::Bits, kind: trait, path: src/traits.rs, role: helper}
  - {fqn: bitflags::Flags::from_bits, kind: fn, path: src/traits.rs, role: operation}
  - {fqn: bitflags::Flags::from_bits_truncate, kind: fn, path: src/traits.rs, role: operation}
  - {fqn: bitflags::Flags::contains, kind: fn, path: src/traits.rs, role: operation}
operations:
  - name: from_bits
    symbols: [bitflags::Flags::from_bits]
    effect: checked conversion from raw bits; None when unknown bits are set (generated types also have from_bits_truncate and from_bits_retain)
    evidence: [{path: bitflags-2.13.2/src/traits.rs, item: bitflags::traits::Flags::from_bits, quote: "This method will return `None` if any unknown bits are set."}]
  - name: from_bits_truncate
    symbols: [bitflags::Flags::from_bits_truncate]
    effect: conversion that clears unknown bits
    evidence: [{path: bitflags-2.13.2/src/traits.rs, item: bitflags::traits::Flags::from_bits_truncate, quote: "fn from_bits_truncate(bits: Self::Bits) -> Self {"}]
  - name: contains
    symbols: [bitflags::Flags::contains]
    effect: all bits of other are set
    evidence: [{path: bitflags-2.13.2/src/traits.rs, item: bitflags::traits::Flags::contains, quote: "fn contains(&self, other: Self) -> bool"}]
usage_protocol:
- step: 'Declare named bits with bitflags! and choose conversion per ABI: from_bits rejects unknown bits,
    from_bits_truncate discards them, from_bits_retain preserves them. Do not default to truncating untrusted
    flags when the ABI requires rejection.'
  evidence:
  - path: bitflags-2.13.2/src/traits.rs
    item: bitflags::traits::Flags::from_bits
    quote: This method will return `None` if any unknown bits are set.
contract:
  no_std:
    value: "yes unless the std feature is on (#![cfg_attr(not(any(feature = \"std\", test)), no_std)])"
    evidence: [{path: bitflags-2.13.2/src/lib.rs, quote: '#![cfg_attr(not(any(feature = "std", test)), no_std)]'}]
  allocation:
    value: unknown
    evidence: []
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: generated types are plain integer newtypes
    evidence: [{path: bitflags-2.13.2/src/lib.rs, quote: "Generate types for C-style flags with ergonomic APIs."}]
  errors_bounds:
    value: "from_bits returns None for unknown bits; from_bits_truncate drops them; from_bits_retain keeps them"
    evidence:
      - {path: bitflags-2.13.2/src/traits.rs, item: bitflags::traits::Flags::from_bits, quote: "This method will return `None` if any unknown bits are set."}
  concurrency:
    value: unknown
    evidence: []
