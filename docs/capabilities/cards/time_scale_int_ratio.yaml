capability: time_scale_int_ratio
title: Precomputed integer ratio for scaling counters to time units (int_ratio::Ratio)
family: time.types
summary: >-
  Ratio::new(numerator, denominator) precomputes a multiply-and-shift form so mul_trunc / mul_round
  scale a u64 (counter ticks, nanoseconds) without a 128-bit division per call. inverse() gives the
  reverse conversion. The timer drivers use two Ratios to convert between the architectural counter and
  nanoseconds.
source: {kind: dependency, crate: int_ratio, version: 0.1.2}
symbols:
  - {fqn: int_ratio::Ratio, kind: struct, path: src/lib.rs, role: primary}
  - {fqn: int_ratio::Ratio::new, kind: fn, path: src/lib.rs, role: constructor}
  - {fqn: int_ratio::Ratio::zero, kind: fn, path: src/lib.rs, role: constructor}
  - {fqn: int_ratio::Ratio::inverse, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: int_ratio::Ratio::mul_trunc, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: int_ratio::Ratio::mul_round, kind: fn, path: src/lib.rs, role: operation}
operations:
  - name: new
    symbols: [int_ratio::Ratio::new]
    effect: build a ratio of two u32; panics when the denominator is zero and the numerator is not
    evidence:
      - {path: int_ratio-0.1.2/src/lib.rs, item: int_ratio::Ratio::new, quote: "Panics if `denominator` is zero and `numerator` is not zero."}
  - name: scale
    symbols: [int_ratio::Ratio::mul_trunc, int_ratio::Ratio::mul_round]
    effect: multiply a u64 by the ratio, truncating or rounding to nearest, using a precomputed multiplier and shift
    evidence:
      - {path: int_ratio-0.1.2/src/lib.rs, item: int_ratio::Ratio::mul_trunc, quote: "((value as u128 * self.mult as u128) >> self.shift) as u64"}
  - name: inverse
    symbols: [int_ratio::Ratio::inverse, int_ratio::Ratio::zero]
    effect: reciprocal ratio; the zero ratio 0/0 inverts to itself instead of panicking
    evidence:
      - {path: int_ratio-0.1.2/src/lib.rs, item: int_ratio::Ratio::inverse, quote: "Self::new(self.denominator, self.numerator)"}
usage_protocol:
  - step: "build the Ratio once at timer initialisation from the counter frequency (for example Ratio::new(NANOS_PER_SEC, frequency_hz)) and keep it in a static Once; scale with mul_trunc on the hot path"
    evidence:
      - {path: drivers/platform/timer/src/arm_generic.rs, item: timer_driver::arm_generic::init, quote: "Ratio::new(ktime_types::NANOS_PER_SEC as u32, frequency.as_hz() as u32)"}
