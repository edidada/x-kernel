  - path: drivers/platform/console/Cargo.toml
    quote: kiface = { workspace = true }
aliases:
  en:
  - extern trait
  - link-time interface
  - hook function
  - crate_interface
  - platform hook
  - dependency inversion
  - provider
  - interface crate
  zh:
  - 跨 crate 接口
  - 链接期接口
  - 单实现接口
  - 依赖倒置
  - 平台钩子
