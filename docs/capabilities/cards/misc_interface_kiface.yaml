identifiers: [extern_trait, crate_interface, "#[no_mangle]", "extern \"Rust\"", weak, static OPS, "dyn Ops", register_ops, set_hook, "static HOOK", fn_ptr, Provider, Impl]
exclusions:
  - exactly one provider; for several implementations selected at runtime use a registry (misc_registration_kclass) or trait objects
  - the provider crate must be linked into the final image or the link fails; not for optional features
  - a single-type external trait with state (osvm::VirtMemIo via the extern-trait crate) is a different mechanism; see the counter example
counter_examples:
  - path: process/osvm/src/lib.rs
    item: osvm::VirtMemIo
    why: osvm declares its provider contract with the extern-trait crate (#[extern_trait(MemImpl)] on an unsafe trait with a constructor) instead of kiface; it is a type-level provider rather than free-function facade
    evidence: [{path: process/osvm/src/lib.rs, item: osvm::VirtMemIo, quote: "#[extern_trait(MemImpl)]"}]
