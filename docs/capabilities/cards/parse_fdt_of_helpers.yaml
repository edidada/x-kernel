capability: parse_fdt_of_helpers
title: Global boot device-tree handle and platform decoders (of::init_device_tree_ptr, find_compatible, read_memory_regions, generic_pci_host_info)
family: parse.fdt
summary: >-
  The of crate holds the boot device tree in a global LazyInit and offers decoded queries on it:
  chosen bootargs / stdout path, root model and compatible, find_node / find_compatible /
  resolve_node, enabled CPU nodes and their reg, interrupt descriptor decoding, generic PCI host
  bridge info and ranges, memory / reserved regions copied into fixed-capacity arrays, syscon
  poweroff, DICE region.
source: {kind: workspace, crate: of, path: drivers/platform/of}
symbols:
  - {fqn: of::init_device_tree_ptr, kind: fn, path: drivers/platform/of/src/lib.rs, role: constructor}
  - {fqn: of::fdt, kind: fn, path: drivers/platform/of/src/lib.rs, role: primary}
  - {fqn: of::find_compatible, kind: fn, path: drivers/platform/of/src/lib.rs, role: primary}
  - {fqn: of::find_node, kind: fn, path: drivers/platform/of/src/lib.rs, role: operation}
  - {fqn: of::chosen_bootargs, kind: fn, path: drivers/platform/of/src/lib.rs, role: operation}
  - {fqn: of::read_memory_regions, kind: fn, path: drivers/platform/of/src/lib.rs, role: operation}
  - {fqn: of::read_reserved_memory_regions, kind: fn, path: drivers/platform/of/src/lib.rs, role: operation}
  - {fqn: of::enabled_cpu_nodes, kind: fn, path: drivers/platform/of/src/lib.rs, role: operation}
  - {fqn: of::generic_pci_host_info, kind: fn, path: drivers/platform/of/src/lib.rs, role: operation}
operations:
  - name: init
    symbols: [of::init_device_tree_ptr]
    effect: unsafe one-time initialisation of the global DTB handle from a pointer that stays valid for the program lifetime
    evidence:
      - {path: drivers/platform/of/src/lib.rs, item: of::init_device_tree_ptr, quote: "`ptr` must point to a valid DTB blob that remains accessible for the rest of"}
  - name: lookup
    symbols: [of::find_compatible, of::find_node, of::chosen_bootargs]
    effect: delegate to the global LinuxFdt; None before initialisation
    evidence:
      - {path: drivers/platform/of/src/lib.rs, item: of::fdt, quote: "Returns the global device-tree view initialized at boot; `None` before"}
  - name: regions
    symbols: [of::read_memory_regions, of::read_reserved_memory_regions]
    effect: collect regions into a fixed-capacity array plus count; zeroed array and 0 when the tree is unavailable
    evidence:
      - {path: drivers/platform/of/src/lib.rs, item: of::read_memory_regions, quote: "Collects `/memory` regions into a fixed-capacity array; returns the"}
contract:
  no_std:
    value: "yes (#![no_std])"
    evidence: [{path: drivers/platform/of/src/lib.rs, quote: "#![no_std]"}]
  allocation:
    value: region readers fill fixed-capacity arrays (const N), not a Vec
    evidence: [{path: drivers/platform/of/src/lib.rs, item: of::read_memory_regions, quote: "pub fn read_memory_regions<const N: usize>() -> ([crate::MemoryRegion; N], usize) {"}]
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: global static LinuxFdt<'static> in a LazyInit; init takes a pointer valid for the rest of the program
    evidence: [{path: drivers/platform/of/src/lib.rs, item: of::FDT, quote: "static FDT: LazyInit<LinuxFdt<'static>> = LazyInit::new();"}]
  errors_bounds:
    value: init returns FirmwareInitError::BadDeviceTree for an invalid or null blob; queries return Option
    evidence: [{path: drivers/platform/of/src/lib.rs, item: of::init_device_tree_ptr, quote: "Returns [`FirmwareInitError::BadDeviceTree`] when the blob fails"}]
  concurrency: {value: unknown, evidence: []}
