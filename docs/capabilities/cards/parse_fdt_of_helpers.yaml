aliases:
  en: [of_find_compatible_node, of_property_read_u32, of_get_property, device tree lookup, dtb global, boot args from dtb, cpu nodes from dtb, memory node regions, reserved-memory, interrupt cells decode, pci host from dtb, stdout-path]
  zh: [设备树查询, 全局设备树, 从设备树读取启动参数, CPU 节点解析, 内存节点, 保留内存, 中断 cells 解码, PCI 主桥解析]
identifiers: [of_find_compatible_node, of_property_read_u32, of_get_property, compatible, chosen, bootargs, stdout-path, "interrupt-parent", "interrupts", reg, "memory@", reserved-memory, phandle, pci-host-ecam-generic]
exclusions:
  - queries the single global tree set by init_device_tree_ptr; a DTB not yet registered globally must be parsed with rs_fdtree::LinuxFdt directly (parse_fdt_rs_fdtree)
  - region readers return a fixed-capacity array of const N entries plus a count; pick N for the platform's region count
