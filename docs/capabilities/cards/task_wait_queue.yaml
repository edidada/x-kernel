aliases:
  en: [wait queue, waitqueue, wait_event, wait_event_timeout, wake_up, wake_up_all, condvar, condition variable, sleep on condition]
  zh: [等待队列, 条件等待, 条件变量, 唤醒, 睡眠等待]
identifiers: [Event, listener, notify, notify_all, wake_up, sleepers, waiters, condition, block_on]
exclusions:
- wait* needs a sleepable ktask task. For IRQ producers, separately audit notification allocation/Waker
  behavior and use resched=false; resched=true yields and cannot be used as an IRQ-safe wake.
- for one-shot done/wait pairs use kcompletion::Completion; for waits that must not allocate with a predicate
  use kcompletion::WaitQueue
- for readiness fan-out to async pollers use kpoll::PollSet
counter_examples: []
notes: >-
  ktask::WaitQueue is not the same type as kcompletion::WaitQueue (task_predicate_wait_queue_noalloc).
  The usize returned by notify_many is the count from event_listener::Event::notify.
