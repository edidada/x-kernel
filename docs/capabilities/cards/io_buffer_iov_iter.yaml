exclusions:
- the crate does not itself access user memory; user-space buffers need an IovSource / IovSink adapter
  (for example one built on osvm)
- one-shot transfers of a single struct to a user pointer should use osvm::write_vm_mem (mm_user_copy_osvm)
- plain std-style streaming (Read / Write) between components is io_traits_kio
- Adapter callbacks may block or allocate according to their own contracts. Error propagation does not
  roll back adapter data/cursor effects; the wrapper trusts reported copy counts.
counter_examples:
  - path: process/osvm/src/vm_io.rs
    item: osvm::vm_io::VmBytes
    why: VmBytes is a single-segment user buffer that implements kio::Read; it has no budget / revert / direction typing and is not an iovec
    evidence: [{path: process/osvm/src/vm_io.rs, item: osvm::vm_io::VmBytes, quote: "A read-only buffer in user-space virtual memory."}]
