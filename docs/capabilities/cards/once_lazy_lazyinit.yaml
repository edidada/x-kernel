aliases:
  en: [LazyInit, lazy init, init once, set once global, static OnceCell, late-initialized global, boot-time global, deferred static initialization, MaybeUninit static]
  zh: [延迟初始化, 先声明后初始化, 启动期全局变量, 一次性赋值全局, 静态变量延后赋值]
identifiers: [LazyInit, init_once, is_inited, MaybeUninit, UnsafeCell, AtomicU8, INITED, UNINIT, INITIALIZING, static mut]
exclusions:
- 'set-once only: no reset or replacement of the value; use klazy::Once for factory-based lazy initialization
  with poisoning semantics (once_lazy_klazy)'
- Deref before initialization panics; callers must guarantee boot ordering or use get()
- init spin-wait only; do not initialize from a path that can be preempted for long or interrupted by
  code needing the same cell
- 'call_once has no poison/reset guard around f(): if f unwinds after INITIALIZING is stored, later contenders
  can spin forever. Do not promise poisoning/retry behavior equivalent to klazy::Once.'
counter_examples: []
notes: >-
  Both klazy and lazyinit are used in the workspace at the pin; klazy::Once is the in-tree
  implementation, lazyinit the external crate (versions pinned by the root Cargo.toml).
