capability: spin_lock_noirq
title: IRQ-disabling, preemption-disabling spin lock (kspin::SpinNoIrq)
family: sync.spinlock
summary: >-
  Spin lock whose lock() first disables preemption and saves/disables local IRQs, then spins on an
  atomic flag (smp feature); dropping the guard releases the flag and restores IRQ and preemption
  state. Documented as usable from interrupt handlers. Never sleeps; critical sections must not block.
source: {kind: workspace, crate: kspin, path: task/kspin}
symbols:
  - {fqn: kspin::SpinNoIrq, kind: type, path: task/kspin/src/lib.rs, role: primary}
  - {fqn: kspin::SpinNoIrqGuard, kind: type, path: task/kspin/src/lib.rs, role: helper}
  - {fqn: kspin::SpinLock, kind: struct, path: task/kspin/src/lock.rs, role: helper}
  - {fqn: kspin::SpinLock::new, kind: fn, path: task/kspin/src/lock.rs, role: constructor}
  - {fqn: kspin::SpinLock::lock, kind: fn, path: task/kspin/src/lock.rs, role: operation}
  - {fqn: kspin::SpinLock::try_lock, kind: fn, path: task/kspin/src/lock.rs, role: operation}
  - {fqn: kspin::NoPreemptIrqSave, kind: struct, path: task/kspin/src/guard/types.rs, role: helper}
operations:
  - name: lock
    symbols: [kspin::SpinLock::lock]
    effect: acquires guard state (preempt off, IRQs saved and disabled) then spins until the flag is taken
    evidence:
      - {path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::lock, quote: "let guard_state = G::acquire();"}
  - name: try_lock
    symbols: [kspin::SpinLock::try_lock]
    effect: single compare-exchange attempt; on failure the guard state is released and None is returned
    evidence:
      - {path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::try_lock, quote: "Returns `Some(guard)` if successful, `None` if already locked."}
usage_protocol:
  - step: "declare `static X: SpinNoIrq<T> = SpinNoIrq::new(v)` (const constructor) and use `X.lock()` for a short critical section"
    evidence: [{path: task/kspin/src/lib.rs, quote: "static COUNTER: SpinNoIrq<u32> = SpinNoIrq::new(0);"}]
  - step: guard drop releases the lock and restores IRQ and preemption state
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock, quote: "Preemption and IRQs are disabled here"}]
contract:
  no_std:
    value: "yes (cfg_attr: no_std unless test)"
    evidence: [{path: task/kspin/src/lib.rs, quote: "#![cfg_attr(not(test), no_std)]"}]
  allocation:
    value: unknown
    evidence: []
  blocking:
    value: spins, never sleeps; lock() on an already-held lock may panic or deadlock (not re-entrant)
    evidence:
      - {path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::lock, quote: "May panic or deadlock if called while already holding the lock."}
      - {path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::lock, quote: "Acquire the lock, blocking until available."}
  irq_nmi:
    value: documented as the option usable from interrupt handlers (IRQs disabled while held); NMI usage is not stated
    evidence:
      - {path: task/kspin/src/lib.rs, item: kspin::SpinNoIrq, quote: "This is the safest option and can be used from any context"}
      - {path: task/kspin/src/lib.rs, item: kspin::SpinNoIrq, quote: "Spinlock that disables IRQs and preemption."}
  ownership_lifetime:
    value: lock owns the protected value; RAII guard derefs to it and releases on drop; ordering is preempt-off first, IRQ restore first on release
    evidence:
      - {path: task/kspin/src/guard/types.rs, item: kspin::guard::types::kernel::NoPreemptIrqSave::acquire, quote: "// Order: disable preemption first, then IRQs"}
      - {path: task/kspin/src/guard/types.rs, item: kspin::guard::types::kernel::NoPreemptIrqSave::release, quote: "// Order: restore IRQs first, then enable preemption"}
  errors_bounds:
    value: try_lock returns Option; no error type
    evidence: [{path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock::try_lock, quote: "pub fn try_lock(&self) -> Option<SpinLockGuard<'_, G, T>>"}]
  concurrency:
    value: atomic flag only with the smp feature; without it the lock state is optimized away (single core)
    evidence:
      - {path: task/kspin/src/lock.rs, item: kspin::lock::SpinLock, quote: "Without the `smp` feature, the lock state is optimized away"}
      - {path: task/kspin/src/lib.rs, quote: "`preempt`: Enable preemption control"}
