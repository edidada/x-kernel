aliases:
  en: [spinlock, spin lock, spin_lock_irqsave, irqsave lock, irq-safe lock, no-irq lock, raw_spinlock, interrupt-safe spinlock]
  zh: [自旋锁, 关中断自旋锁, 关中断锁, 中断安全锁, 临界区保护]
identifiers: [AtomicBool, compare_exchange, spin_loop, irq_save, local_irq_save, local_irq_disable, locked, lock_flag]
exclusions:
- never use in sleepable code paths that need to block while holding it; use ksync::Mutex or ksync::RwLock
  for critical sections that sleep
- SpinNoPreempt leaves IRQs enabled and SpinRaw does neither; they are not substitutes when an IRQ handler
  touches the same data (see spin_lock_nopreempt, spin_lock_raw)
- 'reader-writer variant is a separate card: spin_rwlock_noirq'
- NoPreempt guard behavior depends on the preempt feature and host/kernel cfg. IRQ masking does not exclude
  NMI; do not use as a blanket NMI-safe lock or replace a lock-free NMI protocol.
counter_examples: []
notes: >-
  Behaviour of the preempt guard needs the `preempt` feature (otherwise NoPreempt::acquire is a
  no-op); on non-kernel (host) builds all guards alias NoOp. The generic SpinLock<G, T> also allows
  SpinLock<IrqSave, T> (IRQs only), which has no type alias.
