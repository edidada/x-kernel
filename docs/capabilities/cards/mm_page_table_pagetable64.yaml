  - path: arch/khal/Cargo.toml
    quote: page_table = { workspace = true }
  - path: mm/page_table/Cargo.toml
    quote: memaddr = { workspace = true }
  - path: mm/page_table/Cargo.toml
    quote: karch = { workspace = true }
  - path: mm/page_table/Cargo.toml
    quote: kcpu_id_map.workspace = true
  - path: mm/page_table/Cargo.toml
    quote: kiface.workspace = true
  - path: arch/kcpu/Cargo.toml
