aliases:
  en: [page table, pgtable, map_page, unmap_page, mmu map, PTE, walk page table, vm_map, paging, map_pages, set_pte, virt_to_phys walk, translate address]
  zh: [页表, 页表映射, 页表遍历, 建立映射, 取消映射, 修改页表项, 虚拟地址翻译]
identifiers: [pgd, pud, pmd, pte, PTE, PGD, "vaddr >> 12", "0x1ff", "& 0x1ff", map_page, unmap_page, huge_page, flush_tlb, tlbi, invlpg, satp, ttbr, entry.is_present]
exclusions:
  - low-level per-architecture table; for a process address space with VMAs and fault handling use memspace::MmSpace (mm_address_space_memspace), not raw PageTableMut
  - only the leaf/walk logic - frame allocation and phys-to-virt come from the PagingHandler implementation, so an implementation of that trait is required
counter_examples: []
