aliases:
  en: [device tree parser, DTB parser, FDT parser, libfdt, flattened device tree, fdt_node_offset_by_compatible, of_find_node, dtb reg parsing, memory reserve map, compatible string lookup]
  zh: [设备树解析, DTB 解析, 扁平设备树, 按 compatible 查找节点, reg 属性解析, 内存保留区]
identifiers: [fdt, dtb, FDT_MAGIC, "0xd00dfeed", fdt_header, FDT_BEGIN_NODE, FDT_PROP, FDT_END_NODE, compatible, "#address-cells", "#size-cells", reg, memreserve, fdt32_to_cpu, be32]
exclusions:
  - read-only parser; it cannot build or modify a DTB
  - for the global boot device tree handle and platform-specific decoding (PCI host, interrupts, CPU nodes) use the of crate (parse_fdt_of_helpers)
