capability: parse_fdt_rs_fdtree
title: Flattened devicetree (DTB) parser with validated structure (rs_fdtree::LinuxFdt)
family: parse.fdt
summary: >-
  no_std parser for Linux flattened device trees. LinuxFdt::new / from_ptr validate magic, size,
  reservation block, structure tokens, names and nesting before publishing any view; the tree can then
  be walked (all_nodes, find_node, find_compatible, resolve_node), memory and reserved regions read,
  and node properties / reg entries decoded with parent cell widths.
source: {kind: workspace, crate: rs_fdtree, path: drivers/platform/rs-fdtree}
symbols:
  - {fqn: rs_fdtree::LinuxFdt, kind: struct, path: drivers/platform/rs-fdtree/src/lib.rs, role: primary}
  - {fqn: rs_fdtree::FdtNode, kind: struct, path: drivers/platform/rs-fdtree/src/node.rs, role: primary}
  - {fqn: rs_fdtree::MemoryRegion, kind: struct, path: drivers/platform/rs-fdtree/src/node.rs, role: helper}
  - {fqn: rs_fdtree::FdtError, kind: enum, path: drivers/platform/rs-fdtree/src/error.rs, role: helper}
operations:
- name: validate
  symbols:
  - rs_fdtree::LinuxFdt
  effect: LinuxFdt::new(&[u8]) / unsafe from_ptr(ptr); BadMagic, BufferTooSmall, ParseError, BadPtr; no
    tree is published until the whole structure validates
  evidence:
  - path: drivers/platform/rs-fdtree/src/lib.rs
    item: rs_fdtree::LinuxFdt::new
    quote: Validates a DTB and borrows its immutable bytes.
  - path: drivers/platform/rs-fdtree/src/lib.rs
    item: rs_fdtree::LinuxFdt::new
    quote: names, and nesting beyond 63 nodes (including the root). No tree is published until the entire
      structure has passed validation.
- name: find_nodes
  symbols:
  - rs_fdtree::LinuxFdt
