  evidence:
  - path: drivers/platform/rs-fdtree/src/lib.rs
    item: rs_fdtree::LinuxFdt::find_compatible
    quote: /// Finds the first node whose `compatible` list contains the string.
- name: memory_regions
  symbols:
  - rs_fdtree::LinuxFdt
  effect: memory_regions(), reserved_memory_regions(), mem_reservations() iterators of (address, size)
  evidence:
  - path: drivers/platform/rs-fdtree/src/lib.rs
    item: rs_fdtree::LinuxFdt::memory_regions
    quote: /// Iterates `/memory` node regions as [`MemoryRegion`]s.
- name: reg_decode
  symbols:
  - rs_fdtree::FdtNode
  effect: 'reg() decodes address/size pairs using parent #address-cells and #size-cells; unsupported cell
    widths return None'
  evidence:
  - path: drivers/platform/rs-fdtree/src/node.rs
    item: rs_fdtree::node::FdtNode::reg
    quote: Returns an iterator over this node's `reg` entries, honoring the
usage_protocol:
  - step: validate once with LinuxFdt::new / from_ptr, keep the LinuxFdt (Copy), then query nodes; the blob must stay readable and immutable for the returned lifetime
    evidence:
      - {path: drivers/platform/rs-fdtree/src/lib.rs, item: rs_fdtree::LinuxFdt::from_ptr, quote: "`ptr` must point to a readable flattened devicetree blob whose header"}
contract:
  no_std:
    value: "yes (#![no_std]; crate has no dependencies)"
    evidence:
      - {path: drivers/platform/rs-fdtree/src/lib.rs, quote: "#![no_std] mod"}
      - {path: drivers/platform/rs-fdtree/Cargo.toml, quote: "[dependencies]"}
  allocation: {value: unknown, evidence: []}
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: LinuxFdt borrows the immutable DTB bytes (Copy); the data need not be 4-byte aligned
    evidence:
      - {path: drivers/platform/rs-fdtree/src/lib.rs, item: rs_fdtree::LinuxFdt, quote: "pub struct LinuxFdt<'a> {"}
      - {path: drivers/platform/rs-fdtree/src/lib.rs, item: rs_fdtree::LinuxFdt::new, quote: "Note: this function does ***not*** require that the data be 4-byte"}
  errors_bounds:
    value: "Result<_, FdtError>; from_ptr is unsafe and trusts the header-declared size; node nesting limited to 63; reg() returns None if cell widths exceed 2"
    evidence:
      - {path: drivers/platform/rs-fdtree/src/lib.rs, item: rs_fdtree::LinuxFdt::from_ptr, quote: "validation errors as [`Self::new`]. Actual readable storage shorter than"}
  concurrency: {value: unknown, evidence: []}
