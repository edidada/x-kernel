aliases:
  en: [global allocator, kmalloc, kernel heap, alloc_pages, get_free_pages, __get_free_pages, free_pages, page allocator, dma32 allocation, GFP_DMA32, gfp, heap init]
  zh: [全局分配器, 内核堆, 页分配, 申请物理页, DMA 页分配, 内存初始化, 分配页面]
identifiers: [alloc_pages, dealloc_pages, free_pages, align_pow2, num_pages, UsageKind, heap, balloc, palloc, GlobalAlloc]
exclusions:
- raw alloc_pages / dealloc_pages are an unchecked ownership protocol; prefer the RAII GlobalPage (mm_page_owner_global_page_kalloc)
  or the reference-counted PageRef (mm_page_hold_pageref_kalloc) when a page needs an owner
- for a fallible Box allocation use kalloc_types::KBox (mm_fallible_box_kalloc_types), not Box::new
- 'DMA with a bus-address contract belongs to kdma: mm_dma_coherent_kdma and mm_dma_streaming_kdma.'
counter_examples: []
notes: >-
  Internal pieces not exported: slab_cache.rs (per-CPU intrusive object cache in front of the slab
  byte allocator, active only with the slab feature) and pcp.rs (per-CPU page set for 1-4 page
  requests). They are private modules and not separate capabilities.
