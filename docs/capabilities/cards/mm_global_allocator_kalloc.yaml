operations:
  - name: heap_alloc
    symbols: [kalloc::GlobalAllocator::alloc]
    effect: sub-threshold requests use the byte allocator; requests over LARGE_ALLOC_THRESHOLD_BYTES go directly to the page allocator
    evidence:
      - {path: mm/kalloc/src/lib.rs, item: kalloc::GlobalAllocator::alloc, quote: "Large allocations (over `LARGE_ALLOC_THRESHOLD_BYTES`) bypass the byte allocator"}
  - name: alloc_pages
    symbols: [kalloc::GlobalAllocator::alloc_pages, kalloc::GlobalAllocator::dealloc_pages]
    effect: contiguous 4 KiB pages with power-of-two alignment and a UsageKind; 1-4 page requests use a per-CPU page cache
    evidence:
      - {path: mm/kalloc/src/lib.rs, item: kalloc::GlobalAllocator::alloc_pages, quote: "1–4 page allocations with standard alignment are served from the"}
  - name: alloc_dma_pages
    symbols: [kalloc::GlobalAllocator::alloc_dma_pages, kalloc::GlobalAllocator::dealloc_dma_pages]
    effect: contiguous pages whose physical addresses are below 4 GiB
    evidence:
      - {path: mm/kalloc/src/lib.rs, item: kalloc::GlobalAllocator::alloc_dma_pages, quote: "DMA allocations must come from physical memory below 4 GiB."}
  - name: register_memory
    symbols: [kalloc::global_init, kalloc::global_add_memory]
    effect: give the allocator memory regions (first call bootstraps, later calls extend)
    evidence:
      - {path: mm/kalloc/src/lib.rs, item: kalloc::global_init, quote: "The first call bootstraps the allocator, and later calls extend it."}
usage_protocol:
  - step: platform boot calls global_init / global_add_memory with a mapped, exclusive region
    evidence: [{path: mm/kalloc/src/lib.rs, item: kalloc::global_init, quote: "Users should ensure that the region"}]
  - step: use alloc::boxed::Box / Vec for heap objects; call global_allocator().alloc_pages for raw page runs and release with the same base, count and UsageKind
    evidence: [{path: mm/kalloc/src/lib.rs, item: kalloc::GlobalAllocator::dealloc_pages, quote: "pub fn dealloc_pages(&self, va: usize, num_pages: usize, kind: UsageKind) {"}]
contract:
  no_std:
    value: 'yes'
    evidence:
    - path: mm/kalloc/src/lib.rs
      quote: '#![no_std]'
  allocation:
    value: workspace policy requires one byte allocator feature; code rejects no selection and chooses
      slab before buddy before tlsf if several are enabled. This is the global allocator, not an IRQ/reentrancy
      guarantee.
    evidence:
    - path: mm/kalloc/src/lib.rs
      quote: "{ if #[cfg(feature = \"slab\")] { /// The"
  blocking:
    value: unknown
    evidence: []
  irq_nmi:
    value: unknown
    evidence: []
  ownership_lifetime:
    value: dealloc_pages requires base, page count and category to match a live raw allocation with all
      use ended; ownership is not verified
    evidence:
    - path: mm/kalloc/src/lib.rs
      item: kalloc::GlobalAllocator::dealloc_pages
      quote: The base, page count and category must match a live raw allocation from
  errors_bounds:
    value: alloc / alloc_pages return AllocResult (AllocError); init panics when the page allocator or
      heap cannot be initialised; the GlobalAlloc::alloc path calls handle_alloc_error on OOM
    evidence:
    - path: mm/kalloc/src/lib.rs
      item: kalloc::GlobalAllocator::init
      quote: .expect("failed to initialize page allocator");
    - path: mm/kalloc/src/lib.rs
      item: kalloc::GlobalAllocator::alloc
      quote: alloc::alloc::handle_alloc_error(layout)
  concurrency:
    value: byte and page allocators each sit behind a SpinNoIrq; per-CPU caches are accessed with NoPreemptIrqSave
    evidence:
    - path: mm/kalloc/src/lib.rs
      item: kalloc::GlobalAllocator
      quote: 'balloc: SpinNoIrq<DefaultByteAllocator>,'
    - path: mm/kalloc/src/lib.rs
      item: kalloc::GlobalAllocator
      quote: 'palloc: SpinNoIrq<BuddyPageAllocator<{ PAGE_SIZE_4K }>>,'
    - path: mm/kalloc/src/lib.rs
      item: kalloc::AllocLocalOwner::acquire
      quote: 'guard: NoPreemptIrqSave::new(),'
