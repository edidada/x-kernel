capability: mm_global_allocator_kalloc
title: Kernel global allocator with raw page and DMA-page allocation (kalloc GlobalAllocator)
family: mm.allocator
summary: >-
  The kernel's #[global_allocator]: a two-level allocator with a byte allocator (slab, buddy or
  TLSF, chosen by cargo feature) for small requests over a buddy page allocator. Besides Rust heap
  allocation it exposes raw contiguous-page allocation with alignment, DMA32-restricted page
  allocation, per-UsageKind accounting and memory region registration.
source: {kind: workspace, crate: kalloc, path: mm/kalloc}
symbols:
  - {fqn: kalloc::GlobalAllocator, kind: struct, path: mm/kalloc/src/lib.rs, role: primary}
  - {fqn: kalloc::global_allocator, kind: fn, path: mm/kalloc/src/lib.rs, role: constructor}
  - {fqn: kalloc::GlobalAllocator::alloc_pages, kind: fn, path: mm/kalloc/src/lib.rs, role: operation}
  - {fqn: kalloc::GlobalAllocator::alloc_dma_pages, kind: fn, path: mm/kalloc/src/lib.rs, role: operation}
  - {fqn: kalloc::GlobalAllocator::dealloc_pages, kind: fn, path: mm/kalloc/src/lib.rs, role: operation}
  - {fqn: kalloc::GlobalAllocator::dealloc_dma_pages, kind: fn, path: mm/kalloc/src/lib.rs, role: operation}
  - {fqn: kalloc::GlobalAllocator::alloc, kind: fn, path: mm/kalloc/src/lib.rs, role: operation}
