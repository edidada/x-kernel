aliases:
  en: [cpumask, cpumask_t, cpu_set_t, CPU_SET, cpu affinity mask, set of CPUs, bitmap of CPUs, online mask, cpu_online_mask, cpumask_set_cpu, target CPU set, u64 bitmask of CPUs]
  zh: [CPU 掩码, CPU 位图, CPU 集合, 亲和性掩码, 目标 CPU 集合]
identifiers: [cpumask, cpumask_t, cpu_set_t, CPU_SET, CPU_ISSET, affinity, cpu_mask, target_mask, online_mask, "1 << cpu", u64, AtomicU64, bitmap]
exclusions:
  - "plain value type (no atomics in its API): concurrent updates (e.g. an online mask touched from several CPUs) need an external atomic or lock"
  - "SIZE is a const generic bounded by 1024; kernel code should use the NR_CPUS-sized alias kcpu_id_map::KCpuMask with LogicalCpuId helpers instead of raw usize indices (cpu_id_map_kcpu_id_map)"
  - "hand-rolled `1 << cpu` masks in u64/usize cannot represent more than 64 CPUs; use this type when NR_CPUS can exceed 64"
counter_examples: []
notes: 'KCpuMaskExt provides typed ids but does not validate their range: LogicalCpuId::new accepts any
  usize and get_logical/set_logical delegate to get/set. Callers must enforce cpu_id < NR_CPUS. This value
  type does not track CPU online state.'
