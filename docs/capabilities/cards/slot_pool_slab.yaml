aliases:
  en: [slab, slot map, handle table, id table, object pool, arena with keys, fd table, index allocator with storage, free list of slots]
  zh: [槽位池, 句柄表, 对象池, 带编号的存储, 空闲槽复用, 编号分配器附带存储]
identifiers: [Slab, insert, vacant_entry, try_remove, slab, free_list, next_free, handle, HandleTable]
exclusions:
  - "keys are not generation-checked: a stale key can name a different value after reuse; do not use it where use-after-free handles must be detected"
  - "the key is chosen by the slab; for caller-chosen sparse integer keys use sparse_index_xarray"
  - "unrelated to the kernel slab object allocator (mm.slab); this crate is a keyed container, not a memory allocator"
  - "the kalloc / alloc-engine feature named slab selects the in-tree slab allocator engine, not this crate"
counter_examples:
- path: util/kxarray/src/lib.rs
  item: kxarray::XArray
  why: XArray is also an owning usize-indexed store, but keys are chosen by the caller and readers are
    RCU-safe; Slab chooses the key and is single-writer (&mut self)
  evidence:
  - path: util/kxarray/src/lib.rs
    item: kxarray::XArray::new
    quote: Creates an empty index without allocation or RCU service readiness.
  - path: util/kxarray/src/lib.rs
    quote: owns each inserted object
  - path: util/kxarray/src/lib.rs
    item: kxarray::XArray::read
    quote: pub fn read<
