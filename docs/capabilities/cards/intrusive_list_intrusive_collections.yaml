capability: intrusive_list_intrusive_collections
title: Intrusive doubly-linked list with caller-owned nodes (intrusive_collections::LinkedList)
family: container.list
summary: >-
  LinkedList<A> links objects through an embedded Link / AtomicLink field and never allocates for list
  nodes; an Adapter (usually generated with intrusive_adapter!) says how to reach the link and which
  pointer type (Box, Arc, UnsafeRef, ...) owns the element. O(1) push/pop at both ends and O(1) removal
  through a cursor. AtomicLink makes the link shareable between threads. Used for work queues, wait lists,
  RCU callback queues and allocator free lists.
source: {kind: dependency, crate: intrusive-collections, version: 0.10.2}
