operations:
  - name: push_back
    symbols: [intrusive_collections::LinkedList::push_back, intrusive_collections::LinkedList::push_front]
    effect: link an owned pointer into the list at an end; no allocation
    evidence: [{path: intrusive-collections-0.10.2/src/linked_list.rs, item: intrusive_collections::linked_list::LinkedList::push_front, quote: "Inserts a new element at the start of the `LinkedList`."}]
  - name: pop
    symbols: [intrusive_collections::LinkedList::pop_front, intrusive_collections::LinkedList::pop_back]
    effect: unlink and return the owned pointer of an end element
    evidence: [{path: intrusive-collections-0.10.2/src/linked_list.rs, item: intrusive_collections::linked_list::LinkedList::pop_front, quote: "pub fn pop_front(&mut self) -> Option<<A::PointerOps as PointerOps>::Pointer> {"}]
  - name: cursor_remove
    symbols: [intrusive_collections::LinkedList::cursor_mut]
    effect: positioned insert_before / insert_after / remove through a CursorMut
    evidence: [{path: intrusive-collections-0.10.2/src/linked_list.rs, item: intrusive_collections::linked_list::CursorMut::insert_after, quote: "pub fn insert_after(&mut self, val: <A::PointerOps as PointerOps>::Pointer) {"}]
usage_protocol:
  - step: embed a LinkedListLink (or LinkedListAtomicLink for cross-thread use) in the element, declare an adapter with intrusive_adapter!, then LinkedList::new(Adapter::NEW or new())
    evidence: [{path: intrusive-collections-0.10.2/src/lib.rs, quote: "intrusive collections never allocate memory themselves and"}]
contract:
  no_std:
    value: "yes (#![no_std])"
    evidence: [{path: intrusive-collections-0.10.2/src/lib.rs, quote: "#![no_std]"}]
  allocation:
    value: the list itself never allocates for nodes (links live in the elements)
    evidence: [{path: intrusive-collections-0.10.2/src/lib.rs, quote: "intrusive collections never allocate memory themselves"}]
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: ownership follows the Adapter pointer type; dropping the list converts all linked elements back to owned pointers and drops them; UnsafeRef leaves freeing to the user
    evidence:
      - {path: intrusive-collections-0.10.2/src/linked_list.rs, item: intrusive_collections::linked_list::LinkedList, quote: "converted back to owned pointers and dropped."}
      - {path: intrusive-collections-0.10.2/src/unsafe_ref.rs, item: intrusive_collections::unsafe_ref::UnsafeRef, quote: "the user is responsible for freeing the managed object"}
  errors_bounds:
    value: unknown
    evidence: []
  concurrency:
    value: no internal locking; the Link type is not thread-shareable but AtomicLink is "shared between threads" - callers still need external synchronisation for list mutation
    evidence:
      - {path: intrusive-collections-0.10.2/src/linked_list.rs, item: intrusive_collections::linked_list::AtomicLink, quote: "This link allows the structure to be shared between threads."}
