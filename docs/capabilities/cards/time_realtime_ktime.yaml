aliases:
  en: [wall clock, gettimeofday, clock_gettime REALTIME, current_time, now(), boot time, uptime including sleep, settimeofday, clock_settime, timekeeping, CLOCK_BOOTTIME, deadline conversion, file timestamp now]
  zh: [系统时间, 墙上时钟, 当前时间, 开机时间, 设置系统时间, 时间校正, 截止时间换算, 文件时间戳]
identifiers: [gettimeofday, clock_gettime, settimeofday, CLOCK_REALTIME, CLOCK_BOOTTIME, wall_time, current_time, now, UNIX_EPOCH, "realtime_base", timekeeper, xtime, "unix_seconds"]
exclusions:
  - realtime() reflects explicit updates and injected sleep; do not use it for intervals (use the monotonic clock, time_clock_khal)
  - set_realtime_checked only validates range; the caller must do the privilege check
