capability: parse_binary_bytemuck
title: Plain-old-data casts between bytes and structs (bytemuck Pod / AnyBitPattern)
family: parse.binary
summary: >-
  bytemuck's marker traits (Zeroable, Pod, AnyBitPattern, NoUninit; derivable) allow safe reinterpretation
  of plain-data values: bytes_of(&T) -> &[u8], try_from_bytes / from_bytes (&[u8] -> &T), cast,
  cast_slice and pod_read_unaligned (copying read that tolerates misalignment). The kernel uses it
  for POSIX ABI structs, termios / vt structs, DRM structures and for "is this value all zero"
  checks on user data.
source: {kind: dependency, crate: bytemuck, version: 1.25.2}
symbols:
  - {fqn: bytemuck::Pod, kind: trait, path: src/pod.rs, role: primary}
  - {fqn: bytemuck::Zeroable, kind: trait, path: src/zeroable.rs, role: primary}
  - {fqn: bytemuck::AnyBitPattern, kind: trait, path: src/anybitpattern.rs, role: primary}
  - {fqn: bytemuck::NoUninit, kind: trait, path: src/no_uninit.rs, role: helper}
  - {fqn: bytemuck::bytes_of, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: bytemuck::from_bytes, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: bytemuck::try_from_bytes, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: bytemuck::pod_read_unaligned, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: bytemuck::cast_slice, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: bytemuck::PodCastError, kind: enum, path: src/lib.rs, role: helper}
operations:
  - name: as_bytes
    symbols: [bytemuck::bytes_of]
    effect: view a NoUninit value as its bytes
    evidence: [{path: bytemuck-1.25.2/src/lib.rs, item: bytemuck::bytes_of, quote: "pub fn bytes_of<T: NoUninit>(t: &T) -> &[u8] {"}]
  - name: try_view
    symbols: [bytemuck::try_from_bytes, bytemuck::PodCastError]
    effect: borrow a byte slice as &T; fails when misaligned or the length is not exactly size_of::<T>()
    evidence:
      - {path: bytemuck-1.25.2/src/lib.rs, item: bytemuck::try_from_bytes, quote: "If the slice's length isn’t exactly the size of the new type"}
  - name: view_or_panic
    symbols: [bytemuck::from_bytes]
    effect: like try_from_bytes but panics on error
    evidence: [{path: bytemuck-1.25.2/src/lib.rs, item: bytemuck::from_bytes, quote: "This is like [`try_from_bytes`] but will panic on error."}]
  - name: read_unaligned
    symbols: [bytemuck::pod_read_unaligned]
    effect: copy a T out of a byte slice without requiring alignment
    evidence: [{path: bytemuck-1.25.2/src/lib.rs, item: bytemuck::pod_read_unaligned, quote: "pub fn pod_read_unaligned<T: AnyBitPattern>(bytes: &[u8]) -> T {"}]
usage_protocol:
- step: For byte exposure derive NoUninit/Pod only on representations without uninitialized padding; for
    input decoding AnyBitPattern permits all bit patterns and may allow padding. Choose try_ casts for
    untrusted sizes/alignment; pod_read_unaligned copies and still requires the exact size.
  evidence:
  - path: bytemuck-1.25.2/src/pod.rs
    item: bytemuck::pod::Pod
    quote: padding in the middle, and also no `#[repr(C)] struct Foo(u16, u8)`, which
  - path: bytemuck-1.25.2/src/anybitpattern.rs
    item: bytemuck::anybitpattern::AnyBitPattern
    quote: "padding)"
contract:
  no_std:
    value: "yes: #![no_std]"
    evidence:
      - {path: bytemuck-1.25.2/src/lib.rs, quote: "#![no_std]"}
  allocation: {value: unknown, evidence: []}
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: view functions return borrows of the input; pod_read_unaligned copies
    evidence:
      - {path: bytemuck-1.25.2/src/lib.rs, item: bytemuck::try_from_bytes, quote: "pub fn try_from_bytes<T: AnyBitPattern>(s: &[u8]) -> Result<&T, PodCastError> {"}
  errors_bounds:
    value: try_from_bytes returns PodCastError on misalignment or wrong length; from_bytes and cast panic instead
    evidence:
      - {path: bytemuck-1.25.2/src/lib.rs, item: bytemuck::try_from_bytes, quote: "If the slice's length isn’t exactly the size of the new type"}
      - {path: bytemuck-1.25.2/src/lib.rs, item: bytemuck::from_bytes, quote: "This is like [`try_from_bytes`] but will panic on error."}
  concurrency: {value: unknown, evidence: []}
