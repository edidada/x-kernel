capability: rcu_list_krcu_list
title: Append-only forward RCU list with deferred removal (krcu_list::RcuList)
family: sync.rcu
summary: >-
  Singly linked list whose readers iterate under a krcu ReadScope without taking the writer lock.
  Writers append (push_back, serialized by a SpinNoPreempt writer lock) or remove the first
  matching entry (remove_first), which unlinks it and schedules destruction after a grace period.
  Iteration is not a snapshot.
