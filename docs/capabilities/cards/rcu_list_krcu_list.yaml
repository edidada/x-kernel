contract:
  no_std:
    value: yes (#![no_std], uses alloc)
    evidence:
    - path: util/krcu-list/src/lib.rs
      quote: '#![no_std]'
  allocation:
    value: Entry::new allocates once (Box); push_back, iter and RcuList::new do not allocate
    evidence:
    - path: util/krcu-list/src/lib.rs
      item: krcu_list::Entry
      quote: A uniquely owned, unpublished entry. Preparation allocates once.
    - path: util/krcu-list/src/lib.rs
      item: krcu_list::RcuList::new
      quote: Creates an empty list without allocation or a running RCU service.
  blocking:
    value: readers never acquire the writer lock; writers serialize under SpinNoPreempt. remove_first
      requires sleepable watched task context outside read scopes, but preflight is an admission check,
      not a grace-period wait. Callback destruction must not block.
    evidence:
    - path: util/krcu-list/src/lib.rs
      item: krcu_list::RcuList::remove_first
      quote: Sleepable watched task context outside read scopes and atomic exclusion
  irq_nmi:
    value: mutation (push_back, remove_first) only from task context, never IRQ/softirq/NMI; readers may
      use task scopes or watched interrupt/NMI scopes
    evidence:
    - path: util/krcu-list/src/lib.rs
      quote: Mutation originates in task context. Readers may use task scopes or already
    - path: util/krcu-list/src/lib.rs
      item: krcu_list::RcuList::push_back
      quote: Call from task context, never IRQ, softirq or NMI.
  ownership_lifetime:
    value: each published entry owns one allocation; removed entries are owned by their RCU callback;
      dropping the list frees still-linked entries in the dropping context
    evidence:
    - path: util/krcu-list/src/lib.rs
      item: krcu_list::RcuList
      quote: Each published entry owns one allocation.
    - path: util/krcu-list/src/lib.rs
      quote: List destruction releases still-linked entries in the dropping context;
  errors_bounds:
