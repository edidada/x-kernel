exclusions:
- append and remove-first only; no insertion at arbitrary positions, no removal by handle, no bidirectional
  iteration
- removed payload (T) release chain must be nonblocking and valid in RCU callback (softirq) context; T
  must be Send + Sync + 'static
- mutation is task-context only; not for lists updated from IRQ handlers
- for a plain index-keyed lock-free-read map use sparse_index_xarray; for a general intrusive list see
  intrusive_list_* cards
- 'remove_first predicate runs under writer exclusion: it must not block, allocate or reenter writers.
  Post-withdrawal submission rejection is a fatal invariant failure, not a recoverable KResult error.'
