capability: mm_iomap_device_memspace
title: Map a device MMIO physical range into kernel virtual space with reference counting (memspace::iomap_device / iounmap)
family: mm.page_table
summary: >-
  iomap_device(paddr, size, name) maps the 4K-aligned span of a device region in the dedicated I/O
  virtual window and returns the virtual address of paddr; repeated calls reuse and refcount the
  mapping; iounmap releases it. Also keeps a registry of device regions for diagnostics.
