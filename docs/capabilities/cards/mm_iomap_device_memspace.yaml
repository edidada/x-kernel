exclusions:
- the returned address lives in the dedicated I/O window; use p2v only for RAM, which is in the linear
  map
- map once and cache the base (the doc says drivers call it during initialization); do not call per access
- Manual iomap_device/iounmap pairing is not device-managed automatic teardown (devm_ioremap). The owner
  must release each reference after all device/CPU uses end.
