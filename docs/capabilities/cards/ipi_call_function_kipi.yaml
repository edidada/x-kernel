capability: ipi_call_function_kipi
title: Run a closure on another CPU via IPI (kipi::run_on_cpu / run_on_each_cpu, smp_call_function)
family: cpu.ipi
summary: >-
  Cross-CPU function call. Each CPU owns an IPI event queue (a SpinNoIrq VecDeque stored in a per-CPU
  slot); run_on_cpu(dest, closure) runs the closure synchronously when dest is the current CPU,
  otherwise pushes it to the destination queue and raises the shared IPI, so it later runs from that
  CPU's IPI handler. run_on_each_cpu runs locally at once and queues for all others;
  run_on_each_cpu_via_ipi makes every CPU, including the caller, run it from IPI context. The call
  is asynchronous: there is no wait-for-completion.
