exclusions:
- No completion barrier is supplied. Use a separately audited completion protocol from sleepable context
  if needed; never wait while holding resources required by target callbacks. Translation flushes use
  kipi::tlb.
- 'callbacks run in IPI interrupt context on remote CPUs: no sleeping, no taking IPI queue locks; sending
  is forbidden from NMI'
- requires kipi::init() on the target CPU (TargetCpuNotReady otherwise); the smp feature compiles the
  SMP-only parts
- for allocation-free fixed requests (reschedule, BH kick, RCU kick) use the pending-flag transport (ipi_fixed_notification_kipi)
  instead of queueing a closure
counter_examples: []
notes: >-
  kipi also hosts the TLB shootdown protocol (kipi::tlb) and the CPU stop protocol (kipi::stop);
  neither is carded here.
