capability: blocking_rwlock
title: Sleeping reader-writer lock with optimistic spinning (ksync::RwLock)
family: sync.rwlock
summary: >-
  lock_api RwLock over an atomic state word (high bit write-locked, low 31 bits reader count) with
  separate reader and writer event-listeners. Contended acquires spin, then sleep via
  ktask::future::block_on. The recorded writer is tracked for spinners; readers are not recorded.
source: {kind: workspace, crate: ksync, path: task/ksync}
symbols:
  - {fqn: ksync::RwLock, kind: struct, path: task/ksync/src/rwlock.rs, role: primary}
  - {fqn: ksync::RwLock::new, kind: fn, path: task/ksync/src/rwlock.rs, role: constructor}
  - {fqn: ksync::RawRwLock, kind: struct, path: task/ksync/src/rwlock.rs, role: helper}
  - {fqn: ksync::RwLockReadGuard, kind: type, path: task/ksync/src/rwlock.rs, role: helper}
  - {fqn: ksync::RwLockWriteGuard, kind: type, path: task/ksync/src/rwlock.rs, role: helper}
operations:
  - name: read
    symbols: [ksync::RwLock]
    effect: shared acquire; registers a reader listener, rechecks the write bit, then blocks
    evidence: [{path: task/ksync/src/rwlock.rs, item: ksync::rwlock::RawRwLock::lock_shared, quote: "listener!(self.reader_event => listener);"}]
  - name: write
    symbols: [ksync::RwLock]
    effect: exclusive acquire; registers a writer listener then blocks
    evidence: [{path: task/ksync/src/rwlock.rs, item: ksync::rwlock::RawRwLock::lock_exclusive, quote: "listener!(self.writer_event => listener);"}]
usage_protocol:
- step: Use the public wrapper and .lock() or .read()/.write() only in sleepable task context. For static
    initialization use ksync::static_lock! when stats is enabled; new() is const only without stats.
  evidence:
  - path: task/ksync/src/lib.rs
    quote: 'static CONFIG: RwLock<u32> = RwLock::new(0);'
  - path: task/ksync/src/rwlock.rs
    item: ksync::rwlock::RwLock::new
    quote: '#[cfg(feature = "stats")]'
  - path: task/ksync/src/lib.rs
    quote: pub use klockstat::{LOCK_CLASSES, LockClassStats, linkme, static_lock};
contract:
  no_std:
    value: "yes (cfg_attr: no_std unless test)"
    evidence: [{path: task/ksync/src/lib.rs, quote: "#![cfg_attr(not(test), no_std)]"}]
  allocation:
    value: unknown
    evidence: []
  blocking:
    value: sleeps (event-listener + ktask block_on) after bounded spinning; acquiring while this task is the recorded writer panics
    evidence:
      - {path: task/ksync/src/rwlock.rs, item: ksync::rwlock::RawRwLock, quote: "`lock_exclusive` and `lock_shared` panic when this task is the recorded"}
      - {path: task/ksync/src/rwlock.rs, item: ksync::rwlock::RawRwLock, quote: "A contended acquire spins before sleeping"}
  irq_nmi:
    value: unknown
    evidence: []
  ownership_lifetime:
    value: lock owns the value through lock_api guards; guard marker is GuardSend
    evidence: [{path: task/ksync/src/rwlock.rs, item: ksync::rwlock::RawRwLock::GuardMarker, quote: "type GuardMarker = lock_api::GuardSend;"}]
  errors_bounds:
    value: panics when the reader count would reach MAX_READERS (2^31 - 1)
    evidence: [{path: task/ksync/src/rwlock.rs, item: ksync::rwlock::RawRwLock::lock_shared, quote: "panic!(\"too many readers\");"}]
  concurrency:
    value: waiting does not reserve the lock; no starvation-freedom promise
    evidence: [{path: task/ksync/src/rwlock.rs, item: ksync::rwlock::RawRwLock, quote: "Waiting does not reserve the lock"}]
