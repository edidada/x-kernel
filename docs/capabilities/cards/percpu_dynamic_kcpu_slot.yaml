capability: percpu_dynamic_kcpu_slot
title: Dynamically initialized per-CPU objects from caller-owned memory (kcpu_slot::CpuSlotChunk / DynamicCpuSlot)
family: cpu.percpu
summary: >-
  Per-CPU storage for values that cannot be bitwise template-copied (owning, droppable or
  self-referential types). A CpuSlotChunk is carved from caller-owned backing memory
  (cpu_count * area_stride bytes); alloc runs an initializer once per CPU with that CPU's id and
  returns a DynamicCpuSlot handle. get(guard) reads the current CPU's value under a CpuLocalGuard;
  get_remote needs T: Sync. Dropping the handle drops every CPU's value.
source: {kind: workspace, crate: kcpu_slot, path: arch/kcpu_slot}
symbols:
  - {fqn: kcpu_slot::CpuSlotChunk, kind: struct, path: arch/kcpu_slot/src/dynamic.rs, role: primary}
  - {fqn: kcpu_slot::CpuSlotChunk::from_raw_parts, kind: fn, path: arch/kcpu_slot/src/dynamic.rs, role: constructor}
  - {fqn: kcpu_slot::CpuSlotChunk::alloc, kind: fn, path: arch/kcpu_slot/src/dynamic.rs, role: operation}
  - {fqn: kcpu_slot::DynamicCpuSlot, kind: struct, path: arch/kcpu_slot/src/dynamic.rs, role: primary}
  - {fqn: kcpu_slot::DynamicCpuSlot::get, kind: fn, path: arch/kcpu_slot/src/dynamic.rs, role: operation}
  - {fqn: kcpu_slot::DynamicCpuSlot::get_remote, kind: fn, path: arch/kcpu_slot/src/dynamic.rs, role: operation}
  - {fqn: kcpu_slot::SlotInitError, kind: enum, path: arch/kcpu_slot/src/dynamic.rs, role: helper}
operations:
  - name: alloc
    symbols: [kcpu_slot::CpuSlotChunk::alloc]
    effect: reserves one slot per CPU in the chunk and runs init(cpu_id) for every CPU; on a failed initializer the values already created are dropped but the reservation is not reclaimed
    evidence:
      - {path: arch/kcpu_slot/src/dynamic.rs, item: kcpu_slot::dynamic::CpuSlotChunk::alloc, quote: "The initializer runs once per CPU. If it fails, values already created"}
  - name: get
    symbols: [kcpu_slot::DynamicCpuSlot::get, kcpu_slot::DynamicCpuSlot::get_remote]
    effect: shared access to the pinned CPU's value under a CpuLocalGuard, or to a remote CPU's value when T is Sync; None for a CPU outside the chunk
    evidence:
      - {path: arch/kcpu_slot/src/dynamic.rs, item: kcpu_slot::dynamic::DynamicCpuSlot::get, quote: "Returns `None` when the guard reports a CPU outside the chunk."}
      - {path: arch/kcpu_slot/src/dynamic.rs, item: kcpu_slot::dynamic::DynamicCpuSlot::get_remote, quote: "Reads a remote CPU's value when sharing `T` is safe."}
