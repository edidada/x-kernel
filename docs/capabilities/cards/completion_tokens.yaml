aliases:
  en: [completion, complete, wait_for_completion, init_completion, complete_all, reinit_completion, done flag handshake, oneshot signal]
  zh: [完成量, 完成通知, 等待完成, 一次性信号]
identifiers: [done, complete, wait_for_completion, COMPLETE_ALL, waiters, park, woke]
exclusions:
  - "predicate-style waits that carry no tokens belong to task_predicate_wait_queue_noalloc (kcompletion::WaitQueue)"
  - "no timeout or signal interruption in wait; use ktask::WaitQueue::wait_timeout or ktask::future::timeout for those"
  - "ksync::Semaphore is the blocking counting alternative when permits must be returned"
counter_examples: []
notes: >-
  The general SyncWake trait is unsafe to implement (IRQ-safe, nonblocking, allocation-free, no
  unwinding). Task-bound waiting is in task/ktask/src/completion.rs; krcu uses it for synchronize_rcu.
