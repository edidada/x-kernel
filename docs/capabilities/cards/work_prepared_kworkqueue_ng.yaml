operations:
  - name: with_callback
    symbols: [kworkqueue_ng::Work]
    effect: Work::with_callback binds one callback and captures without allocating, publishing an address or invoking the callback; storage must be stable (pinned) before admission
    evidence:
      - {path: task/kworkng/crates/kworkqueue_ng/src/work.rs, item: kworkqueue_ng::work::Work::with_callback, quote: "Construction does not allocate, publish an address or invoke the callback."}
  - name: cancel_sync
    symbols: [kworkqueue_ng::DelayedWork::cancel_sync]
    effect: synchronous cancel and drain required before freeing borrowed storage
    evidence:
      - {path: task/kworkng/crates/kworkqueue_ng/src/lib.rs, item: kworkqueue_ng::Work, quote: "object, not its owner: stop and join producers, then successfully cancel_sync"}
usage_protocol:
  - step: "pin the Work, publish with an unsafe queue_work on a DefaultQueue (producer holds the safety obligation), later cancel_sync in sleepable context before the storage or captures are released"
    evidence:
      - {path: task/kworkng/src/lib.rs, quote: "Use this lower-level path only when the owner can guarantee pinning, retained"}
      - {path: task/kworkng/src/defaults.rs, item: kworkng::defaults::DefaultQueue::queue_work, quote: "/// # Safety"}
