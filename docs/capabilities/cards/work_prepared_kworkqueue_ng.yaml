capability: work_prepared_kworkqueue_ng
title: Borrowed prepared Work and bottom-half (non-sleeping) work queues (kworkqueue_ng::Work / kworkng::DefaultQueue)
family: task.work
summary: Lower-level, unsafe-publication layer under the owned handles. A caller-owned, pinned kworkqueue_ng::Work
  is built inline without preparation allocation; DelayedWork additionally prepares an allocated timer
  and submitted to DefaultQueue::Normal (sleepable worker), BottomHalf or HighBottomHalf (non-sleeping
  softirq callbacks). The caller must keep storage and captures alive, stop producers and cancel_sync
  before freeing. Use it for BH callbacks or intrusive/embedded work; otherwise prefer WorkHandle.
