  - path: core/ksyscall/src/task/rusage.rs
    item: ksyscall::task::rusage::self_rusage
    quote: let (utime, stime) = process.process_cpu_times();
  - path: process/kprocess/Cargo.toml
    quote: ktime_types.workspace = true
  - path: process/kprocess/Cargo.toml
    quote: khal.workspace = true
  - path: process/kprocess/Cargo.toml
    quote: ktask.workspace = true
  - path: process/kprocess/Cargo.toml
    quote: ksync.workspace = true
  - path: core/ksyscall/Cargo.toml
    quote: kprocess.workspace = true
aliases:
  en: [utime, stime, cputime, process CPU time, thread CPU time, rusage, times(), CLOCK_PROCESS_CPUTIME_ID, task_cputime, thread_group_cputime, user time system time, children times]
  zh: [进程 CPU 时间, 线程 CPU 时间, 用户态时间, 内核态时间, 子进程时间, 资源使用统计]
identifiers: [utime, stime, cutime, cstime, cputime, rusage, getrusage, times, tms, CLOCK_PROCESS_CPUTIME_ID, CLOCK_THREAD_CPUTIME_ID, task_cputime, sample_cpu_time, process_cpu_times]
exclusions:
  - the value is sampled, not a snapshot atomic across threads; for strict POSIX clock semantics see the syscall layer
  - requires a kprocess Process / Thread; kernel tasks without a user process have no such accounting
  - a loop summing per-thread utime/stime inline duplicates process_cpu_times; reuse it so exited-thread and settled-interval handling stay consistent
counter_examples: []
