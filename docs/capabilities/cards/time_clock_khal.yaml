  zh: [单调时间, 开机时长, 读取计数器, 滴答数转换, 忙等待, 微秒延时, 读取当前纳秒]
identifiers: [cntvct, CNTVCT_EL0, rdtsc, rdcycle, mftb, now_ticks, get_time, current_time, uptime, "monotonic_time", udelay, ndelay, mdelay, busy_wait, delay_us, ticks_to_nanos, nanos_to_ticks, cntfrq]
exclusions:
  - monotonic_time excludes injected sleep time; for time including suspend use ktime::boottime, and for wall-clock use ktime::realtime (time_realtime_ktime)
  - busy_wait burns the CPU; for blocking waits use a timer or wait queue
