  - name: push
    symbols: [smallvec::SmallVec::push]
    effect: append; may spill to the heap
    evidence:
      - {path: smallvec-1.16.3/src/lib.rs, item: smallvec::SmallVec::push, quote: "Append an item to the vector."}
  - name: spilled
    symbols: [smallvec::SmallVec::spilled]
    effect: whether the data now lives in a heap buffer
    evidence:
      - {path: smallvec-1.16.3/src/lib.rs, item: smallvec::SmallVec::spilled, quote: "Returns `true` if the data has spilled into a separate heap-allocated"}
  - name: try_reserve
    symbols: [smallvec::SmallVec::try_reserve]
    effect: fallible growth; returns CollectionAllocErr instead of aborting
    evidence:
      - {path: smallvec-1.16.3/src/lib.rs, item: smallvec::SmallVec::try_reserve, quote: "pub fn try_reserve(&mut self, additional: usize) -> Result<(), CollectionAllocErr>"}
usage_protocol:
  - step: choose an inline capacity N with type SmallVec<[T; N]>; elements beyond N cause a heap allocation
    evidence: [{path: smallvec-1.16.3/src/lib.rs, quote: "These store a certain number of elements"}]
