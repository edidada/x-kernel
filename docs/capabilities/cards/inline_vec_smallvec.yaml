capability: inline_vec_smallvec
title: Vector with inline storage that spills to the heap (smallvec::SmallVec)
family: container.inline_vec
summary: >-
  SmallVec<[T; N]> stores up to N elements inline and moves to a heap allocation only when it grows
  past N. Useful for lists that are almost always short (poll registrations, resource descriptors,
  small handle sets) where a Vec allocation per instance is wasteful.
source: {kind: dependency, crate: smallvec, version: 1.16.3}
symbols:
