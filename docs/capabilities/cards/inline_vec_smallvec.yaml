  - {fqn: smallvec::SmallVec::new, kind: fn, path: src/lib.rs, role: constructor}
  - {fqn: smallvec::SmallVec::new_const, kind: fn, path: src/lib.rs, role: constructor}
  - {fqn: smallvec::SmallVec::push, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: smallvec::SmallVec::spilled, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: smallvec::SmallVec::try_reserve, kind: fn, path: src/lib.rs, role: operation}
  - {fqn: smallvec::smallvec, kind: macro, path: src/lib.rs, role: helper}
