  - "workspace root enables features const_generics, const_new and union; crates with their own dependency line may enable different features"
counter_examples: []
notes: >-
  new_const exists only with the const_new feature (kpoll and tipc_handle call it). The macro is
  smallvec::smallvec! (used in kdriver platform_backend).
