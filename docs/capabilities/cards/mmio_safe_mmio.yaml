capability: mmio_safe_mmio
title: Typed volatile MMIO access through unique/shared pointers (safe_mmio)
family: io.mmio
summary: >-
  safe_mmio models a device register block as a #[repr(C)] struct whose fields are wrapped in
  ReadOnly / ReadPure / WriteOnly / ReadWrite / ReadPureWrite. UniqueMmioPointer (unique, &mut-based)
  and SharedMmioPointer give volatile read/write/modify on those fields with the access kind checked at
  compile time; field! projects a pointer to a field. PhysicalInstance carries a device's physical
  base address until it is mapped. Used by the virtio transports, not by the register-bitfield drivers
  (those use tock-registers).
