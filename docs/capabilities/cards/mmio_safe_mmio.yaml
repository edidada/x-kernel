operations:
  - name: wrap_registers
    symbols: [safe_mmio::UniqueMmioPointer::new]
    effect: build a unique pointer from a raw mapped register address (unsafe; caller guarantees validity and uniqueness)
    evidence: [{path: safe-mmio-0.3.2/src/lib.rs, item: safe_mmio::UniqueMmioPointer::new, quote: "pub const unsafe fn new(regs: NonNull<T>) -> Self {"}]
  - name: read_write
    symbols: [safe_mmio::UniqueMmioPointer::read, safe_mmio::UniqueMmioPointer::write]
    effect: volatile read or write of a whole field whose wrapper type permits it
    evidence:
      - {path: safe-mmio-0.3.2/src/lib.rs, item: safe_mmio::UniqueMmioPointer::read, quote: "Performs an MMIO read of the entire `T`."}
      - {path: safe-mmio-0.3.2/src/lib.rs, item: safe_mmio::UniqueMmioPointer::write, quote: "Performs an MMIO write of the entire `T`."}
  - name: field_projection
    symbols: [safe_mmio::field]
    effect: get a pointer to one field of a register struct
    evidence: [{path: safe-mmio-0.3.2/src/lib.rs, item: safe_mmio::field, quote: "Gets a `UniqueMmioPointer` to a field of a type wrapped in a `UniqueMmioPointer`."}]
usage_protocol:
  - step: "describe the block as a #[repr(C)] struct of ReadOnly/ReadPure/WriteOnly/ReadWrite/ReadPureWrite fields, build the pointer once with the unsafe new (valid, aligned, device-mapped, no aliases), then use field!/read/write; reads take &mut self because they may have device side effects"
    evidence:
      - {path: safe-mmio-0.3.2/src/lib.rs, item: safe_mmio::UniqueMmioPointer::new, quote: "which is mapped as device memory and valid to read and write from any thread with volatile"}
      - {path: safe-mmio-0.3.2/src/lib.rs, item: safe_mmio::UniqueMmioPointer::read_unsafe, quote: "Note that this takes `&mut self` rather than `&self` because an MMIO read may cause"}
contract:
  no_std:
    value: "yes: #![no_std]; the only optional feature is custom-mmio"
    evidence:
      - {path: safe-mmio-0.3.2/src/lib.rs, quote: "#![no_std]"}
      - {path: safe-mmio-0.3.2/Cargo.toml, quote: "custom-mmio = []"}
  allocation:
    value: unknown
    evidence: []
  blocking: {value: unknown, evidence: []}
  irq_nmi: {value: unknown, evidence: []}
  ownership_lifetime:
    value: the unique pointer is guaranteed valid and unique for its lifetime; no other access to the device's MMIO space may happen while it exists
    evidence:
      - {path: safe-mmio-0.3.2/src/lib.rs, item: safe_mmio::UniqueMmioPointer, quote: "It is guaranteed to be valid and unique; no other access to the MMIO space of the device may"}
  errors_bounds:
    value: no error returns; constructing the pointer is unsafe and the caller guarantees alignment and validity
    evidence:
      - {path: safe-mmio-0.3.2/src/lib.rs, item: safe_mmio::UniqueMmioPointer::new, quote: "`regs` must be a properly aligned and valid pointer to some MMIO address space of type T,"}
  concurrency:
    value: access through UniqueMmioPointer takes &mut self; the safety contract requires that no other aliases access the same MMIO region
    evidence:
      - {path: safe-mmio-0.3.2/src/lib.rs, item: safe_mmio::UniqueMmioPointer::new, quote: "operations. There must not be any other aliases which are used to access the same MMIO"}
