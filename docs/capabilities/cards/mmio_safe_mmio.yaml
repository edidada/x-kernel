aliases:
  en: [mmio, memory-mapped io, register block, volatile read write, device registers, readl writel, ioread, iowrite, mmio pointer]
  zh: [内存映射 IO, 寄存器块, 易失读写, 设备寄存器, 寄存器访问]
identifiers: [read_volatile, write_volatile, UniqueMmioPointer, ReadWrite, WriteOnly, ReadOnly, field!, PhysicalInstance, mmio, regs]
exclusions:
- not a bitfield/register-definition framework; for typed register bitfields (register_bitfields!, LocalRegisterCopy)
  see mmio_tock_registers
- 'does not map memory: it does not translate PhysicalInstance to a virtual address; the caller must map
  the device first'
- plain core::ptr::read_volatile / write_volatile on raw addresses in other drivers is the pattern this
  replaces, but do not rewrite those drivers only for style
- Volatile MMIO access does not imply inter-CPU atomicity, hardware ordering barriers, endianness conversion,
  or NMI safety. UniqueMmioPointer and SharedMmioPointer have different alias/access contracts; the unique-pointer
  lifetime contract cannot be applied to both.
counter_examples: []
notes: >-
  Only the virtio crates use safe-mmio at the pin; pci and aarch64-pmuv3 use tock-registers 0.10 and kcpu uses tock-registers 0.9.
