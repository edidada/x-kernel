capability: deferred_arc_kfinalize
title: Arc-like shared owner whose last drop destroys the payload on a worker (kfinalize::DeferredArc)
family: sync.deferred_drop
summary: DeferredArc<T> / DeferredWeak<T> use standard Arc counting and hand final payload destruction
  to prepared normal-worker carriers. Last strong Drop does not sleep or allocate a carrier, but metadata
  deallocation and queue notification still impose caller-lock constraints. NMI strong/Weak release requires
  the kernel provider and initialized local irq_work; unsupported delivery is fatal. Construction prepares
  three allocations; shared finalization is serial and opt-in for a proven destruction-context mismatch.
