capability: timer_core_ktimer_core
title: Per-CPU one-shot hard-IRQ timer core with owned Timer and cancel_sync (ktimer_core::Timer / TimerSet)
family: task.timer
summary: Prepared per-CPU timer trees independent of the scheduler. A static TimerSet<N> holds N per-CPU
  SpinNoIrq timer trees (hardware arbitration and IRQ dispatch); Timer<H, N> owns stable node+handler
  storage allocated once, and start_on(cpu, deadline) / start_on_if_future arm a one-shot absolute monotonic
  deadline without allocating. The handler (TimerHandler, hard-IRQ context) may rearm through TimerControl.
  try_cancel is non-waiting; cancel_sync and Drop wait for in-flight delivery.
