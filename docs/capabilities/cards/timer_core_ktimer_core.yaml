operations:
  - name: start_on
    symbols: [ktimer_core::Timer::start_on, ktimer_core::Timer::start_on_if_future]
    effect: starts or replaces a one-shot absolute monotonic deadline on a chosen CPU; past deadlines are accepted and dispatched later, never inline; start_on_if_future rejects an elapsed deadline without replacing a pending one
    evidence:
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer::start_on, quote: "past deadlines are accepted for later dispatch, never invoked inline."}
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer::start_on_if_future, quote: "None means the locked clock check rejected it without changing this timer."}
  - name: cancel
    symbols: [ktimer_core::Timer::try_cancel, ktimer_core::Timer::cancel_sync]
    effect: try_cancel never waits and returns Inactive / Removed / Running; cancel_sync waits for in-flight delivery and removes a pending successor; Drop calls cancel_sync
    evidence:
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer::try_cancel, quote: "Takes the owner spinlock but never allocates, sleeps, or waits for delivery."}
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer::drop, quote: "self.cancel_sync();"}
  - name: rearm
    symbols: [ktimer_core::TimerControl::rearm]
    effect: from inside the handler install the next one-shot deadline under the owner lock; each setting is one-shot so periodic timers must rearm
    evidence:
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer::start_on, quote: "Each setting is one-shot; a callback must explicitly rearm to repeat."}
contract:
  no_std:
    value: "yes (#![no_std], uses alloc)"
    evidence: [{path: task/ktimer-core/src/lib.rs, quote: "#![no_std]"}]
  allocation:
    value: "Timer::new / new_on allocate the node+handler storage once; start, rearm and cancel do not allocate; TimerSet CPU slots never grow"
    evidence:
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer::new, quote: "This preparation may allocate; subsequent start/cancel operations do not."}
      - {path: task/ktimer-core/src/set.rs, item: ktimer_core::set::TimerSet, quote: "CPU slots never grow, reorder or allocate after construction."}
  blocking:
    value: "start / try_cancel / rearm never sleep; cancel_sync and Drop wait for in-flight delivery (must not be called from the timer's own callback or while holding a lock the callback needs); handlers must not sleep"
    evidence:
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer, quote: "Synchronous cancellation/Drop must not run in this timer's callback or while holding a"}
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer::start_on, quote: "The handler must not unwind, sleep, enable IRQs or reenter timer dispatch."}
  irq_nmi:
    value: "handlers run in hard IRQ context outside timer locks; per-CPU trees are protected by SpinNoIrq; NMI not stated"
    evidence:
      - {path: task/ktimer-core/src/index.rs, item: ktimer_core::index::TimerHandler::on_expiration, quote: "/// Handles one expiration in hard IRQ context outside timer locks."}
      - {path: task/ktimer-core/src/set.rs, item: ktimer_core::set::TimerSet, quote: "cpus: [CacheAligned<SpinNoIrq<CpuTimers>>; N],"}
  ownership_lifetime:
    value: "Timer owns node and handler in one stable allocation; the shell may move but the allocation cannot; Drop synchronously cancels before releasing; a node belongs to at most one TimerSet; static TimerSet required"
    evidence:
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer, quote: "Owns stable node and handler storage in one allocation prepared before use."}
      - {path: task/ktimer-core/src/set.rs, item: ktimer_core::set::TimerSet, quote: "Nodes remain externally owned and may participate in only one set at a time."}
  errors_bounds:
    value: "start_on returns KResult<(owner CPU, newly_added)>: InvalidInput if the deadline exceeds u64::MAX ns or cpu is outside the set; N must be > 0; deadlines are absolute monotonic ns"
    evidence:
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer::start_on, quote: "Returns [`kerrno::KError::InvalidInput`] if the deadline exceeds"}
      - {path: task/ktimer-core/src/set.rs, item: ktimer_core::set::TimerSet::new, quote: 'assert!(N > 0, "timer set requires at least one CPU");'}
  concurrency:
    value: "per-CPU spinlocks with owner-CPU routing; callback rearm and external starts serialize under the owner lock and the last successful setting wins; start_on is unsafe: platform glue must pin the CPU and notify the actual owner"
    evidence:
      - {path: task/ktimer-core/src/control.rs, item: ktimer_core::control::TimerControl::rearm, quote: "Callback rearm and external starts serialize under the same owner lock;"}
      - {path: task/ktimer-core/src/timer.rs, item: ktimer_core::timer::Timer::start_on, quote: "Platform glue must select an initialized, serviceable CPU, pin execution"}
