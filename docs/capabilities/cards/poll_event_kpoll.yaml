aliases:
  en: [generation counter event, broadcast event, sequence-count wakeup, eventcount, seqcount wait, notify all with recheck, condvar broadcast]
  zh: [代数计数事件, 事件计数器, 广播事件, 状态变化通知, 防丢唤醒]
identifiers: [generation, epoch, seq, sequence, notify_all, has_changed, changed_since, AtomicUsize, fetch_add]
exclusions:
- all waiters wake on every notify and must re-evaluate their own predicate; not a one-waiter handoff
- carries no payload or completion token; for done/wait pairs use kcompletion (completion_tokens)
- A finite usize generation wraps. Equality proves no observed change only if a complete counter wrap
  cannot occur between sampling and recheck; wake callbacks still require the caller execution-context
  contract.
counter_examples: []
notes: >-
  Whether PollEvent is used in production code (versus tests) was not inventoried; used_by lists
  crates depending on kpoll, which is the superset.
