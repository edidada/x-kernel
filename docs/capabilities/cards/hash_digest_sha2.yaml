  - "not for integrity checksums of data in transit where CRC is enough, and not a password KDF"
  - "Cargo.lock also holds sha2 0.10.9, pulled in by ed25519-dalek, not a direct dependency of workspace crates"
counter_examples:
  - path: tee/tee_crypto/src/algorithms/hash.rs
    item: tee_crypto::algorithms::hash::HashAlgorithm
    why: "tee_crypto::algorithms::hash already exposes SHA-1/224/256/384/512, SM3 and MD5 behind one HashAlgorithm selector and Digest trait; a new hashing need inside the TEE crypto layer should use it"
    evidence: [{path: tee/tee_crypto/src/algorithms/hash.rs, quote: "Hash abstraction — SHA-1/224/256/384/512, SM3, MD5."}]
notes: The intended public Digest entry points are sha2::Sha224, Sha256, Sha384 and Sha512 generated by
  digest::buffer_fixed! in src/lib.rs. Block cores are lower-level helpers and do not themselves expose
  the advertised buffered Digest API. compress256/compress512 are inside private modules and are not public
  root imports. The current indexer cannot resolve the generated structs; exclude this card from automatic
  symbol-based replacement suggestions until catalogue/index owner resolves that gap.
