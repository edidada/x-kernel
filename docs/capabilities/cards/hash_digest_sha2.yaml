capability: hash_digest_sha2
title: SHA-2 family hash functions (sha2 Sha224 / Sha256 / Sha384 / Sha512)
family: crypto.hash
summary: The RustCrypto sha2 crate exports macro-generated Sha224/Sha256/Sha384/Sha512 buffered hashers
  through digest::Digest (new/update/finalize). tee_crypto wraps these in its HashAlgorithm / Digest abstraction.
  Listed block-core helpers are not substitutes for the buffered hashers.
