aliases:
  en: [phys_addr, virt_addr, paddr, vaddr, address newtype, address range, addr range, page iterator, page range, memory range, overlap check, contains range]
  zh: [物理地址, 虚拟地址, 地址类型, 地址区间, 地址范围, 页迭代器, 范围重叠, 范围包含]
identifiers: [paddr, vaddr, PhysAddr, VirtAddr, start, end, size, overlaps, contains, start_addr, end_addr, page_iter, step_by, PAGE_SIZE]
exclusions:
  - the types do not validate that an address is mapped, user-accessible or in a particular region; use the user-memory capabilities (osvm, kuaccess) for access checks
  - no VMA or memory-area bookkeeping here; this is only a value type and range arithmetic
  - alignment-only needs are covered by the free functions in the sibling card mm_align_helpers_memaddr
counter_examples: []
notes: >-
  PhysAddr and VirtAddr are generated by the def_usize_addr! macro, so the struct item is the macro
  invocation lines (507-508). Address arithmetic helpers (checked_add, wrapping_add, offset_from,
  sub_addr ...) are default methods of MemoryAddr and AddrOps, blanket-implemented for any
  Copy + From<usize> + Into<usize> + Ord type.
