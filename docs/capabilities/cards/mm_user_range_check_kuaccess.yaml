capability: mm_user_range_check_kuaccess
title: User-range validation and scoped user-memory access window (kuaccess::check_access / access_user_memory)
family: mm.user_access
summary: >-
  check_access(start, len) is the cheap range test that a [start, start+len) region lies inside the
  user address space; access_user_memory(f) marks the current thread as accessing user memory for the
  duration of a closure so kernel page faults on user addresses are resolved instead of oopsing.
source: {kind: workspace, crate: kuaccess, path: core/kuaccess}
symbols:
  - {fqn: kuaccess::check_access, kind: fn, path: core/kuaccess/src/lib.rs, role: primary}
  - {fqn: kuaccess::access_user_memory, kind: fn, path: core/kuaccess/src/lib.rs, role: primary}
operations:
  - name: range_check
    symbols: [kuaccess::check_access]
    effect: Ok when start is in the user range and len bytes fit before the end of user space, else NoAccess
    evidence:
      - {path: core/kuaccess/src/lib.rs, item: kuaccess::check_access, quote: "Briefly checks if the given memory region is valid user memory."}
      - {path: core/kuaccess/src/lib.rs, item: kuaccess::check_access, quote: "(USER_SPACE_BASE..USER_SPACE_END).contains(&start) && (USER_SPACE_END - start) >= len;"}
  - name: scoped_window
    symbols: [kuaccess::access_user_memory]
    effect: sets the thread flag accessing_user_memory around f(); the page-fault handler consults it
    evidence:
      - {path: core/kuaccess/src/lib.rs, item: kuaccess::access_user_memory, quote: "thread.set_accessing_user_memory(true);"}
usage_protocol:
  - step: call check_access before taking a raw user pointer into assembly copy routines; wrap fault-tolerant user access in access_user_memory
    evidence: [{path: core/kuaccess/src/lib.rs, item: kuaccess::access_user_memory, quote: "Enables scoped access into user memory, allowing page faults to occur inside"}]
contract:
  no_std:
    value: yes (#![no_std])
    evidence:
    - path: core/kuaccess/src/lib.rs
      quote: '#![no_std]'
  allocation:
    value: unknown
    evidence: []
  blocking:
    value: unknown
    evidence: []
  irq_nmi:
    value: unknown
    evidence: []
  ownership_lifetime:
    value: access_user_memory sets the current thread flag true, calls f, then unconditionally sets false
      on normal return. It does not save/restore a prior true value and has no unwind cleanup guard; check_access
      only validates numeric bounds.
    evidence:
    - path: core/kuaccess/src/lib.rs
      item: kuaccess::access_user_memory
      quote: let result = f();
    - path: core/kuaccess/src/lib.rs
      item: kuaccess::access_user_memory
      quote: thread.set_accessing_user_memory(false);
  errors_bounds:
    value: check_access returns Err(MemError::NoAccess) for any start outside user space or len overflowing
      the user range; access_user_memory panics outside thread context
    evidence:
    - path: core/kuaccess/src/lib.rs
      item: kuaccess::check_access
      quote: if unlikely(!is_accessible) {
    - path: core/kuaccess/src/lib.rs
      item: kuaccess::access_user_memory
      quote: panic!("access_user_memory called outside of thread context");
  concurrency:
    value: unknown
    evidence: []
