aliases:
  en:
  - access_ok
  - user_addr_ok
  - valid_user_range
  - is_user_address
  - range_ok
  - uaccess_begin
  - user address check
  zh:
  - 用户地址范围检查
  - 用户地址合法性
  - 用户态访问窗口
  - 地址是否属于用户空间
identifiers: [access_ok, USER_SPACE_BASE, USER_SPACE_SIZE, USER_SPACE_END, is_user_addr, user_range, "start + len", checked_add, TASK_SIZE]
exclusions:
- check_access only tests the address range, not whether pages are mapped or permitted; the actual copy
  still faults and may fail
- the range test is against the fixed USER_SPACE_BASE..USER_SPACE_END, not a per-process VMA lookup
- access_user_memory is a thread flag helper, not hardware stac/set_fs and not a nestable or unwind-safe
  access guard. Prefer osvm checked-copy APIs; direct raw access requires its own fault/provenance protocol.
counter_examples: []
status: needs-owner
open_questions:
- field: usage_protocol
  question: "The user-access helper clears the flag on normal return but does not save the previous value and has no unwind guard. Should nesting and early exit be ruled out, or should the helper restore the prior state?"
  evidence:
  - path: core/kuaccess/src/lib.rs
    item: kuaccess::access_user_memory
    quote: "let result = f();"
