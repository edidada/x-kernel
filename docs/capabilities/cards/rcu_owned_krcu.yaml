operations:
  - name: read
    symbols: [krcu::Rcu::with_read, krcu::Rcu::read, krcu::with_read, krcu::with_interrupt_read]
    effect: borrow the published value for the duration of a scope; only owned results may escape; the reader never blocks writers
    evidence:
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::with_read, quote: "Only owned results may escape the closure"}
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::read, quote: "let value = self.value.load(Ordering::Acquire);"}
  - name: replace_sync
    symbols: [krcu::Rcu::replace_sync]
    effect: atomically exchanges the published allocation, waits for a grace period, returns the old Box (or the unused new Box with an error and no exchange)
    evidence:
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::replace_sync, quote: "let old = self.value.swap(Box::into_raw(new_value), Ordering::AcqRel);"}
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::replace_sync, quote: "Returns the old allocation only after its protected readers have exited."}
  - name: synchronize_rcu
    symbols: [krcu::synchronize_rcu]
    effect: low-level wait for a future grace period for callers that withdrew and retain their own objects; unsafe
    evidence:
      - {path: sync/krcu/src/lib.rs, quote: "for unsafe integrations that withdraw and retain their own objects"}
usage_protocol:
  - step: "initialize the boot RCU service (init_service) before any wait or read"
    evidence: [{path: sync/krcu/src/lib.rs, quote: "[`init_service`] is a boot integration operation."}]
  - step: "read inside with_read / Rcu::with_read in task context, or with_interrupt_read in a watched IRQ/NMI handler; do not voluntarily sleep inside"
    evidence:
      - {path: sync/krcu/src/lib.rs, quote: "Initialized hardirq, softirq and NMI handlers use [`with_interrupt_read`]"}
  - step: "update with replace_sync from sleepable task context holding no lock needed by readers"
    evidence: [{path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::replace_sync, quote: "The caller must hold no lock needed by a reader or the progress service."}]
contract:
  no_std:
    value: "yes (#![no_std], uses alloc)"
    evidence: [{path: sync/krcu/src/lib.rs, quote: "#![no_std]"}]
  allocation:
    value: "Rcu::new takes an existing Box and does not allocate; reads do not allocate; replace_sync preparation and wait do not allocate, but callback storage still uses the kernel's fatal OOM policy"
    evidence:
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::new, quote: "Takes ownership of an initialized allocation without waiting or allocating."}
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::replace_sync, quote: "callback storage still follows the kernel's fatal OOM policy"}
  blocking:
    value: "read scopes must not voluntarily sleep or yield (preemption and migration allowed); replace_sync and synchronize_rcu sleep until the grace period ends and need sleepable task context outside read scopes"
    evidence:
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::with_read, quote: "not voluntarily sleep or yield, though involuntary preemption and"}
      - {path: sync/krcu/src/lib.rs, quote: "Synchronous waits and drains require sleepable task context outside read"}
  irq_nmi:
    value: "readers: with_read panics in IRQ/NMI/BH-disabled context; with_interrupt_read is the entry for initialized hardirq, softirq and NMI handlers. Waiting (replace_sync) is not allowed there"
    evidence:
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::with_read, quote: "Panics outside watched task context, including interrupt handlers and"}
      - {path: sync/krcu/src/read.rs, item: krcu::read::with_interrupt_read, quote: "Panics outside watched hardirq, serving-softirq or NMI context, if current"}
  ownership_lifetime:
    value: "Rcu<T> owns the current Box<T>; readers get only scoped shared borrows tied to the scope; dropping the container drops the current value directly with no grace period"
    evidence:
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu, quote: "Readers receive only scoped shared"}
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu, quote: "directly in the dropping context, without another grace period."}
  errors_bounds:
    value: "replace_sync returns Err((KError, unused Box)) with InvalidInput outside sleepable task context (including inside a read scope) or BadState before service readiness; publication unchanged on error"
    evidence:
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::replace_sync, quote: "Returns `InvalidInput` outside sleepable task context, including inside"}
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu::replace_sync, quote: "pub fn replace_sync(&self, new_value: Box<T>) -> Result<Box<T>, (KError, Box<T>)>"}
  concurrency:
    value: "lock-free readers (Acquire load of an AtomicPtr); concurrent replacements may overlap and each gets its own displaced allocation; not CAS and not a lock for interior mutable state; Sync only for T: Send + Sync"
    evidence:
      - {path: sync/krcu/src/owned.rs, item: krcu::owned::Rcu, quote: "Concurrent replacements may"}
      - {path: sync/krcu/src/owned.rs, quote: "unsafe impl<T: Send + Sync> Sync for Rcu<T> {}"}
