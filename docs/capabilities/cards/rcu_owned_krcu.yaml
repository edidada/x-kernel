  - {fqn: krcu::Rcu::read, kind: fn, path: sync/krcu/src/owned.rs, role: operation}
  - {fqn: krcu::Rcu::replace_sync, kind: fn, path: sync/krcu/src/owned.rs, role: operation}
  - {fqn: krcu::ReadScope, kind: struct, path: sync/krcu/src/read.rs, role: helper}
  - {fqn: krcu::with_read, kind: fn, path: sync/krcu/src/read.rs, role: operation}
  - {fqn: krcu::with_interrupt_read, kind: fn, path: sync/krcu/src/read.rs, role: operation}
