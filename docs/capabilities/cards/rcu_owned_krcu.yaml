capability: rcu_owned_krcu
title: RCU-protected owning pointer with scoped reads and synchronous replace (krcu::Rcu)
family: sync.rcu
summary: >-
  Kernel RCU publication container. Rcu<T> owns the currently published Box<T>; readers borrow it
  inside a read scope (with_read / with_interrupt_read) without locks or reference counts, and
  replace_sync swaps in a new allocation, waits one grace period and returns the old Box. Several
  old versions may coexist while their readers finish. Not a lock and not an atomic multi-object
  snapshot.
source: {kind: workspace, crate: krcu, path: sync/krcu}
