exclusions:
- 'Rcu is not a lock: it does not serialize writers, protect interior-mutable state, or give an atomic
  snapshot across two containers; use one Rcu for a snapshot replaced atomically'
- 'replace_sync sleeps for a grace period: not usable from IRQ/softirq/NMI, with IRQs or preemption disabled,
  or inside a read scope; use PreparedCallback (rcu_callback_krcu) for asynchronous destruction'
- read scopes forbid voluntary sleep; data read in a scope that must sleep needs its own reference (e.g.
  Arc<T> cloned inside the scope)
- 'replace_sync is an exchange, not compare-and-swap: overlapping successful callers each receive the
  allocation displaced by their own exchange, which may be the original value or an earlier replacement.
  It does not serialize a read-modify-write transaction.'
