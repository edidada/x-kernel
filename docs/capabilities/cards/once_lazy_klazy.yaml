operations:
  - name: call_once
    symbols: [klazy::Once::call_once, klazy::Once::try_call_once]
    effect: runs the closure on the first call, stores its value, returns &T; other callers spin-wait during initialization; try_call_once resets to uninitialized on Err so it can be retried
    evidence:
      - {path: util/klazy/src/once.rs, item: klazy::once::Once::call_once, quote: "This method will spin-wait if another thread is currently performing"}
      - {path: util/klazy/src/once.rs, item: klazy::once::Once, quote: "closure returns `Err`, the cell is reset to `Uninitialized` and can be retried"}
  - name: wait_poll
    symbols: [klazy::Once::wait, klazy::Once::poll, klazy::Once::get]
    effect: get is a non-blocking Option<&T>; poll spins while initializing and returns None if initialization never began; wait spins until a value exists
    evidence:
      - {path: util/klazy/src/once.rs, item: klazy::once::Once::poll, quote: "Like [`Once::get`], but will **spin-wait** if the [`Once`] is in the process"}
  - name: lazy_force
    symbols: [klazy::Lazy::force, klazy::Lazy::new]
    effect: Lazy::new is const (static-friendly); first Deref or force runs the factory once
    evidence:
      - {path: util/klazy/src/lazy.rs, item: klazy::lazy::Lazy::new, quote: "This is a `const` constructor and can be used to initialize statics."}
usage_protocol:
