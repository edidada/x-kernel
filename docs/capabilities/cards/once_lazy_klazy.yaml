contract:
  no_std:
    value: 'yes (cfg_attr: no_std unless test)'
    evidence:
    - path: util/klazy/src/lib.rs
      quote: '#![cfg_attr(not(test), no_std)]'
  allocation:
    value: Once and Lazy store the value inline (MaybeUninit<T>) and do not themselves allocate; the init
      closure may
    evidence:
    - path: util/klazy/src/once.rs
      item: klazy::once::Once
      quote: 'storage: UnsafeCell<MaybeUninit<T>>,'
  blocking:
    value: coordination uses spin-wait without a sleeping wait primitive or timeout; contenders spin while
      initialization is running. This does not constrain arbitrary work performed by the supplied initializer.
    evidence:
    - path: util/klazy/src/once.rs
      item: klazy::once::Once
      quote: uses spin-wait for coordination during
    - path: util/klazy/src/once.rs
      item: klazy::once::Once::wait
      quote: There is no timeout or blocking primitive involved.
  irq_nmi:
    value: unknown
    evidence: []
  ownership_lifetime:
    value: the cell owns the value for its lifetime and hands out shared references; no way to take the
      value out of a shared cell; Lazy consumes its factory exactly once
    evidence:
    - path: util/klazy/src/lazy.rs
      item: klazy::lazy::Lazy
      quote: it is consumed via
  errors_bounds:
    value: if the init closure panics the cell is permanently poisoned and later accesses panic; try_call_once
      returns the closure's Err and stays retryable
    evidence:
    - path: util/klazy/src/once.rs
      item: klazy::once::Once
      quote: If the initialization closure panics, the `Once` is permanently poisoned.
    - path: util/klazy/src/once.rs
      item: klazy::once::Once::try_call_once
      quote: 'pub fn try_call_once<F: FnOnce() -> Result<T, E>, E>(&self, f: F) -> Result<&T, E>'
  concurrency:
    value: 'Once<T> is Sync for T: Send + Sync; after initialization access is a single atomic load; Lazy<T,
      F> is Sync when Once<T>: Sync and F: Send'
    evidence:
    - path: util/klazy/src/once.rs
      quote: 'unsafe impl<T: Send + Sync> Sync for Once<T> {}'
    - path: util/klazy/src/once.rs
      item: klazy::once::Once
      quote: After initialization, access is a single atomic load.
