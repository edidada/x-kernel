capability: once_lazy_klazy
title: Spin-based one-time init cell, lazy value and lazy_static! macro (klazy::Once / Lazy / lazy_static)
family: sync.once_lazy
summary: >-
  no_std one-time initialization for statics. Once<T> runs a closure exactly once (call_once,
  fallible try_call_once that stays retryable, wait/poll that spin until initialized) and hands out
  &T; Lazy<T, F> wraps it as a deref-initialized value usable in statics; lazy_static! declares
  `static ref NAME: T = init` statics that deref to T like the lazy_static crate. Coordination
  during initialization is a spin-wait; there is no sleeping.
