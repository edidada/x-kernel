capability: softirq_kirq
title: Fixed-vector per-CPU softirq (kirq::softirq open_softirq / raise_softirq)
family: irq.deferred
summary: >-
  Linux-style softirq/bottom half. Ten fixed SoftirqVec vectors (High, Timer, NetTx, NetRx, Block,
  IrqPoll, Tasklet, Sched, Hrtimer, Rcu); a handler (fn()) is registered once per vector at init with
  open_softirq(s); raise_softirq / raise_softirq_irqoff set a per-CPU pending bit; actions run at IRQ
  exit, BH-enable or in the ksoftirqd daemon with preemption disabled and local IRQs enabled. Actions
  must not sleep. The Tasklet and High vectors host kworkng bottom-half work.
