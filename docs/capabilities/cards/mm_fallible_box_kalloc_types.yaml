capability: mm_fallible_box_kalloc_types
title: Fallible heap box that returns NoMemory instead of aborting (kalloc-types KBox)
family: mm.fallible_alloc
summary: >-
  KBox<T> is an exclusively owned heap value whose constructors return KResult<Self> with
  KError::NoMemory on allocation failure instead of going through the fatal GlobalAlloc OOM path.
  new() requires sleepable task context, new_nowait() uses AllocFlags::NOWAIT, new_with_flags takes
  an explicit AllocFlags policy.
source: {kind: workspace, crate: kalloc-types, path: mm/kalloc-types}
symbols:
  - {fqn: kalloc_types::KBox, kind: struct, path: mm/kalloc-types/src/kbox.rs, role: primary}
  - {fqn: kalloc_types::KBox::new, kind: fn, path: mm/kalloc-types/src/kbox.rs, role: constructor}
  - {fqn: kalloc_types::KBox::new_nowait, kind: fn, path: mm/kalloc-types/src/kbox.rs, role: constructor}
  - {fqn: kalloc_types::KBox::new_with_flags, kind: fn, path: mm/kalloc-types/src/kbox.rs, role: constructor}
  - {fqn: kalloc_types::KBox::into_inner, kind: fn, path: mm/kalloc-types/src/kbox.rs, role: operation}
operations:
  - name: fallible_new
    symbols: [kalloc_types::KBox::new, kalloc_types::KBox::new_nowait, kalloc_types::KBox::new_with_flags]
    effect: allocate and move a value in; KError::NoMemory on failure, dropping the value; new_with_flags also returns KError::InvalidInput for unknown flag bits; zero-sized values need no allocation
    evidence:
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox::new, quote: "Returns [`KError::NoMemory`] if storage cannot be allocated, dropping"}
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox::new_with_flags, quote: "[`KError::InvalidInput`] for unknown flag bits (including for ZSTs)."}
usage_protocol:
  - step: pick the constructor by context (new needs sleepable task context; new_nowait for non-sleeping paths) and propagate the KResult
    evidence: [{path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox::new, quote: "Requires sleepable task context, with no"}]
contract:
  no_std:
    value: "yes"
    evidence: [{path: mm/kalloc-types/src/lib.rs, quote: "#![no_std]"}]
  allocation:
    value: allocates one block from the kalloc global allocator (none for zero-sized values); failure returns KError::NoMemory
    evidence:
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox::new_with_allocator, quote: "NonNull::dangling()"}
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::allocate, quote: ".map_err(|_| KError::NoMemory)"}
  blocking:
    value: new() requires a context that permits sleeping; new_nowait() storage allocation does not sleep or enter reclaim; the current backend never performs sleeping reclaim
    evidence:
      - {path: mm/kalloc-types/src/lib.rs, quote: "success. The current backend never performs sleeping reclaim."}
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox::new_nowait, quote: "The storage allocation does not sleep or enter reclaim IO/filesystem"}
  irq_nmi:
    value: new_nowait is not a blanket interrupt-safety guarantee (caller must satisfy allocator reentrancy and lock-order requirements); NMI safety is not promised
    evidence:
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox::new_nowait, quote: "NMI safety is not promised."}
  ownership_lifetime:
    value: exclusive owner; Drop destroys the value and releases storage; no pinning, no implicit cloning
    evidence:
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox, quote: "This type does not provide pinning or implicit cloning."}
  errors_bounds:
    value: KError::NoMemory when storage cannot be allocated; KError::InvalidInput for unknown flag bits (new_with_flags); the supplied value is dropped on failure
    evidence:
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox::new_with_flags, quote: "The supplied value is dropped on failure; no partial owner is returned."}
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox::new_with_flags, quote: "[`KError::InvalidInput`] for unknown flag bits (including for ZSTs)."}
      - {path: mm/kalloc-types/src/kbox.rs, item: kalloc_types::kbox::KBox::new, quote: "Returns [`KError::NoMemory`] if storage cannot be allocated, dropping"}
  concurrency:
    value: unknown
    evidence: []
