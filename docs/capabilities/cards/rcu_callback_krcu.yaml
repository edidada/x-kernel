    symbols: [krcu::PreparedCallback::submit]
    effect: consumes the submission right; the node's callback runs after a grace period in softirq context; on rejection the handle is returned unchanged
    evidence:
      - {path: sync/krcu/src/callback.rs, item: krcu::callback::PreparedCallback::submit, quote: "pub unsafe fn submit(self) -> Result<(), (KError, Self)>"}
      - {path: sync/krcu/src/lib.rs, quote: "the callback executes later"}
  - name: drain_callbacks
    symbols: [krcu::drain_callbacks]
    effect: waits for callbacks accepted before the call to return (not merely for a grace period)
    evidence: [{path: sync/krcu/src/drain.rs, item: krcu::drain::drain_callbacks, quote: "Waits for callbacks accepted before this call to return, not merely for a GP."}]
  - name: preflight_callback_submission
    symbols: [krcu::preflight_callback_submission]
    effect: checks task context and service readiness before a destructive update; transfers no ownership
    evidence: [{path: sync/krcu/src/lib.rs, quote: "[`preflight_callback_submission`] checks task context and permanent service"}]
usage_protocol:
- step: Embed a stable CallbackNode in retained storage with correct layout/provenance recovery for callback
    and cancellation; withdraw all publication routes, adopt the sole submission right with unsafe PreparedCallback::new,
    then submit. A zero-offset repr(C) header is one layout strategy, not an API requirement.
  evidence:
  - path: sync/krcu/src/callback.rs
    item: krcu::callback::PreparedCallback::submit
    quote: Withdraw all publication routes to the retired data before submission.
  - path: sync/krcu/src/callback.rs
    item: krcu::callback::PreparedCallback::new
    quote: pub unsafe fn new(
  - path: sync/krcu/src/callback.rs
    item: krcu::callback::PreparedCallback::new
    quote: Both cancellation and invocation must use this exact node layout/provenance.
- step: 'teardown: stop producers and reposts first, then drain_callbacks; downstream work needs its own
    completion protocol'
  evidence:
  - path: sync/krcu/src/drain.rs
    item: krcu::drain::drain_callbacks
    quote: Teardown must stop producers and reposts first.
