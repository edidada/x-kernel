  irq_nmi:
    value: "submit supported from task, hardirq and softirq context after initialization; rejected in NMI; preflight and drain are task-context only"
    evidence:
      - {path: sync/krcu/src/callback.rs, item: krcu::callback::PreparedCallback::submit, quote: "Returns `InvalidInput` in NMI or unwatched execution, or `BadState` when"}
      - {path: sync/krcu/src/callback.rs, item: krcu::callback::PreparedCallback::submit, quote: "Task, hardirq and softirq submissions are supported after initialization;"}
  ownership_lifetime:
    value: "PreparedCallback owns the right to submit one node or release its resources; dropping an unsubmitted handle calls only the cancel function, never the callback; no Clone; node must stay at a stable address until invocation or cancellation"
    evidence:
      - {path: sync/krcu/src/callback.rs, item: krcu::callback::PreparedCallback, quote: "Owns the right to submit one node or release its unsubmitted resources."}
      - {path: sync/krcu/src/callback.rs, item: krcu::callback::PreparedCallback::new, quote: "initialized, unqueued node at a stable address."}
  errors_bounds:
    value: "submit returns Err((KError, handle)): InvalidInput in NMI/unwatched, BadState when service unavailable; handle returned for retry; rejection is not permission to reclaim retired data"
    evidence:
