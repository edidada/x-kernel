capability: rcu_callback_krcu
title: Deferred RCU callback with intrusive node (krcu::PreparedCallback, call_rcu style)
family: sync.rcu
summary: >-
  Asynchronous post-grace-period callback. A CallbackNode is embedded in caller-owned storage,
  adopted by an unsafe PreparedCallback::new, and submitted without allocating; the callback runs
  later in non-sleepable softirq context after a grace period. drain_callbacks waits for already
  accepted callbacks (rcu_barrier style). preflight_callback_submission checks admission before a
  destructive update.
