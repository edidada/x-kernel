aliases:
  en: [event, eventcount, notify, listener, condvar, condition variable, waiter list, wake-one, wake-all, async notify, wait_event, Notify, tokio Notify]
  zh: [事件通知, 事件计数, 条件变量, 监听者, 等待者列表, 唤醒一个, 唤醒全部]
